name: Translation problem
description: A translated text is wrong, unclear or missing
labels: ["translation"]
body:
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: de-DE
    validations:
      required: true
  - type: input
    id: key
    attributes:
      label: Language key
      description: The key on the left of the line in the .ini file, if you know it
      placeholder: COM_TUF_ED_...
  - type: textarea
    id: problem
    attributes:
      label: What is wrong?
      description: The current text, what it should say, and where you saw it in TUF_ED
    validations:
      required: true
