PLG_SYSTEM_TUFED="Système - TUF Extension Developer"
PLG_SYSTEM_TUFED_MAIL_EXT_INSTALLED="Une extension qui ne fait partie ni de Joomla ni de TUF a été installée.\n\nExtension : %1$s\nVersion : %2$s\nInstallée par : %3$s\n\nElle s'exécute dans le même processus PHP que le code de signature. Les clés en ligne ne sont pas utilisées tant qu'elle n'est pas supprimée ou explicitement autorisée (Configuration → Extensions)."
PLG_SYSTEM_TUFED_MAIL_EXT_SUBJECT="[%s] TUF_ED : extension installée ou mise à jour"
PLG_SYSTEM_TUFED_MAIL_EXT_UPDATED="Une extension qui ne fait partie ni de Joomla ni de TUF a été mise à jour.\n\nExtension : %1$s\nVersion : %2$s\nMise à jour par : %3$s\n\nUne autorisation prend fin à chaque modification de l'extension : les clés en ligne ne sont pas utilisées tant que vous n'avez pas à nouveau autorisé la nouvelle version (Configuration → Extensions)."
PLG_SYSTEM_TUFED_MAIL_FOOTER="Ce message a été envoyé immédiatement par le plugin système TUF_ED (plg_system_tufed) à tous les utilisateurs du groupe TUF_ED Owner."
PLG_SYSTEM_TUFED_MAIL_ROLES_CHANGED="Les rôles TUF_ED d'un compte ont changé.\n\nCompte : %1$s\nAvant : %2$s\nMaintenant : %3$s\nModifié par : %4$s\n\nSi vous ne vous attendiez pas à cette modification, vérifiez immédiatement le compte sous Utilisateurs → Gérer : les TUF_ED Owners et les TUF_EDC Signers peuvent signer des paquets."
PLG_SYSTEM_TUFED_MAIL_ROLES_DELETED="Un compte ayant un rôle TUF_ED a été supprimé.\n\nCompte : %1$s\nRôles : %2$s\nSupprimé par : %4$s\n\nVérifiez dans le tableau de bord TUF_ED que chaque rôle dispose encore d'un compte utilisable."
PLG_SYSTEM_TUFED_MAIL_ROLES_SUBJECT="[%s] TUF_ED : appartenance aux rôles modifiée"
PLG_SYSTEM_TUFED_ROLE_CONFLICT="Séparation des rôles TUF_ED : le compte &quot;%1$s&quot; aurait %2$s. Un compte ne peut avoir qu'un seul rôle TUF_ED, et un Super Utilisateur aucun. Utilisez un compte distinct (avec sa propre adresse e-mail ou son propre alias) pour chaque rôle."
PLG_SYSTEM_TUFED_WARN_INTEGRITY="<strong>TUF_ED : l'instance ne correspond pas à son état de référence confirmé</strong> (%1$s). TUF_ED refuse toute manipulation de clés jusqu'à ce qu'un Owner ait examiné et confirmé les modifications. <a href=\"%2$s\">Examiner les modifications</a>."
PLG_SYSTEM_TUFED_WARN_NOT_CLEAN="<strong>TUF_ED : cette instance Joomla n'est pas propre.</strong> %1$d extension(s) ne sont pas autorisées ou ont été modifiées depuis leur autorisation : %2$s. Chaque extension s'exécute dans le même processus PHP que le code de signature. <a href=\"%3$s\">Vérifier les extensions</a>."
PLG_SYSTEM_TUFED_WARN_OWN_FILES="<strong>TUF_ED : ses propres fichiers ne passent pas la vérification</strong> (%1$s). TUF_ED refuse toute manipulation de clés et toute publication jusqu'à ce que ce soit corrigé. <a href=\"%2$s\">Afficher les détails</a>."
PLG_SYSTEM_TUFED_WARN_ROLES="<strong>TUF_ED :</strong> la séparation des rôles n'est pas complète (un rôle n'a aucun compte utilisable, ou un compte a plus d'un rôle). <a href=\"%s\">Voir le tableau de bord</a>."
PLG_SYSTEM_TUFED_XML_DESCRIPTION="Protège l'instance TUF_ED : refuse d'enregistrer un compte ayant plus d'un rôle TUF_ED ou un rôle et le statut de Super Utilisateur, avertit immédiatement les TUF_ED Owners par e-mail lorsqu'un compte obtient ou perd un rôle ou qu'une extension est installée ou mise à jour, et affiche les avertissements TUF_ED sur chaque page de l'administration. Laissez-le activé."
