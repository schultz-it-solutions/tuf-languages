PLG_TASK_TUFED="Tâche - TUF Extension Developer"
PLG_TASK_TUFED_ALLOWLIST_DESC="Vérifie les propres fichiers de TUF_ED par rapport à la liste de fichiers figée, recalcule les sommes de contrôle des extensions autorisées et avertit les TUF_ED Owners par e-mail si les fichiers de TUF_ED ne passent pas la vérification ou si une extension est nouvelle, non autorisée ou modifiée."
PLG_TASK_TUFED_ALLOWLIST_TITLE="TUF_ED : vérification des extensions"
PLG_TASK_TUFED_DRIFT_DESC="Avertit les TUF_ED Owners par e-mail si un paramètre de l'étape de configuration a été rétabli, si un rôle n'a aucun compte utilisable ou si un compte a plus d'un rôle."
PLG_TASK_TUFED_DRIFT_TITLE="TUF_ED : vérification de la configuration"
PLG_TASK_TUFED_EXPIRY_DESC="Avertit les TUF_ED Owners par e-mail 30 et 7 jours avant l'expiration de root.json ou de targets.json, et lorsque l'un d'eux a expiré. Rappelle également la date de révision de la déclaration de gestion des clés et les clés actives qu'elle ne décrit pas."
PLG_TASK_TUFED_EXPIRY_TITLE="TUF_ED : rappel d'expiration"
PLG_TASK_TUFED_INTEGRITY_DESC="Calcule le hachage de chaque fichier de l'instance Joomla, le compare à l'état de référence confirmé par un Owner et avertit les TUF_ED Owners par e-mail en cas de différence. L'e-mail liste aussi les dossiers exclus. À exécuter quotidiennement."
PLG_TASK_TUFED_INTEGRITY_TITLE="TUF_ED : vérification de l'instance"
PLG_TASK_TUFED_RENEW_DESC="À exécuter toutes les heures. Signe de nouveaux snapshot et timestamp avec les clés en ligne lorsqu'il reste moins de la moitié de leur durée de validité ou après une modification, et publie le dépôt. S'arrête (et avertit les TUF_ED Owners par e-mail) tant que l'instance n'est pas propre."
PLG_TASK_TUFED_RENEW_TITLE="TUF_ED : renouvellement de snapshot et timestamp"
PLG_TASK_TUFED_XML_DESCRIPTION="Tâches planifiées pour TUF_ED : rappels d'expiration, extensions autorisées, dérive de la configuration, vérification de l'instance et renouvellement horaire de snapshot et timestamp. Les e-mails sont envoyés à tous les utilisateurs de TUF_ED Owner."
