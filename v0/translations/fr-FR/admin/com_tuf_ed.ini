COM_TUF_ED_INTEGRITY_INTRO="Chaque fichier de cette instance Joomla est haché et comparé à l'état de référence confirmé par un Owner. Les dossiers dans lesquels Joomla écrit pendant l'exécution ne sont pas hachés, mais les fichiers exécutables qu'ils contiennent sont signalés (à l'exception des fichiers PHP qui ne peuvent pas exécuter de code, comme les entrées de cache et les fichiers journaux de Joomla). Après un événement d'installation ou une modification de la Configuration globale, les modifications restent en attente jusqu'à ce qu'un Owner les examine et les confirme. D'ici là, TUF_ED refuse toute manipulation de clés ; le renouvellement horaire de snapshot et timestamp continue. Il s'agit d'un fil-piège : quelqu'un qui peut exécuter du code en tant qu'utilisateur du serveur web peut modifier les fichiers, l'état de référence et cette vérification. Le code en dehors des fichiers (dans la base de données, en dehors du dossier Joomla, dans le cache d'opcodes) n'est pas couvert."
