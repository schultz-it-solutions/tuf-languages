COM_TUF_ED_CONFIG_MAIN_WEBSITE_DESC="Votre site web public (https://…). Utilisé dans le texte proposé pour la page hors ligne de ce site."
COM_TUF_ED_CONFIG_MAIN_WEBSITE_LABEL="Site web principal"
COM_TUF_ED_CONFIG_PRIVATE_PATH_DESC="En dehors de la racine web, par ex. /home/user/tuf_ed_private. Contient le secret qui scelle les clés en ligne snapshot et timestamp, ainsi que les paquets téléversés. Incluez-le dans vos sauvegardes, mais conservez ces sauvegardes séparément des sauvegardes de la base de données : le secret et la base de données ensemble ouvrent les clés en ligne."
COM_TUF_ED_CONFIG_PRIVATE_PATH_LABEL="Dossier privé"
COM_TUF_ED_CONFIG_PUBLISH_METHOD_DESC="Où le dépôt TUF public est écrit : un dossier sur ce serveur, ou un dossier sur un autre serveur via SFTP (par ex. le serveur de votre site web principal)."
COM_TUF_ED_CONFIG_PUBLISH_METHOD_LABEL="Méthode de publication"
COM_TUF_ED_CONFIG_PUBLISH_METHOD_LOCAL="Dossier sur ce serveur"
COM_TUF_ED_CONFIG_PUBLISH_METHOD_SFTP="SFTP vers un autre serveur"
COM_TUF_ED_CONFIG_PUBLISH_PACKAGES_DESC="Copier aussi les paquets signés dans le dossier de publication, sous la forme targets/&lt;sha256&gt;.&lt;name&gt;. Laissez désactivé si vous distribuez les paquets depuis votre serveur de mise à jour existant."
COM_TUF_ED_CONFIG_PUBLISH_PACKAGES_LABEL="Publier les paquets"
COM_TUF_ED_CONFIG_PUBLISH_PATH_DESC="Où le dépôt TUF public est écrit sous forme de fichiers statiques : un dossier de votre site web principal, ou un nouveau dossier sous la racine web de ce site (pas un dossier Joomla). Le serveur web distribue ces fichiers directement, même lorsque ce site est hors ligne."
COM_TUF_ED_CONFIG_PUBLISH_PATH_LABEL="Dossier de publication"
COM_TUF_ED_CONFIG_PUBLISH_URL_DESC="Adresse https://… à laquelle le dossier de publication est accessible. Les clients de mise à jour y récupèrent timestamp.json, les métadonnées versionnées et, s'ils sont publiés, les paquets."
COM_TUF_ED_CONFIG_PUBLISH_URL_LABEL="URL publique du dossier de publication"
COM_TUF_ED_CONFIG_REQUEST_LIFETIME_DESC="Durée pendant laquelle une demande de signature préparée peut être signée (1–30). Elle devient aussi inutilisable dès que ce sur quoi elle repose change."
COM_TUF_ED_CONFIG_REQUEST_LIFETIME_LABEL="Durée de validité des demandes de signature (jours)"
COM_TUF_ED_CONFIG_ROOT_EXPIRY_DESC="Durée de validité par défaut d'une nouvelle version de root.json. Les clients refusent une root expirée : signez donc une nouvelle version bien avant cette date."
COM_TUF_ED_CONFIG_ROOT_EXPIRY_LABEL="Expiration de root (jours)"
COM_TUF_ED_CONFIG_ROOT_LABEL="Métadonnées root"
COM_TUF_ED_CONFIG_SFTP_AUTH_DESC="Une clé est recommandée. Utilisez un compte SFTP qui n'a accès qu'au dossier du dépôt (chroot) : chaque fichier publié est signé, ce compte peut donc au pire bloquer les mises à jour, mais il ne doit avoir accès à rien d'autre."
COM_TUF_ED_CONFIG_SFTP_AUTH_KEY="Fichier de clé privée"
COM_TUF_ED_CONFIG_SFTP_AUTH_LABEL="Se connecter avec"
COM_TUF_ED_CONFIG_SFTP_AUTH_PASSWORD="Mot de passe"
COM_TUF_ED_CONFIG_SFTP_HOST_DESC="Nom d'hôte ou adresse IP du serveur qui distribue le dépôt, par ex. ssh.example.com."
COM_TUF_ED_CONFIG_SFTP_HOST_KEY_DESC="Empreinte SHA256 de la clé d'hôte du serveur, telle que l'affiche ssh-keygen -lf (SHA256:…). Rien n'est envoyé à un serveur ayant une autre clé. Laissez vide au début : Publier → Afficher la clé d'hôte montre ce que présente le serveur ; comparez-la avec l'empreinte indiquée par votre hébergeur avant de la saisir."
COM_TUF_ED_CONFIG_SFTP_HOST_KEY_LABEL="Empreinte de la clé d'hôte"
COM_TUF_ED_CONFIG_SFTP_HOST_LABEL="Hôte SFTP"
COM_TUF_ED_CONFIG_SFTP_KEY_FILE_DESC="Clé privée OpenSSH sans phrase secrète (nécessaire pour le renouvellement horaire), créée par ex. avec ssh-keygen -t ed25519 -N '' -f sftp_ed25519. Un simple nom de fichier est recherché dans le dossier privé ; un chemin absolu doit se trouver en dehors de la racine web. Permissions 0600."
COM_TUF_ED_CONFIG_SFTP_KEY_FILE_LABEL="Fichier de clé privée"
COM_TUF_ED_CONFIG_SFTP_PASSWORD_DESC="Le mot de passe n'est pas enregistré dans les options (base de données). Définissez-le sur la page Publier : TUF_ED le conserve dans le dossier privé. Un fichier de clé reste le meilleur choix."
COM_TUF_ED_CONFIG_SFTP_PASSWORD_LABEL="Mot de passe SFTP"
COM_TUF_ED_CONFIG_SFTP_PATH_DESC="Dossier sur le serveur SFTP que le serveur web distribue à l'URL publique ci-dessous, par ex. /var/www/example.com/tuf ou tuf (relatif au dossier de connexion). Il doit exister."
COM_TUF_ED_CONFIG_SFTP_PATH_LABEL="Dossier distant"
COM_TUF_ED_CONFIG_SFTP_PORT_LABEL="Port SFTP"
COM_TUF_ED_CONFIG_SFTP_USERNAME_LABEL="Nom d'utilisateur SFTP"
COM_TUF_ED_CONFIG_SIGNING_LABEL="Signature des paquets"
COM_TUF_ED_CONFIG_SITE_LABEL="Site"
COM_TUF_ED_CONFIG_SNAPSHOT_EXPIRY_DESC="Durée de validité de snapshot.json (1–30). Renouvelé automatiquement avec la clé snapshot en ligne lorsqu'il reste moins de la moitié."
COM_TUF_ED_CONFIG_SNAPSHOT_EXPIRY_LABEL="Expiration de snapshot (jours)"
COM_TUF_ED_CONFIG_STORAGE_DESC="Chemins absolus sur ce serveur. Les deux dossiers doivent exister et être accessibles en écriture pour PHP."
COM_TUF_ED_CONFIG_STORAGE_LABEL="Stockage"
COM_TUF_ED_CONFIG_TARGETS_EXPIRY_DESC="Durée de validité par défaut d'une nouvelle version de targets.json (7–365). Elle est signée avec votre clé targets hors ligne et donc renouvelée manuellement ; vous recevez des rappels 30 et 7 jours avant."
COM_TUF_ED_CONFIG_TARGETS_EXPIRY_LABEL="Expiration de targets (jours)"
COM_TUF_ED_CONFIG_TIMESTAMP_EXPIRY_DESC="Durée de validité de timestamp.json (4–168). Renouvelé automatiquement par la tâche horaire lorsqu'il reste moins de la moitié. Plus court signifie que les clients remarquent plus tôt un dépôt figé ; la tâche horaire doit alors s'exécuter de manière fiable."
COM_TUF_ED_CONFIG_TIMESTAMP_EXPIRY_LABEL="Expiration de timestamp (heures)"
COM_TUF_ED_CONFIG_UNINSTALL_DESTROY_DESC="Oui (par défaut) : la désinstallation de TUF_ED détruit les clés en ligne scellées (snapshot, timestamp), le fichier secret qui les scelle et le mot de passe SFTP enregistré. Ils ne peuvent plus être récupérés ensuite : après une nouvelle installation, vous générez de nouvelles clés en ligne et signez une nouvelle version de root. Choisissez Non uniquement si vous désinstallez pour réinstaller immédiatement ; les clés restent alors sur ce serveur jusqu'à ce que vous les supprimiez."
COM_TUF_ED_CONFIG_UNINSTALL_DESTROY_LABEL="À la désinstallation : détruire les clés en ligne"
COM_TUF_ED_CORE_UPDATES_AUTOMATED="Mises à jour automatiques du cœur"
COM_TUF_ED_CORE_UPDATES_AUTOMATED_AT_SIGNING="Mises à jour automatiques du cœur lors de la signature"
COM_TUF_ED_CORE_UPDATES_HEADING="Mises à jour automatiques de Joomla"
COM_TUF_ED_CORE_UPDATES_HELP="Laissez les mises à jour automatiques du cœur activées : un serveur de signature présentant une vulnérabilité Joomla connue compromet ce qu'il signe. Le service de mise à jour vérifie ce site via /api/index.php/v1/joomlaupdate/healthcheck, ce chemin doit donc rester accessible même lorsque le frontend est hors ligne. Si vous mettez à jour manuellement, consignez le motif et votre délai pour les versions de sécurité dans la déclaration de gestion des clés."
COM_TUF_ED_CORE_UPDATES_JUSTIFIED="Motif de la mise à jour manuelle"
COM_TUF_ED_CORE_UPDATES_JUSTIFIED_IN="Dans la version %d de la déclaration de gestion des clés"
COM_TUF_ED_CORE_UPDATES_NOT_AVAILABLE="Joomla ne propose les mises à jour automatiques qu'avec le canal de mise à jour &quot;Par défaut&quot; et la stabilité minimale &quot;Stable&quot;."
COM_TUF_ED_CORE_UPDATES_OPEN_OPTIONS="Ouvrir les options de Mise à jour de Joomla"
COM_TUF_ED_CORE_UPDATES_PLUGIN="Plugin &quot;Web Services - Joomla Update&quot;"
COM_TUF_ED_CORE_UPDATES_REGISTERED="Enregistré auprès du service de mise à jour"
COM_TUF_ED_CORE_UPDATES_WARN_OFF="Les mises à jour automatiques du cœur de Joomla sont désactivées, et la déclaration de gestion des clés signée ne donne aucun motif de mise à jour manuelle. <a href=\"%1$s\">Activez-les</a> (Mise à jour de Joomla → Options → Mises à jour automatiques), ou consignez le motif et votre délai pour les versions de sécurité dans la <a href=\"%2$s\">déclaration de gestion des clés</a> et signez-la."
COM_TUF_ED_CORE_UPDATES_WARN_PLUGIN="Le plugin &quot;Web Services - Joomla Update&quot; est désactivé. Sans lui, le service de mise à jour ne peut pas atteindre ce site (404 sur /api/index.php/v1/joomlaupdate/healthcheck) et l'enregistrement aux mises à jour automatiques échoue. <a href=\"%s\">Activez le plugin</a>, puis réactivez les mises à jour automatiques."
COM_TUF_ED_CORE_UPDATES_WARN_UNAVAILABLE="Les mises à jour automatiques du cœur de Joomla ne sont pas possibles avec les <a href=\"%1$s\">options de Mise à jour de Joomla</a> actuelles : elles exigent le canal de mise à jour &quot;Par défaut&quot; et la stabilité minimale &quot;Stable&quot;. Modifiez ces options, ou consignez le motif de la mise à jour manuelle dans la <a href=\"%2$s\">déclaration de gestion des clés</a> et signez-la."
COM_TUF_ED_CORE_UPDATES_WARN_UNREGISTERED="Les mises à jour automatiques du cœur de Joomla sont activées, mais ce site n'est pas encore enregistré auprès du service de mise à jour. Enregistrez à nouveau les <a href=\"%s\">options de Mise à jour de Joomla</a> ; si l'enregistrement échoue, vérifiez que /api/index.php/v1/joomlaupdate/healthcheck est accessible depuis Internet."
