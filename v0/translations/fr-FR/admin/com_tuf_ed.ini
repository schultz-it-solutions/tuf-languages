COM_TUF_ED_KEYS_GENERATE_DOWNLOAD="Le fichier de clé est téléchargé dès que vous cliquez sur le bouton, et seulement à ce moment-là : il n'est pas enregistré sur le serveur et ne peut donc pas être téléchargé à nouveau. Conservez-le en lieu sûr, puis allez dans la liste des clés et confirmez la nouvelle clé en téléversant le fichier une fois. D'ici là, la clé n'est pas utilisée. Une clé qui n'est pas confirmée dans les 24 heures est supprimée."
