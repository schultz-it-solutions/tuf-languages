COM_TUF_ED_OWN_INTRO="TUF_ED reconnaît ses propres fichiers à leur SHA-256, pas aux noms d'extension. Chaque version fournit une liste de ses fichiers ; à l'installation, le hachage de cette liste est figé dans le dossier privé. Chaque fichier listé doit correspondre, les dossiers de TUF_ED ne doivent rien contenir d'autre, et aucun template ne peut surcharger les pages de TUF_ED. Il s'agit d'un fil-piège contre du code étranger ou modifié : quelqu'un qui peut écrire à la fois dans les fichiers de TUF_ED et dans le dossier privé peut le déjouer. Contre une compromission complète du serveur, seule la signature hors ligne aide."
