COM_TUF_ED_LIBRARY_MISSING="lib_com_tuf 0.1.0 ou plus récent est requis. Installez ou mettez à jour la bibliothèque d'abord."
COM_TUF_ED_MAIL_CORE_UPDATES_BODY="Les mises à jour automatiques du cœur de Joomla sur cette instance TUF_ED nécessitent votre attention :\n\n%s\n\nUn serveur de signature présentant une vulnérabilité Joomla connue compromet ce qu'il signe. Ouvrez le tableau de bord TUF_ED (carte « Mises à jour automatiques de Joomla ») pour les détails et les liens."
COM_TUF_ED_MAIL_CORE_UPDATES_OFF="Les mises à jour automatiques du cœur sont désactivées, et la déclaration de gestion des clés signée ne donne aucun motif de mise à jour manuelle. Activez-les (Mise à jour de Joomla → Options → Mises à jour automatiques), ou consignez le motif et votre délai pour les versions de sécurité dans la déclaration de gestion des clés et signez-la."
COM_TUF_ED_MAIL_CORE_UPDATES_PLUGIN="Le plugin « Web Services - Joomla Update » est désactivé. Sans lui, le service de mise à jour ne peut pas atteindre ce site (404 sur /api/index.php/v1/joomlaupdate/healthcheck) et l'enregistrement aux mises à jour automatiques échoue. Activez-le sous Système → Plugins, puis réactivez les mises à jour automatiques."
COM_TUF_ED_MAIL_CORE_UPDATES_SUBJECT="[%s] TUF_ED : les mises à jour automatiques de Joomla nécessitent votre attention"
COM_TUF_ED_MAIL_CORE_UPDATES_UNAVAILABLE="Les mises à jour automatiques du cœur ne sont pas possibles avec les options actuelles de Mise à jour de Joomla : elles exigent le canal de mise à jour « Par défaut » et la stabilité minimale « Stable ». Modifiez ces options, ou consignez le motif de la mise à jour manuelle dans la déclaration de gestion des clés et signez-la."
COM_TUF_ED_MAIL_CORE_UPDATES_UNREGISTERED="Les mises à jour automatiques du cœur sont activées, mais ce site n'est pas encore enregistré auprès du service de mise à jour. Enregistrez à nouveau les options de Mise à jour de Joomla ; si l'enregistrement échoue, vérifiez que /api/index.php/v1/joomlaupdate/healthcheck est accessible depuis Internet."
COM_TUF_ED_MAIL_DRIFT_BODY="Ces vérifications de l'étape de configuration TUF_ED ne sont plus remplies :\n\n%s\n\nSi vous n'avez pas fait cette modification vous-même, découvrez qui l'a faite. Pour rétablir les paramètres, ouvrez Composants → TUF Extension Developer → Configuration."
COM_TUF_ED_MAIL_DRIFT_SUBJECT="[%s] TUF_ED : les paramètres de configuration ont changé"
COM_TUF_ED_MAIL_EXTENSIONS_BODY="Ces extensions sont installées sur l'instance TUF_ED mais ne sont pas autorisées, ou ont changé depuis leur autorisation :\n\n%s\n\nSi vous ne vous y attendiez pas, considérez l'instance comme compromise et n'y signez rien. Sinon, examinez les extensions sous Composants → TUF Extension Developer → Configuration → Extensions."
COM_TUF_ED_MAIL_EXTENSIONS_SUBJECT="[%s] TUF_ED : %d extension(s) non autorisée(s) ou modifiée(s)"
COM_TUF_ED_MAIL_FOOTER="Ce message a été envoyé par les tâches planifiées de TUF Extension Developer (com_tuf_ed) à tous les utilisateurs du groupe TUF_ED Owner. Un même constat n'est pas renvoyé ; un changement l'est."
COM_TUF_ED_MAIL_INTEGRITY_BODY="La vérification quotidienne de l'instance a trouvé des différences par rapport à l'état de référence confirmé par un Owner :\n\n%1$s\n\nDossiers exclus (non hachés ; les fichiers exécutables qu'ils contiennent sont signalés) :\n\n%2$s\n\nLa vérification a haché %3$s\n\nTUF_ED refuse toute manipulation de clés jusqu'à ce qu'un Owner ait examiné et confirmé les modifications ; le renouvellement horaire continue. Si une modification ne provient pas d'une mise à jour ou d'un changement de configuration dont vous avez connaissance, considérez l'instance comme compromise et n'y signez rien. Examinez les modifications sous Composants → TUF Extension Developer → Intégrité."
COM_TUF_ED_MAIL_INTEGRITY_SUBJECT="[%s] TUF_ED : l'instance diffère de son état de référence confirmé"
COM_TUF_ED_MAIL_KMS_DUE="Votre déclaration de gestion des clés (version %1$d) doit être révisée le %2$s."
COM_TUF_ED_MAIL_KMS_HOWTO="Pour la réviser : ouvrez Composants → TUF Extension Developer → Gestion des clés, vérifiez chaque clé (et que chaque copie s'ouvre toujours), enregistrez le brouillon et signez-le avec votre fichier de clé root. La signer à nouveau sans modification confirme la révision."
COM_TUF_ED_MAIL_KMS_KEYS_CHANGED="Vos clés actives ont changé depuis la dernière version signée de la déclaration."
COM_TUF_ED_MAIL_KMS_OVERDUE="La révision de votre déclaration de gestion des clés (version %1$d) était prévue le %2$s."
COM_TUF_ED_MAIL_KMS_SUBJECT="[%s] TUF_ED : révisez votre déclaration de gestion des clés"
COM_TUF_ED_MAIL_OWN_FILES_BODY="Les propres fichiers de TUF_ED sur cette instance ne correspondent pas à la liste des fichiers de la version installée, ou la liste ne correspond pas à son empreinte figée :\n\n%s\n\nTUF_ED refuse toute manipulation de clés et toute publication jusqu'à ce que ce soit corrigé ; le renouvellement horaire s'arrête également. Si vous n'avez pas modifié vous-même les fichiers de TUF_ED, considérez l'instance comme compromise et n'y signez rien. Détails sous Composants → TUF Extension Developer → Configuration → Extensions."
COM_TUF_ED_MAIL_OWN_FILES_SUBJECT="[%s] TUF_ED : ses propres fichiers ne passent pas la vérification"
COM_TUF_ED_MAIL_RENEWAL_BODY="Le renouvellement horaire de snapshot et timestamp a échoué :\n\n%s\n\nLe timestamp.json publié expire le %s. Ensuite, les sites n'installent plus vos mises à jour tant que le renouvellement ne fonctionne pas à nouveau. Ouvrez Composants → TUF Extension Developer → Publier pour vérifier."
COM_TUF_ED_MAIL_RENEWAL_SUBJECT="[%s] TUF_ED : ÉCHEC du renouvellement de snapshot/timestamp"
COM_TUF_ED_MAIL_ROLES_BODY="La séparation des rôles de cette instance TUF_ED n'est pas complète :\n\n%s\n\nChaque rôle a besoin d'au moins un compte qui lui est propre, actif, avec MFA configuré et qui n'est pas Super Utilisateur. Un compte ne peut avoir qu'un seul rôle. Vérifiez les comptes sous Utilisateurs → Gérer, ainsi que l'aperçu dans le tableau de bord TUF_ED."
COM_TUF_ED_MAIL_ROLES_SUBJECT="[%s] TUF_ED : les comptes de rôle nécessitent votre attention"
COM_TUF_ED_MAIL_ROOT_EXPIRED_BODY="Vos métadonnées root (version %d de root.json) ont expiré le %s.\n\nLes sites n'installent plus de mises à jour de vos extensions tant que vous n'avez pas signé une nouvelle version de root : Composants → TUF Extension Developer → Métadonnées root → Signer."
COM_TUF_ED_MAIL_ROOT_EXPIRED_SUBJECT="[%s] TUF_ED : les métadonnées root ont EXPIRÉ"
COM_TUF_ED_MAIL_ROOT_EXPIRY_BODY="Vos métadonnées root (version %d de root.json) expirent le %s, dans %d jours.\n\nAprès cette date, les sites n'installent plus de mises à jour de vos extensions.\n\nPour les renouveler : dans l'administration, ouvrez Composants → TUF Extension Developer → Métadonnées root → Signer, téléversez votre fichier de clé root et saisissez sa phrase secrète. Aucune rotation de clé n'est nécessaire."
COM_TUF_ED_MAIL_ROOT_EXPIRY_SUBJECT="[%s] TUF_ED : les métadonnées root expirent dans %d jours"
COM_TUF_ED_MAIL_TARGETS_EXPIRED_BODY="Vos métadonnées de paquets (version %d de targets.json) ont expiré le %s.\n\nLes sites n'installent plus de mises à jour de vos extensions tant que vous n'avez pas signé une nouvelle version de targets : Composants → TUF Extension Developer → Paquets → Signer targets.json."
