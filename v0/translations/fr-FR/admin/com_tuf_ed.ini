COM_TUF_ED_KMS_INTRO="Décrivez comment vous conservez et manipulez chacune de vos clés. Enregistrez le brouillon aussi souvent que vous le souhaitez ; il peut rester incomplet. Lorsqu'il est complet, signez-le avec votre clé root : la version signée constitue votre processus documenté et, plus tard, ce qu'un TUF Intermediary examine avant d'attester votre clé root. <strong>La déclaration indique où se trouvent vos clés, elle est donc confidentielle :</strong> seuls les utilisateurs autorisés à signer les métadonnées root peuvent la voir. Décrivez des lieux et des procédures, jamais de mots de passe, de phrases secrètes, de codes PIN ni de combinaisons de coffre."
