COM_TUF_ED_KEYS_EMERGENCY_CONFIRM="Capisco che le chiavi selezionate vengono distrutte ora e non possono essere ripristinate."
COM_TUF_ED_KEYS_EMERGENCY_ERR_CONFIRM="Conferma che le chiavi vengono distrutte ora."
COM_TUF_ED_KEYS_EMERGENCY_ERR_NONE="Seleziona almeno una chiave online di cui esista ancora una copia sigillata su questo server."
COM_TUF_ED_KEYS_EMERGENCY_INTRO="Usa questa funzione se una chiave online potrebbe essere stata rubata. Le chiavi selezionate vengono ritirate e le loro copie sigillate su questo server vengono distrutte subito. Non c'è un periodo di transizione di 30 giorni: da ora non firmano più nulla. I client si fidano ancora di una chiave finché non pubblichi una nuova versione di root senza di essa, quindi firmane una presto. Il client di aggiornamento di Joomla (5.1 e successivi) non ha bisogno della transizione."
COM_TUF_ED_KEYS_EMERGENCY_IN_ROOT="elencata in root.json versione %d"
COM_TUF_ED_KEYS_EMERGENCY_NEXT="Poi:"
COM_TUF_ED_KEYS_EMERGENCY_NEXT_GENERATE="Genera una nuova chiave online per ogni ruolo di cui distruggi la chiave."
COM_TUF_ED_KEYS_EMERGENCY_NEXT_HOST="Se la chiave è stata rubata da questo host web, scopri come prima di generare nuove chiavi qui. Distruggi tutte le chiavi online: così viene eliminato anche il file segreto e le nuove chiavi vengono sigillate con un nuovo segreto."
COM_TUF_ED_KEYS_EMERGENCY_NEXT_ROOT="Firma una nuova versione di root. Elenca le nuove chiavi e non più quelle distrutte."
COM_TUF_ED_KEYS_EMERGENCY_NONE="Nessuna chiave online ha una copia sigillata su questo server."
COM_TUF_ED_KEYS_EMERGENCY_NOT_IN_ROOT="non elencata nell'attuale root.json"
COM_TUF_ED_KEYS_EMERGENCY_N_DONE="%d chiavi online ritirate e le loro copie sigillate distrutte."
COM_TUF_ED_KEYS_EMERGENCY_N_DONE_1="1 chiave online ritirata e la sua copia sigillata distrutta."
COM_TUF_ED_KEYS_EMERGENCY_ROOT_UNKNOWN="l'attuale root.json non può essere verificato (vedi la pagina Root)"
COM_TUF_ED_KEYS_EMERGENCY_SECRET_DELETED="Non resta alcuna chiave sigillata, quindi anche %s è stato eliminato. La prossima chiave online riceve un nuovo segreto."
COM_TUF_ED_KEYS_EMERGENCY_SELECT="Chiavi da distruggere"
COM_TUF_ED_KEYS_EMERGENCY_STATE_GRACE="ritirata, conservata per la transizione dopo l'ultima versione di root"
COM_TUF_ED_KEYS_EMERGENCY_STOPPED="I metadati %1$s non possono essere rinnovati ora. Genera una nuova chiave %1$s online e firma una nuova versione di root."
COM_TUF_ED_KEYS_EMERGENCY_STOPS="Senza questa chiave, i metadati %1$s non possono essere rinnovati finché non firmi una nuova versione di root con un'altra chiave %1$s. I client smettono di ricevere aggiornamenti quando i metadati %1$s pubblicati scadono (%2$s)."
COM_TUF_ED_KEYS_EMERGENCY_SUBMIT="Distruggi le chiavi selezionate"
