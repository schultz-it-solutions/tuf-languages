COM_TUF_ED_LIBRARY_MISSING="È richiesto lib_com_tuf 0.1.0 o successivo. Installa o aggiorna prima la libreria."
COM_TUF_ED_MAIL_CORE_UPDATES_BODY="Gli aggiornamenti automatici del core di Joomla su questa istanza TUF_ED richiedono attenzione:\n\n%s\n\nUn server di firma con una vulnerabilità nota di Joomla compromette ciò che firma. Apri il pannello di controllo di TUF_ED (scheda \"Aggiornamenti automatici di Joomla\") per dettagli e link."
COM_TUF_ED_MAIL_CORE_UPDATES_OFF="Gli aggiornamenti automatici del core sono disattivati e la dichiarazione di gestione delle chiavi firmata non indica alcun motivo per l'aggiornamento manuale. Attivali (Aggiornamento Joomla → Opzioni → Aggiornamenti automatici) oppure registra il motivo e la tua scadenza per le release di sicurezza nella dichiarazione di gestione delle chiavi e firmala."
COM_TUF_ED_MAIL_CORE_UPDATES_PLUGIN="Il plugin \"Web Services - Joomla Update\" è disabilitato. Senza di esso il servizio di aggiornamento non può raggiungere questo sito (404 su /api/index.php/v1/joomlaupdate/healthcheck) e la registrazione agli aggiornamenti automatici non riesce. Abilitalo in Sistema → Plugin, poi riattiva gli aggiornamenti automatici."
COM_TUF_ED_MAIL_CORE_UPDATES_SUBJECT="[%s] TUF_ED: gli aggiornamenti automatici di Joomla richiedono attenzione"
COM_TUF_ED_MAIL_CORE_UPDATES_UNAVAILABLE="Gli aggiornamenti automatici del core non sono possibili con le attuali opzioni di Aggiornamento Joomla: richiedono il canale di aggiornamento \"Predefinito\" e la stabilità minima \"Stabile\". Modifica queste opzioni oppure registra il motivo dell'aggiornamento manuale nella dichiarazione di gestione delle chiavi e firmala."
COM_TUF_ED_MAIL_CORE_UPDATES_UNREGISTERED="Gli aggiornamenti automatici del core sono attivi, ma questo sito non è ancora registrato presso il servizio di aggiornamento. Salva di nuovo le opzioni di Aggiornamento Joomla; se la registrazione non riesce, verifica che /api/index.php/v1/joomlaupdate/healthcheck sia raggiungibile da Internet."
COM_TUF_ED_MAIL_DRIFT_BODY="Questi controlli del passaggio di configurazione di TUF_ED non sono più soddisfatti:\n\n%s\n\nSe non hai fatto tu questa modifica, scopri chi l'ha fatta. Per ripristinare le impostazioni, apri Componenti → TUF Extension Developer → Configurazione."
COM_TUF_ED_MAIL_DRIFT_SUBJECT="[%s] TUF_ED: le impostazioni di configurazione sono cambiate"
COM_TUF_ED_MAIL_EXTENSIONS_BODY="Queste estensioni sono installate sull'istanza TUF_ED ma non sono consentite, oppure sono cambiate dopo l'autorizzazione:\n\n%s\n\nSe non te lo aspettavi, considera l'istanza compromessa e non firmare nulla su di essa. Altrimenti esamina le estensioni in Componenti → TUF Extension Developer → Configurazione → Estensioni."
COM_TUF_ED_MAIL_EXTENSIONS_SUBJECT="[%s] TUF_ED: %d estensione/i non consentita/e o modificata/e"
COM_TUF_ED_MAIL_FOOTER="Questo messaggio è stato inviato dalle attività pianificate di TUF Extension Developer (com_tuf_ed) a tutti gli utenti del gruppo TUF_ED Owner. Lo stesso risultato non viene inviato di nuovo; una modifica sì."
COM_TUF_ED_MAIL_INTEGRITY_BODY="Il controllo giornaliero dell'istanza ha trovato differenze rispetto allo stato di riferimento confermato da un Owner:\n\n%1$s\n\nCartelle escluse (non sottoposte a hash; i file eseguibili al loro interno vengono segnalati):\n\n%2$s\n\nIl controllo ha sottoposto a hash %3$s\n\nTUF_ED rifiuta qualsiasi operazione sulle chiavi finché un Owner non ha esaminato e confermato le modifiche; il rinnovo orario continua. Se una modifica non deriva da un aggiornamento o da una modifica della configurazione di cui sei a conoscenza, considera l'istanza compromessa e non firmare nulla su di essa. Esamina le modifiche in Componenti → TUF Extension Developer → Integrità."
COM_TUF_ED_MAIL_INTEGRITY_SUBJECT="[%s] TUF_ED: l'istanza è diversa dal suo stato di riferimento confermato"
COM_TUF_ED_MAIL_KMS_DUE="La tua dichiarazione di gestione delle chiavi (versione %1$d) deve essere rivista il %2$s."
COM_TUF_ED_MAIL_KMS_HOWTO="Per rivederla: apri Componenti → TUF Extension Developer → Gestione chiavi, controlla ogni chiave (e che ogni copia si apra ancora), salva la bozza e firmala con il tuo file della chiave root. Firmarla di nuovo senza modifiche conferma la revisione."
COM_TUF_ED_MAIL_KMS_KEYS_CHANGED="Le tue chiavi attive sono cambiate dall'ultima versione firmata della dichiarazione."
COM_TUF_ED_MAIL_KMS_OVERDUE="La revisione della tua dichiarazione di gestione delle chiavi (versione %1$d) era prevista il %2$s."
COM_TUF_ED_MAIL_KMS_SUBJECT="[%s] TUF_ED: rivedi la tua dichiarazione di gestione delle chiavi"
COM_TUF_ED_MAIL_OWN_FILES_BODY="I file propri di TUF_ED su questa istanza non corrispondono all'elenco dei file della release installata, oppure l'elenco non corrisponde a quello fissato:\n\n%s\n\nTUF_ED rifiuta qualsiasi operazione sulle chiavi e la pubblicazione finché il problema non è risolto; anche il rinnovo orario si ferma. Se non hai modificato tu i file di TUF_ED, considera l'istanza compromessa e non firmare nulla su di essa. Dettagli in Componenti → TUF Extension Developer → Configurazione → Estensioni."
COM_TUF_ED_MAIL_OWN_FILES_SUBJECT="[%s] TUF_ED: i suoi file non superano il controllo"
COM_TUF_ED_MAIL_RENEWAL_BODY="Il rinnovo orario di snapshot e timestamp non è riuscito:\n\n%s\n\nIl timestamp.json pubblicato scade il %s. Dopo, i siti smettono di installare i tuoi aggiornamenti finché il rinnovo non funziona di nuovo. Apri Componenti → TUF Extension Developer → Pubblica per controllare."
COM_TUF_ED_MAIL_RENEWAL_SUBJECT="[%s] TUF_ED: rinnovo di snapshot/timestamp NON RIUSCITO"
COM_TUF_ED_MAIL_ROLES_BODY="La separazione dei ruoli di questa istanza TUF_ED non è completa:\n\n%s\n\nOgni ruolo ha bisogno di almeno un account proprio che sia attivo, abbia MFA configurata e non sia un Super User. Un account può avere un solo ruolo. Controlla gli account in Utenti → Gestione e la panoramica nel pannello di controllo di TUF_ED."
COM_TUF_ED_MAIL_ROLES_SUBJECT="[%s] TUF_ED: gli account di ruolo richiedono attenzione"
COM_TUF_ED_MAIL_ROOT_EXPIRED_BODY="I tuoi metadati root (root.json versione %d) sono scaduti il %s.\n\nI siti non installano più aggiornamenti delle tue estensioni finché non firmi una nuova versione di root: Componenti → TUF Extension Developer → Metadati root → Firma."
