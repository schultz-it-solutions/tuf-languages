COM_TUF_ED_ANCHOR_ERR_NOT_UPDATED="La versione %1$d di root è memorizzata, ma non è stato possibile aggiornare l'ancora di fiducia (%2$s). Scrivila nella pagina Metadati root."
COM_TUF_ED_ANCHOR_ERR_WRITE="Impossibile scrivere l'ancora di fiducia %s."
COM_TUF_ED_ANCHOR_EXPLAIN="L'ancora di fiducia nella cartella privata registra la prima e l'ultima root che hai firmato. Se il database non corrisponde più, qualcuno potrebbe aver sostituito le root lì presenti. Confronta i file qui sotto con quelli pubblicati (root.json e le root con versione) e con le versioni di root che conservi altrove, ad esempio nello stato di fiducia di tuf-ed-signer. Scrivi una nuova ancora solo se sono le tue."
