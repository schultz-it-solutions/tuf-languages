COM_TUF_ED_EXT_EXTENSION="Estensione"
COM_TUF_ED_EXT_INTRO="Estensioni che non fanno parte né del core di Joomla né di TUF. Pochissime possono avere un motivo valido per trovarsi qui, ad es. uno strumento di backup. Consentirne una lega l'autorizzazione alla sua versione attuale e a un checksum dei suoi file: dopo qualsiasi aggiornamento o modifica dei file viene di nuovo considerata non consentita finché non la confermi nuovamente."
COM_TUF_ED_EXT_NONE="Non sono installate estensioni oltre al core di Joomla e a TUF."
COM_TUF_ED_EXT_NOTE_REMOTE="Connettore di gestione remota per %s: quel servizio può installare e aggiornare estensioni su questo sito dall'esterno, aggirando la regola dell'istanza pulita. Consentilo solo se ti fidi del servizio e proteggi il suo account con MFA."
COM_TUF_ED_EXT_OTHERS_HEADING="Altre estensioni"
