COM_TUF_ED_KEYS_ONLINE_INTRO="Le chiavi snapshot e timestamp sono conservate su questo server, così l'attività oraria può rinnovarne i metadati di breve durata. Una chiave online rubata può ritardare i tuoi aggiornamenti, ma non può pubblicare un pacchetto: i pacchetti sono firmati con la tua chiave targets offline. La chiave privata è sigillata con il file segreto nella cartella privata; non c'è nulla da scaricare. Dopo la generazione, firma una nuova versione di root perché la chiave venga elencata in root.json."
