COM_TUF_ED_GUARD_ERR_DEBUG="La modalità di debug di Joomla è attiva (Configurazione globale → Sistema). Registra le richieste, compresi i dati dei moduli. Disattivala; fino ad allora TUF_ED rifiuta qualsiasi operazione sulle chiavi."
COM_TUF_ED_GUARD_ERR_DEBUG_PLUGIN="Il plugin \"Sistema - Debug\" è abilitato. Registra le richieste, compresi i dati dei moduli. Disabilitalo (la configurazione lo fa per te); fino ad allora TUF_ED rifiuta qualsiasi operazione sulle chiavi."
