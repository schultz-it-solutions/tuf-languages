COM_TUF_ED_KEYS_GENERATE="Genera chiave"
COM_TUF_ED_KEYS_GENERATE_BUTTON="Genera e scarica"
COM_TUF_ED_KEYS_GENERATE_DOWNLOAD="Il file di chiave viene scaricato non appena fai clic sul pulsante, e solo allora: non viene memorizzato sul server, quindi non può essere scaricato di nuovo. Conservalo al sicuro, poi vai all'elenco delle chiavi e conferma la nuova chiave caricando il file una volta. Fino ad allora la chiave non viene usata. Una chiave non confermata entro 24 ore viene eliminata."
COM_TUF_ED_KEYS_GENERATE_INTRO="Su questo server viene creata una nuova coppia di chiavi Ed25519 (firma nel componente). Il tuo browser scarica subito la chiave privata, come file cifrato con la passphrase che inserisci qui; sul server non resta alcuna copia. Il sito conserva solo la chiave pubblica. Per firmare, carichi di nuovo quel file. Per la protezione più forte, conserva invece la tua chiave root offline: generala sul tuo computer e usa Registra chiave offline."
COM_TUF_ED_KEYS_GENERATE_ONLINE="Genera chiave online"
COM_TUF_ED_KEYS_GENERATE_THEN_CONFIRM="Scaricata? Vai all'elenco delle chiavi per confermarla"
COM_TUF_ED_KEYS_INTRO="Le tue chiavi. Le generi e le possiedi tu; un TUF Intermediary attesta solo la tua chiave root, non la firma né la possiede mai."
