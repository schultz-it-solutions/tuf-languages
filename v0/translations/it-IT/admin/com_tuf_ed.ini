COM_TUF_ED_OWN_INTRO="TUF_ED recognises its own files by their SHA-256, not by extension names. Each release ships a list of its files; at install, the hash of that list is pinned in the private folder. Every listed file must match, TUF_ED's folders must contain nothing else, and no template may override TUF_ED's pages. This is a tripwire against foreign or modified code: someone who can write both TUF_ED's files and the private folder can defeat it. Against a full compromise of the server, only offline signing helps."
