COM_TUF_ED_SETUP_INTRO="Questi controlli adattano questa istanza Joomla al suo unico utilizzo come TUF_ED. Modificano l'intero sito, non solo questo componente. Non viene modificato nulla finché non selezioni i controlli, confermi e applichi. Ogni controllo applicato viene scritto nel Registro azioni utente."
