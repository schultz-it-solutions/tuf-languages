COM_TUF_ED_MAIL_TARGETS_EXPIRED_BODY="I tuoi metadati dei pacchetti (targets.json versione %d) sono scaduti il %s.\n\nI siti non installano più aggiornamenti delle tue estensioni finché non firmi una nuova versione di targets: Componenti → TUF Extension Developer → Pacchetti → Firma targets.json."
