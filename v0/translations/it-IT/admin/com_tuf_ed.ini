COM_TUF_ED_MAIL_ROOT_EXPIRY_BODY="I tuoi metadati root (root.json versione %d) scadono il %s, tra %d giorni.\n\nDopo questa data, i siti smettono di installare gli aggiornamenti delle tue estensioni.\n\nPer rinnovare: nel backend apri Componenti → TUF Extension Developer → Metadati root → Firma, carica il tuo file della chiave root e inserisci la sua passphrase. Non è necessaria alcuna rotazione delle chiavi."
