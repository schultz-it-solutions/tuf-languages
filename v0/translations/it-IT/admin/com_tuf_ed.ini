COM_TUF_ED_MAIL_ROOT_EXPIRED_BODY="I tuoi metadati root (root.json versione %d) sono scaduti il %s.\n\nI siti non installano più aggiornamenti delle tue estensioni finché non firmi una nuova versione di root: Componenti → TUF Extension Developer → Metadati root → Firma."
