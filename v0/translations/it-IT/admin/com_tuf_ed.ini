COM_TUF_ED_INTEGRITY_INTRO="Ogni file di questa istanza Joomla viene sottoposto a hash e confrontato con lo stato di riferimento confermato da un Owner. Le cartelle in cui Joomla scrive durante l'esecuzione non vengono sottoposte a hash, ma i file eseguibili al loro interno vengono segnalati (esclusi i file PHP che non possono eseguire codice, come le voci della cache e i file di log di Joomla). Dopo un evento di installazione o una modifica della Configurazione globale, le modifiche restano aperte finché un Owner non le esamina e le conferma. Fino ad allora TUF_ED rifiuta qualsiasi operazione sulle chiavi; il rinnovo orario di snapshot e timestamp continua. Si tratta di un allarme a filo: chi può eseguire codice come utente del server web può modificare i file, lo stato di riferimento e questo controllo. Il codice al di fuori dei file (nel database, fuori dalla cartella di Joomla, nella cache degli opcode) non è coperto."
COM_TUF_ED_INTEGRITY_LAST="Controllo precedente: %1$s UTC (%2$s), %3$s secondi."
COM_TUF_ED_INTEGRITY_MORE="… e altri %d. La tua conferma li copre tutti."
COM_TUF_ED_INTEGRITY_NOTICE="<strong>L'istanza non corrisponde al suo stato di riferimento confermato</strong> (%1$s). TUF_ED rifiuta qualsiasi operazione sulle chiavi finché un Owner non ha esaminato e confermato le modifiche. <a href=\"%2$s\">Esamina le modifiche</a>."
COM_TUF_ED_INTEGRITY_NOTICE_NONE="<strong>Non esiste ancora uno stato di riferimento dell'istanza confermato.</strong> TUF_ED rifiuta qualsiasi operazione sulle chiavi finché un Owner non ne ha confermato uno. <a href=\"%s\">Apri la pagina Integrità</a>."
COM_TUF_ED_INTEGRITY_NOT_OK="L'istanza non corrisponde al suo stato di riferimento confermato: %s. TUF_ED rifiuta qualsiasi operazione sulle chiavi finché un Owner non ha esaminato e confermato le modifiche."
