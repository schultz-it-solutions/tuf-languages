COM_TUF_ED_KEYS_ERR_NOT_PENDING="Il file di chiave %s… non appartiene a una chiave in attesa di conferma."
COM_TUF_ED_KEYS_ERR_OFFLINE_ROLE="Solo le chiavi root e targets possono essere offline. Le chiavi snapshot e timestamp devono essere online, così l'attività oraria può rinnovarne i metadati."
COM_TUF_ED_KEYS_ERR_OFFLINE_ROLE_MISMATCH="Il file della chiave pubblica è per il ruolo %1$s, ma hai scelto %2$s."
COM_TUF_ED_KEYS_ERR_OFFLINE_UPLOAD="Il file di chiave di \"%1$s\" (%2$s…) è stato rifiutato: questa chiave è offline. Caricarla qui ne vanificherebbe la protezione, quindi non è stata né decifrata né usata. Firma invece con lo strumento di firma offline. Il tentativo è stato registrato."
COM_TUF_ED_KEYS_ERR_PASSPHRASE_MISMATCH="Le due passphrase non corrispondono."
COM_TUF_ED_KEYS_ERR_PUBLIC_UPLOAD="Il caricamento del file della chiave pubblica non è riuscito o il file è troppo grande."
