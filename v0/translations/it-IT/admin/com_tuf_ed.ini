COM_TUF_ED_KMS_CORE_UPDATES_DESC_OFF="Gli aggiornamenti automatici del core sono disattivati. È consentito, ma solo come decisione registrata: indica il motivo e il numero di giorni entro cui applichi manualmente le release di sicurezza di Joomla. Obbligatorio per firmare."
