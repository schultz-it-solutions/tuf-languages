COM_TUF_ED_EXT_RECONFIRM="Conferma di nuovo"
COM_TUF_ED_EXT_REMOTE_NOTE="I connettori di gestione remota (monitoraggio del sito o servizi di aggiornamento) possono installare e aggiornare estensioni dall'esterno. Consentirne uno significa affidare a quel servizio questa istanza, compreso ciò che viene eseguito accanto al codice di firma. Gli archivi di backup contengono il database e la configurazione: proteggi di conseguenza l'archivio dei backup."
