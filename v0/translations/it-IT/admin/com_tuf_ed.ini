COM_TUF_ED_INTEGRITY_CONFIRM_INTRO="Conferma solo le modifiche che sai spiegare: aggiornamenti fatti da te o dal tuo team, configurazione che hai cambiato. Tutto ciò che è contrassegnato con \"nessun evento di installazione\" merita un esame più attento."
