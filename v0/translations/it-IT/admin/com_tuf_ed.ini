COM_TUF_ED_CONFIGURATION="TUF Extension Developer: opzioni"
COM_TUF_ED_CONFIG_MAIN_WEBSITE_DESC="Il tuo sito web pubblico (https://…). Usato nel testo proposto per la pagina offline di questo sito."
COM_TUF_ED_CONFIG_MAIN_WEBSITE_LABEL="Sito web principale"
COM_TUF_ED_CONFIG_PRIVATE_PATH_DESC="Fuori dalla radice web, ad es. /home/user/tuf_ed_private. Contiene il segreto che sigilla le chiavi online snapshot e timestamp e i pacchetti caricati. Includila nei tuoi backup, ma conserva questi backup separatamente dai backup del database: il segreto e il database insieme aprono le chiavi online."
COM_TUF_ED_CONFIG_PRIVATE_PATH_LABEL="Cartella privata"
COM_TUF_ED_CONFIG_PUBLISH_METHOD_DESC="Dove viene scritto il repository TUF pubblico: una cartella su questo server o una cartella su un altro server tramite SFTP (ad es. il server del tuo sito web principale)."
COM_TUF_ED_CONFIG_PUBLISH_METHOD_LABEL="Metodo di pubblicazione"
COM_TUF_ED_CONFIG_PUBLISH_METHOD_LOCAL="Cartella su questo server"
COM_TUF_ED_CONFIG_PUBLISH_METHOD_SFTP="SFTP verso un altro server"
COM_TUF_ED_CONFIG_PUBLISH_PACKAGES_DESC="Copia anche i pacchetti firmati nella cartella di pubblicazione, come targets/&lt;sha256&gt;.&lt;name&gt;. Lascia disattivato se distribuisci i pacchetti dal tuo server di aggiornamento esistente."
COM_TUF_ED_CONFIG_PUBLISH_PACKAGES_LABEL="Pubblica i pacchetti"
COM_TUF_ED_CONFIG_PUBLISH_PATH_DESC="Dove viene scritto il repository TUF pubblico come file statici: una cartella del tuo sito web principale o una nuova cartella sotto la radice web di questo sito (non una cartella di Joomla). Il server web distribuisce questi file direttamente, anche mentre questo sito è offline."
COM_TUF_ED_CONFIG_PUBLISH_PATH_LABEL="Cartella di pubblicazione"
COM_TUF_ED_CONFIG_PUBLISH_URL_DESC="Indirizzo https://… al quale è raggiungibile la cartella di pubblicazione. I client di aggiornamento scaricano da lì timestamp.json, i metadati con versione e, se pubblicati, i pacchetti."
COM_TUF_ED_CONFIG_PUBLISH_URL_LABEL="URL pubblico della cartella di pubblicazione"
COM_TUF_ED_CONFIG_REQUEST_LIFETIME_DESC="Per quanto tempo una richiesta di firma preparata può essere firmata (1–30). Diventa inoltre inutilizzabile non appena cambia ciò su cui si basa."
COM_TUF_ED_CONFIG_REQUEST_LIFETIME_LABEL="Durata della richiesta di firma (giorni)"
COM_TUF_ED_CONFIG_ROOT_EXPIRY_DESC="Durata predefinita di una nuova versione di root.json. I client rifiutano una root scaduta, quindi firma una nuova versione con largo anticipo rispetto a questa data."
COM_TUF_ED_CONFIG_ROOT_EXPIRY_LABEL="Scadenza di root (giorni)"
COM_TUF_ED_CONFIG_ROOT_LABEL="Metadati root"
COM_TUF_ED_CONFIG_SFTP_AUTH_DESC="Si consiglia una chiave. Usa un account SFTP che possa raggiungere solo la cartella del repository (chroot): ogni file pubblicato è firmato, quindi questo account può al massimo bloccare gli aggiornamenti, ma non deve raggiungere nient'altro."
COM_TUF_ED_CONFIG_SFTP_AUTH_KEY="File della chiave privata"
COM_TUF_ED_CONFIG_SFTP_AUTH_LABEL="Accedi con"
COM_TUF_ED_CONFIG_SFTP_AUTH_PASSWORD="Password"
COM_TUF_ED_CONFIG_SFTP_HOST_DESC="Nome host o indirizzo IP del server che distribuisce il repository, ad es. ssh.example.com."
COM_TUF_ED_CONFIG_SFTP_HOST_KEY_DESC="Impronta SHA256 della chiave host del server, come la stampa ssh-keygen -lf (SHA256:…). Nulla viene inviato a un server con una chiave diversa. All'inizio lascia vuoto: Pubblica → Mostra chiave host mostra ciò che il server presenta; confrontala con l'impronta indicata dal tuo provider di hosting prima di inserirla."
COM_TUF_ED_CONFIG_SFTP_HOST_KEY_LABEL="Impronta della chiave host"
COM_TUF_ED_CONFIG_SFTP_HOST_LABEL="Host SFTP"
COM_TUF_ED_CONFIG_SFTP_KEY_FILE_DESC="Chiave privata OpenSSH senza passphrase (necessaria per il rinnovo orario), creata ad es. con ssh-keygen -t ed25519 -N '' -f sftp_ed25519. Un semplice nome di file viene cercato nella cartella privata; un percorso assoluto deve trovarsi fuori dalla radice web. Permessi 0600."
COM_TUF_ED_CONFIG_SFTP_KEY_FILE_LABEL="File della chiave privata"
COM_TUF_ED_CONFIG_SFTP_PASSWORD_DESC="La password non viene memorizzata nelle opzioni (database). Impostala nella pagina Pubblica: TUF_ED la conserva nella cartella privata. Un file di chiave resta comunque la scelta migliore."
COM_TUF_ED_CONFIG_SFTP_PASSWORD_LABEL="Password SFTP"
COM_TUF_ED_CONFIG_SFTP_PATH_DESC="Cartella sul server SFTP che il server web distribuisce all'URL pubblico qui sotto, ad es. /var/www/example.com/tuf oppure tuf (relativa alla cartella di accesso). Deve esistere."
COM_TUF_ED_CONFIG_SFTP_PATH_LABEL="Cartella remota"
COM_TUF_ED_CONFIG_SFTP_PORT_LABEL="Porta SFTP"
COM_TUF_ED_CONFIG_SFTP_USERNAME_LABEL="Nome utente SFTP"
COM_TUF_ED_CONFIG_SIGNING_LABEL="Firma dei pacchetti"
COM_TUF_ED_CONFIG_SITE_LABEL="Sito"
COM_TUF_ED_CONFIG_SNAPSHOT_EXPIRY_DESC="Durata di snapshot.json (1–30). Rinnovato automaticamente con la chiave snapshot online quando ne resta meno della metà."
COM_TUF_ED_CONFIG_SNAPSHOT_EXPIRY_LABEL="Scadenza di snapshot (giorni)"
COM_TUF_ED_CONFIG_STORAGE_DESC="Percorsi assoluti su questo server. Entrambe le cartelle devono esistere ed essere scrivibili da PHP."
COM_TUF_ED_CONFIG_STORAGE_LABEL="Archiviazione"
COM_TUF_ED_CONFIG_TARGETS_EXPIRY_DESC="Durata predefinita di una nuova versione di targets.json (7–365). Viene firmata con la tua chiave targets offline, quindi si rinnova manualmente; ricevi promemoria 30 e 7 giorni prima."
COM_TUF_ED_CONFIG_TARGETS_EXPIRY_LABEL="Scadenza di targets (giorni)"
COM_TUF_ED_CONFIG_TIMESTAMP_EXPIRY_DESC="Durata di timestamp.json (4–168). Rinnovato automaticamente dall'attività oraria quando ne resta meno della metà. Una durata più breve significa che i client si accorgono prima di un repository bloccato; l'attività oraria deve allora essere eseguita in modo affidabile."
COM_TUF_ED_CONFIG_TIMESTAMP_EXPIRY_LABEL="Scadenza di timestamp (ore)"
COM_TUF_ED_CONFIG_UNINSTALL_DESTROY_DESC="Sì (predefinito): la disinstallazione di TUF_ED distrugge le chiavi online sigillate (snapshot, timestamp), il file segreto che le sigilla e la password SFTP memorizzata. Non possono essere recuperati in seguito: dopo una nuova installazione generi nuove chiavi online e firmi una nuova versione di root. Scegli No solo se disinstalli per reinstallare subito; le chiavi restano allora su questo server finché non le elimini."
COM_TUF_ED_CONFIG_UNINSTALL_DESTROY_LABEL="Alla disinstallazione: distruggi le chiavi online"
COM_TUF_ED_CORE_UPDATES_AUTOMATED="Aggiornamenti automatici del core"
COM_TUF_ED_CORE_UPDATES_AUTOMATED_AT_SIGNING="Aggiornamenti automatici del core al momento della firma"
COM_TUF_ED_CORE_UPDATES_HEADING="Aggiornamenti automatici di Joomla"
COM_TUF_ED_CORE_UPDATES_HELP="Lascia attivi gli aggiornamenti automatici del core: un server di firma con una vulnerabilità nota di Joomla compromette ciò che firma. Il servizio di aggiornamento controlla questo sito tramite /api/index.php/v1/joomlaupdate/healthcheck, quindi questo percorso deve restare raggiungibile anche mentre il frontend è offline. Se aggiorni manualmente, registra il motivo e la tua scadenza per le release di sicurezza nella dichiarazione di gestione delle chiavi."
COM_TUF_ED_CORE_UPDATES_JUSTIFIED="Motivo dell'aggiornamento manuale"
COM_TUF_ED_CORE_UPDATES_JUSTIFIED_IN="Nella versione %d della dichiarazione di gestione delle chiavi"
COM_TUF_ED_CORE_UPDATES_NOT_AVAILABLE="Joomla offre gli aggiornamenti automatici solo con il canale di aggiornamento &quot;Predefinito&quot; e la stabilità minima &quot;Stabile&quot;."
COM_TUF_ED_CORE_UPDATES_OPEN_OPTIONS="Apri le opzioni di Aggiornamento Joomla"
COM_TUF_ED_CORE_UPDATES_PLUGIN="Plugin &quot;Web Services - Joomla Update&quot;"
COM_TUF_ED_CORE_UPDATES_REGISTERED="Registrato presso il servizio di aggiornamento"
COM_TUF_ED_CORE_UPDATES_WARN_OFF="Gli aggiornamenti automatici del core di Joomla sono disattivati e la dichiarazione di gestione delle chiavi firmata non indica alcun motivo per l'aggiornamento manuale. <a href=\"%1$s\">Attivali</a> (Aggiornamento Joomla → Opzioni → Aggiornamenti automatici) oppure registra il motivo e la tua scadenza per le release di sicurezza nella <a href=\"%2$s\">dichiarazione di gestione delle chiavi</a> e firmala."
COM_TUF_ED_CORE_UPDATES_WARN_PLUGIN="Il plugin &quot;Web Services - Joomla Update&quot; è disabilitato. Senza di esso il servizio di aggiornamento non può raggiungere questo sito (404 su /api/index.php/v1/joomlaupdate/healthcheck) e la registrazione agli aggiornamenti automatici non riesce. <a href=\"%s\">Abilita il plugin</a>, poi riattiva gli aggiornamenti automatici."
COM_TUF_ED_CORE_UPDATES_WARN_UNAVAILABLE="Gli aggiornamenti automatici del core di Joomla non sono possibili con le attuali <a href=\"%1$s\">opzioni di Aggiornamento Joomla</a>: richiedono il canale di aggiornamento &quot;Predefinito&quot; e la stabilità minima &quot;Stabile&quot;. Modifica queste opzioni oppure registra il motivo dell'aggiornamento manuale nella <a href=\"%2$s\">dichiarazione di gestione delle chiavi</a> e firmala."
COM_TUF_ED_CORE_UPDATES_WARN_UNREGISTERED="Gli aggiornamenti automatici del core di Joomla sono attivi, ma questo sito non è ancora registrato presso il servizio di aggiornamento. Salva di nuovo le <a href=\"%s\">opzioni di Aggiornamento Joomla</a>; se la registrazione non riesce, verifica che /api/index.php/v1/joomlaupdate/healthcheck sia raggiungibile da Internet."
