COM_TUF_ED_SETUP_CHECK_CLEAN_INSTANCE="Istanza pulita"
COM_TUF_ED_SETUP_CHECK_CLEAN_INSTANCE_DESC="Controlla i file propri di TUF_ED rispetto all'elenco dei file della release installata ed elenca ogni estensione che non fa parte né del core di Joomla né di TUF e non è esplicitamente consentita. Rimuovile, usa un'istanza Joomla separata per TUF_ED oppure consentine alcune con un motivo valido."
COM_TUF_ED_SETUP_CHECK_GLOBAL_CONFIG="Configurazione globale"
COM_TUF_ED_SETUP_CHECK_GLOBAL_CONFIG_DESC="Controllato qui, modificato manualmente: frontend offline con un messaggio offline neutro, nessuna indicizzazione da parte dei motori di ricerca, HTTPS per l'intero sito, sessioni brevi, nessun output di debug."
COM_TUF_ED_SETUP_CHECK_GROUPS="Gruppi di utenti TUF_ED"
COM_TUF_ED_SETUP_CHECK_GROUPS_DESC="Crea TUF_ED Owner (chiavi, firma di root), TUF_EDC Signer (firma dei pacchetti) e TUF_ED Auditor (sola lettura) direttamente sotto Public."
COM_TUF_ED_SETUP_CHECK_INTEGRITY="Stato di riferimento dell'istanza"
COM_TUF_ED_SETUP_CHECK_INTEGRITY_DESC="Controllato qui, confermato da un Owner nella pagina Integrità: lo SHA-256 di ogni file di questa istanza Joomla, confrontato con lo stato di riferimento confermato da un Owner. Le operazioni sulle chiavi vengono rifiutate finché non esiste uno stato di riferimento e l'istanza non vi corrisponde."
COM_TUF_ED_SETUP_CHECK_LEGACY_GROUPS="Elimina i gruppi standard"
COM_TUF_ED_SETUP_CHECK_LEGACY_GROUPS_DESC="Elimina Author, Editor, Publisher, Manager e Administrator. Public, Guest, Registered e Super Users restano, perché Joomla ne ha bisogno."
COM_TUF_ED_SETUP_CHECK_LEGACY_USERS="Utenti nei gruppi standard"
COM_TUF_ED_SETUP_CHECK_LEGACY_USERS_DESC="Rimuove gli utenti da Author, Editor, Publisher, Manager e Administrator. Un utente rimasto senza gruppo viene spostato in Registered e bloccato (puoi sbloccarlo in Utenti). Tu non vieni mai bloccato."
COM_TUF_ED_SETUP_CHECK_PERMISSIONS="Permessi"
COM_TUF_ED_SETUP_CHECK_PERMISSIONS_DESC="Imposta i permessi globali e quelli di TUF_ED per i nuovi gruppi. I Super User mantengono sempre tutti i diritti."
COM_TUF_ED_SETUP_CHECK_PLUGINS_OFF="Plugin di accesso remoto"
COM_TUF_ED_SETUP_CHECK_PLUGINS_OFF_DESC="Disabilita i plugin Web Services (API) e Autenticazione API, l'installazione di estensioni dal web o da un URL e il plugin Sistema - Debug. Non Web Services - Joomla Update: gli aggiornamenti automatici di Joomla ne hanno bisogno (vedi il pannello di controllo)."
COM_TUF_ED_SETUP_CHECK_PLUGINS_ON="Plugin di sicurezza"
COM_TUF_ED_SETUP_CHECK_PLUGINS_ON_DESC="Abilita Intestazioni HTTP, Registro azioni utente e i plugin di TUF_ED (attività pianificate, separazione dei ruoli)."
COM_TUF_ED_SETUP_CHECK_SCHEDULER_CRON="Esecuzione delle attività (cron)"
COM_TUF_ED_SETUP_CHECK_SCHEDULER_CRON_DESC="Controllato qui, modificato manualmente: il frontend di questo sito è offline, quindi lo scheduler lazy (che esegue le attività durante le visite alle pagine) non è affidabile. Disattivalo ed esegui le attività tramite un cron job sul server."
COM_TUF_ED_SETUP_CHECK_SCHEDULER_TASKS="Attività pianificate"
COM_TUF_ED_SETUP_CHECK_SCHEDULER_TASKS_DESC="Crea le attività di TUF_ED: promemoria giornaliero delle scadenze, controllo delle estensioni, controllo della configurazione e dell'istanza, e il rinnovo orario di snapshot e timestamp. Le e-mail vanno a tutti gli utenti di TUF_ED Owner."
COM_TUF_ED_SETUP_CHECK_STORAGE="Cartelle di archiviazione"
COM_TUF_ED_SETUP_CHECK_STORAGE_DESC="Controllato qui, impostato in Opzioni → Archiviazione: una cartella privata fuori dalla radice web (segreto delle chiavi online, pacchetti caricati) e una cartella di pubblicazione per il repository TUF pubblico e statico. Necessario solo quando firmi pacchetti."
COM_TUF_ED_SETUP_CHECK_USERS_CONFIG="Opzioni utenti"
COM_TUF_ED_SETUP_CHECK_USERS_CONFIG_DESC="Disattiva l'auto-registrazione, impone l'autenticazione a più fattori per i gruppi TUF_ED e i Super User e imposta la lunghezza minima della password a 16."
COM_TUF_ED_SETUP_CHECK_VIEWLEVELS="Livelli di accesso"
