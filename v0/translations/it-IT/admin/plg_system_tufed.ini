PLG_SYSTEM_TUFED="Sistema - TUF Extension Developer"
PLG_SYSTEM_TUFED_MAIL_EXT_INSTALLED="È stata installata un'estensione che non fa parte di Joomla o di TUF.\n\nEstensione: %1$s\nVersione: %2$s\nInstallata da: %3$s\n\nViene eseguita nello stesso processo PHP del codice di firma. Le chiavi online non vengono usate finché non viene rimossa o esplicitamente consentita (Configurazione → Estensioni)."
PLG_SYSTEM_TUFED_MAIL_EXT_SUBJECT="[%s] TUF_ED: estensione installata o aggiornata"
PLG_SYSTEM_TUFED_MAIL_EXT_UPDATED="È stata aggiornata un'estensione che non fa parte di Joomla o di TUF.\n\nEstensione: %1$s\nVersione: %2$s\nAggiornata da: %3$s\n\nUn'autorizzazione termina a ogni modifica dell'estensione: le chiavi online non vengono usate finché non consenti di nuovo la nuova versione (Configurazione → Estensioni)."
PLG_SYSTEM_TUFED_MAIL_FOOTER="Questo messaggio è stato inviato immediatamente dal plugin di sistema di TUF_ED (plg_system_tufed) a tutti gli utenti del gruppo TUF_ED Owner."
PLG_SYSTEM_TUFED_MAIL_ROLES_CHANGED="I ruoli TUF_ED di un account sono cambiati.\n\nAccount: %1$s\nPrima: %2$s\nOra: %3$s\nModificato da: %4$s\n\nSe non ti aspettavi questa modifica, controlla subito l'account in Utenti → Gestione: i TUF_ED Owner e i TUF_EDC Signer possono firmare pacchetti."
PLG_SYSTEM_TUFED_MAIL_ROLES_DELETED="È stato eliminato un account con un ruolo TUF_ED.\n\nAccount: %1$s\nRuoli: %2$s\nEliminato da: %4$s\n\nControlla nel pannello di controllo di TUF_ED che ogni ruolo abbia ancora un account utilizzabile."
PLG_SYSTEM_TUFED_MAIL_ROLES_SUBJECT="[%s] TUF_ED: appartenenza ai ruoli modificata"
PLG_SYSTEM_TUFED_ROLE_CONFLICT="Separazione dei ruoli TUF_ED: l'account &quot;%1$s&quot; avrebbe %2$s. Un account può avere un solo ruolo TUF_ED, e un Super User nessuno. Usa un account separato (con il proprio indirizzo e-mail o alias) per ogni ruolo."
PLG_SYSTEM_TUFED_WARN_INTEGRITY="<strong>TUF_ED: l'istanza non corrisponde al suo stato di riferimento confermato</strong> (%1$s). TUF_ED rifiuta qualsiasi operazione sulle chiavi finché un Owner non ha esaminato e confermato le modifiche. <a href=\"%2$s\">Esamina le modifiche</a>."
PLG_SYSTEM_TUFED_WARN_NOT_CLEAN="<strong>TUF_ED: questa istanza Joomla non è pulita.</strong> %1$d estensioni non sono consentite o sono state modificate dopo l'autorizzazione: %2$s. Ogni estensione viene eseguita nello stesso processo PHP del codice di firma. <a href=\"%3$s\">Controlla le estensioni</a>."
PLG_SYSTEM_TUFED_WARN_OWN_FILES="<strong>TUF_ED: i suoi file non superano il controllo</strong> (%1$s). TUF_ED rifiuta qualsiasi operazione sulle chiavi e la pubblicazione finché il problema non è risolto. <a href=\"%2$s\">Mostra dettagli</a>."
PLG_SYSTEM_TUFED_WARN_ROLES="<strong>TUF_ED:</strong> la separazione dei ruoli non è completa (un ruolo non ha alcun account utilizzabile, oppure un account ha più di un ruolo). <a href=\"%s\">Vedi il pannello di controllo</a>."
PLG_SYSTEM_TUFED_XML_DESCRIPTION="Protegge l'istanza TUF_ED: rifiuta di salvare un account con più di un ruolo TUF_ED o con un ruolo e Super User, avvisa subito via e-mail i TUF_ED Owner quando un account ottiene o perde un ruolo o un'estensione viene installata o aggiornata, e mostra gli avvisi di TUF_ED su ogni pagina del backend. Lascialo abilitato."
