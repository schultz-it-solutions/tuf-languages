PLG_TASK_TUFED="Attività - TUF Extension Developer"
PLG_TASK_TUFED_ALLOWLIST_DESC="Controlla i file propri di TUF_ED rispetto all'elenco dei file fissato, ricalcola i checksum delle estensioni consentite e avvisa via e-mail i TUF_ED Owner se i file di TUF_ED non superano il controllo o se un'estensione è nuova, non consentita o modificata."
PLG_TASK_TUFED_ALLOWLIST_TITLE="TUF_ED: controllo delle estensioni"
PLG_TASK_TUFED_DRIFT_DESC="Avvisa via e-mail i TUF_ED Owner se un'impostazione del passaggio di configurazione è stata riportata indietro, se un ruolo non ha alcun account utilizzabile o se un account ha più di un ruolo."
PLG_TASK_TUFED_DRIFT_TITLE="TUF_ED: controllo della configurazione"
PLG_TASK_TUFED_EXPIRY_DESC="Avvisa via e-mail i TUF_ED Owner 30 e 7 giorni prima della scadenza di root.json o targets.json, e quando uno dei due è scaduto. Ricorda anche la data di revisione della dichiarazione di gestione delle chiavi e le chiavi attive che non descrive."
PLG_TASK_TUFED_EXPIRY_TITLE="TUF_ED: promemoria delle scadenze"
PLG_TASK_TUFED_INTEGRITY_DESC="Calcola l'hash di ogni file dell'istanza Joomla, lo confronta con lo stato di riferimento confermato da un Owner e avvisa via e-mail i TUF_ED Owner in caso di differenze. L'e-mail elenca anche le cartelle escluse. Da eseguire ogni giorno."
PLG_TASK_TUFED_INTEGRITY_TITLE="TUF_ED: controllo dell'istanza"
PLG_TASK_TUFED_RENEW_DESC="Da eseguire ogni ora. Firma nuovi snapshot e timestamp con le chiavi online quando resta meno della metà della loro durata o dopo una modifica, e pubblica il repository. Si ferma (e avvisa via e-mail i TUF_ED Owner) finché l'istanza non è pulita."
PLG_TASK_TUFED_RENEW_TITLE="TUF_ED: rinnovo di snapshot e timestamp"
PLG_TASK_TUFED_XML_DESCRIPTION="Attività pianificate per TUF_ED: promemoria delle scadenze, estensioni consentite, deviazioni dalla configurazione, controllo dell'istanza e rinnovo orario di snapshot e timestamp. Le e-mail vanno a tutti gli utenti di TUF_ED Owner."
