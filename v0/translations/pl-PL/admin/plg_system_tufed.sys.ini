PLG_SYSTEM_TUFED="System - TUF Extension Developer"
PLG_SYSTEM_TUFED_XML_DESCRIPTION="Chroni instancję TUF_ED: odmawia zapisania konta z więcej niż jedną rolą TUF_ED lub z rolą i statusem superużytkownika, natychmiast powiadamia e-mailem TUF_ED Owners, gdy konto zyskuje lub traci rolę albo gdy rozszerzenie zostaje zainstalowane lub zaktualizowane, i wyświetla ostrzeżenia TUF_ED na każdej stronie panelu administracyjnego. Pozostaw ją włączoną."
