COM_TUF_ED_ANCHOR_ERR_EXISTS="Kotwica zaufania istnieje, ale baza danych nie zawiera żadnego root: wcześniejsze wersje root zniknęły z bazy danych. Przywróć je; nowy pierwszy root zostanie odrzucony."
