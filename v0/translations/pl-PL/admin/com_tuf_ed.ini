COM_TUF_ED_MAIL_CORE_UPDATES_PLUGIN="The plugin \"Web Services - Joomla Update\" is disabled. Without it the update service cannot reach this site (404 on /api/index.php/v1/joomlaupdate/healthcheck), and registering for automated updates fails. Enable it under System → Plugins, then switch automated updates on again."
