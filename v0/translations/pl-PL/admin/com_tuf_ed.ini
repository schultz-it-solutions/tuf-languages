COM_TUF_ED_MAIL_DRIFT_BODY="Te sprawdzenia kroku konfiguracji TUF_ED nie są już spełnione:\n\n%s\n\nJeśli nie zmieniłeś tego sam, ustal, kto to zrobił. Aby przywrócić ustawienia, otwórz Komponenty → TUF Extension Developer → Konfiguracja."
