COM_TUF_ED_MAIL_KMS_KEYS_CHANGED="Your active keys have changed since the last signed version of the statement."
COM_TUF_ED_MAIL_KMS_OVERDUE="The review of your key management statement (version %1$d) was due on %2$s."
COM_TUF_ED_MAIL_KMS_SUBJECT="[%s] TUF_ED: review your key management statement"
COM_TUF_ED_MAIL_OWN_FILES_BODY="TUF_ED's own files on this instance do not match the file list of the installed release, or the list does not match its pin:\n\n%s\n\nTUF_ED refuses key handling and publishing until this is fixed; the hourly renewal stops as well. If you did not change TUF_ED's files yourself, treat the instance as compromised and do not sign anything on it. Details under Components → TUF Extension Developer → Setup → Extensions."
COM_TUF_ED_MAIL_OWN_FILES_SUBJECT="[%s] TUF_ED: its own files do not pass the check"
COM_TUF_ED_MAIL_RENEWAL_BODY="The hourly renewal of snapshot and timestamp failed:\n\n%s\n\nThe published timestamp.json expires on %s. After that, sites stop installing your updates until the renewal works again. Open Components → TUF Extension Developer → Publish to check."
