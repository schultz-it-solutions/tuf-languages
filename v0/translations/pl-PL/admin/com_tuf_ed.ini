COM_TUF_ED_MAIL_INTEGRITY_BODY="Codzienne sprawdzenie instancji wykazało różnice względem stanu bazowego potwierdzonego przez Ownera:\n\n%1$s\n\nWykluczone foldery (bez obliczania skrótów; pliki wykonywalne w nich są zgłaszane):\n\n%2$s\n\nSprawdzenie obliczyło skróty %3$s\n\nTUF_ED odmawia wszelkich operacji na kluczach, dopóki Owner nie przejrzy i nie potwierdzi zmian; cogodzinne odnawianie trwa dalej. Jeśli zmiana nie pochodzi z aktualizacji lub zmiany konfiguracji, o której wiesz, uznaj instancję za przejętą i niczego na niej nie podpisuj. Przejrzyj zmiany w Komponenty → TUF Extension Developer → Integralność."
