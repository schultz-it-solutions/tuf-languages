COM_TUF_ED_MAIL_OWN_FILES_BODY="Własne pliki TUF_ED na tej instancji nie odpowiadają liście plików zainstalowanego wydania lub lista nie odpowiada jej utrwaleniu:\n\n%s\n\nTUF_ED odmawia operacji na kluczach i publikowania, dopóki to nie zostanie naprawione; cogodzinne odnawianie również się zatrzymuje. Jeśli nie zmieniałeś sam plików TUF_ED, uznaj instancję za przejętą i niczego na niej nie podpisuj. Szczegóły w Komponenty → TUF Extension Developer → Konfiguracja → Rozszerzenia."
