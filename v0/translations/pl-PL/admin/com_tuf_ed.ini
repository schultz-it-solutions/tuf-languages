COM_TUF_ED_SETUP_CHECK_SCHEDULER_TASKS_DESC="Tworzy zadania TUF_ED: codzienne przypomnienie o wygasaniu, sprawdzenie rozszerzeń, sprawdzenie konfiguracji i instancji oraz cogodzinne odnawianie snapshot i timestamp. E-maile trafiają do wszystkich użytkowników w TUF_ED Owner."
