COM_TUF_ED_EXT_CONFIRM="Wiem, że to rozszerzenie działa obok kodu podpisującego."
COM_TUF_ED_EXT_CONFIRM_MISSING="Potwierdź, że wiesz, iż to rozszerzenie działa obok kodu podpisującego."
COM_TUF_ED_EXT_EXTENSION="Rozszerzenie"
COM_TUF_ED_EXT_INTRO="Rozszerzenia, które nie należą ani do rdzenia Joomla, ani do TUF. Bardzo nieliczne mogą mieć uzasadniony powód, by tu być, np. narzędzie do kopii zapasowych. Zezwolenie wiąże rozszerzenie z jego bieżącą wersją i sumą kontrolną jego plików: po każdej aktualizacji lub zmianie plików znów uznaje się je za niedozwolone, dopóki ponownie go nie potwierdzisz."
COM_TUF_ED_EXT_NONE="Poza rdzeniem Joomla i TUF nie zainstalowano żadnych rozszerzeń."
COM_TUF_ED_EXT_NOTE_REMOTE="Łącznik zdalnego zarządzania dla %s: ta usługa może z zewnątrz instalować i aktualizować rozszerzenia w tej witrynie, co omija zasadę czystej instancji. Zezwól na niego tylko wtedy, gdy ufasz tej usłudze i chronisz jej konto za pomocą MFA."
COM_TUF_ED_EXT_OTHERS_HEADING="Inne rozszerzenia"
COM_TUF_ED_EXT_REASON="Powód (wymagany)"
COM_TUF_ED_EXT_REASON_MISSING="Podaj powód, dla którego to rozszerzenie musi być w tej witrynie."
COM_TUF_ED_EXT_RECONFIRM="Potwierdź ponownie"
COM_TUF_ED_EXT_REMOTE_NOTE="Łączniki zdalnego zarządzania (monitorowanie witryn lub usługi aktualizacji) mogą z zewnątrz instalować i aktualizować rozszerzenia. Zezwolenie na jeden z nich oznacza powierzenie tej usłudze tej instancji, łącznie z tym, co działa obok kodu podpisującego. Archiwa kopii zapasowych zawierają bazę danych i konfigurację: odpowiednio chroń miejsce przechowywania kopii zapasowych."
COM_TUF_ED_EXT_REVOKE="Cofnij"
COM_TUF_ED_EXT_REVOKED="Cofnięto zezwolenie dla %s."
COM_TUF_ED_EXT_RISK="Ryzyko"
COM_TUF_ED_EXT_RISK_HIGH="wysokie"
COM_TUF_ED_EXT_RISK_HIGH_DESC="Działa przy każdym żądaniu, także przy żądaniach podpisu, lub jest ładowane przez inny kod."
COM_TUF_ED_EXT_RISK_LOW="niskie"
COM_TUF_ED_EXT_RISK_LOW_DESC="Brak własnego kodu wykonywalnego (kontener pakietu, pliki językowe)."
COM_TUF_ED_EXT_RISK_MEDIUM="średnie"
COM_TUF_ED_EXT_RISK_MEDIUM_DESC="Działa, gdy zostanie wywołane (własne strony, moduły lub zdarzenia)."
COM_TUF_ED_EXT_SOFT_LIMIT="Dozwolonych jest %d rozszerzeń (więcej niż %d). Ta instancja oddala się od stanu „czystego”; sprawdź, czy wszystkie są potrzebne."
COM_TUF_ED_EXT_STATE_ALLOWED="dozwolone"
COM_TUF_ED_EXT_STATE_CHANGED="zmienione od czasu zezwolenia"
COM_TUF_ED_EXT_STATE_FOREIGN="niedozwolone"
COM_TUF_ED_EXT_SUPERUSER_ONLY="Tylko superużytkownik może zezwalać na rozszerzenia lub cofać zezwolenia."
COM_TUF_ED_EXT_TITLE="TUF Extension Developer: rozszerzenia"
COM_TUF_ED_GUARD_ERR_DEBUG="Tryb debugowania Joomla jest włączony (Konfiguracja globalna → System). Rejestruje on żądania, w tym dane formularzy. Wyłącz go; do tego czasu TUF_ED odmawia wszelkich operacji na kluczach."
COM_TUF_ED_GUARD_ERR_DEBUG_PLUGIN="Wtyczka „System - Debugowanie” jest włączona. Rejestruje ona żądania, w tym dane formularzy. Wyłącz ją (konfiguracja zrobi to za Ciebie); do tego czasu TUF_ED odmawia wszelkich operacji na kluczach."
COM_TUF_ED_GUARD_ERR_SUPERUSER="Superużytkownicy nie mogą obsługiwać kluczy ani podpisów w TUF_ED. Zaloguj się na swoje konto roli TUF_ED (Owner lub Signer)."
COM_TUF_ED_INTEGRITY_ADDED="Dodane pliki (%d)"
COM_TUF_ED_INTEGRITY_BY="Przez"
COM_TUF_ED_INTEGRITY_CHANGED="Zmienione pliki (%d)"
COM_TUF_ED_INTEGRITY_CONFIRMED="Nowy stan bazowy (%d plików) został potwierdzony."
