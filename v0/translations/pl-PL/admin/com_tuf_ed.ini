COM_TUF_ED_MAIL_INTEGRITY_BODY="The daily instance check found differences from the baseline an Owner confirmed:\n\n%1$s\n\nExcluded folders (not hashed; executable files in them are reported):\n\n%2$s\n\nThe check hashed %3$s\n\nTUF_ED refuses key handling until an Owner has reviewed and confirmed the changes; the hourly renewal continues. If a change does not come from an update or a configuration change you know about, treat the instance as compromised and do not sign anything on it. Review the changes under Components → TUF Extension Developer → Integrity."
COM_TUF_ED_MAIL_INTEGRITY_SUBJECT="[%s] TUF_ED: the instance differs from its confirmed baseline"
COM_TUF_ED_MAIL_KMS_DUE="Your key management statement (version %1$d) is due for review on %2$s."
