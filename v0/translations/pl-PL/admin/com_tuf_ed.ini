COM_TUF_ED_SETUP_CHECK_GLOBAL_CONFIG="Global Configuration"
COM_TUF_ED_SETUP_CHECK_GLOBAL_CONFIG_DESC="Checked here, changed by hand: frontend offline with a neutral offline message, no search engine indexing, HTTPS for the entire site, short sessions, no debug output."
COM_TUF_ED_SETUP_CHECK_GROUPS="TUF_ED user groups"
COM_TUF_ED_SETUP_CHECK_GROUPS_DESC="Creates TUF_ED Owner (keys, root signing), TUF_EDC Signer (package signing) and TUF_ED Auditor (read-only) directly below Public."
COM_TUF_ED_SETUP_CHECK_INTEGRITY="Instance baseline"
COM_TUF_ED_SETUP_CHECK_INTEGRITY_DESC="Checked here, confirmed by an Owner on the Integrity page: the SHA-256 of every file of this Joomla instance, compared with the baseline an Owner confirmed. Key handling is refused until there is a baseline and the instance matches it."
COM_TUF_ED_SETUP_CHECK_LEGACY_GROUPS="Delete standard groups"
COM_TUF_ED_SETUP_CHECK_LEGACY_GROUPS_DESC="Deletes Author, Editor, Publisher, Manager and Administrator. Public, Guest, Registered and Super Users stay, because Joomla needs them."
COM_TUF_ED_SETUP_CHECK_LEGACY_USERS="Users in standard groups"
COM_TUF_ED_SETUP_CHECK_LEGACY_USERS_DESC="Removes users from Author, Editor, Publisher, Manager and Administrator. A user left without any group is moved to Registered and blocked (you can unblock them in Users). You are never blocked yourself."
COM_TUF_ED_SETUP_CHECK_PERMISSIONS="Permissions"
COM_TUF_ED_SETUP_CHECK_PERMISSIONS_DESC="Sets the global and the TUF_ED permissions for the new groups. Super Users always keep every right."
COM_TUF_ED_SETUP_CHECK_PLUGINS_OFF="Remote access plugins"
COM_TUF_ED_SETUP_CHECK_PLUGINS_OFF_DESC="Disables the Web Services (API) and API Authentication plugins, installing extensions from the web or from a URL, and the System - Debug plugin. Not Web Services - Joomla Update: automated Joomla updates need it (see the dashboard)."
COM_TUF_ED_SETUP_CHECK_PLUGINS_ON="Security plugins"
COM_TUF_ED_SETUP_CHECK_PLUGINS_ON_DESC="Enables HTTP Headers, User Actions Log and the TUF_ED plugins (scheduled tasks, role separation)."
COM_TUF_ED_SETUP_CHECK_SCHEDULER_CRON="Task runner (cron)"
COM_TUF_ED_SETUP_CHECK_SCHEDULER_CRON_DESC="Checked here, changed by hand: the frontend of this site is offline, so the lazy scheduler (which runs tasks on page visits) is not reliable. Turn it off and run the tasks from a cron job on the server."
COM_TUF_ED_SETUP_CHECK_SCHEDULER_TASKS="Scheduled tasks"
COM_TUF_ED_SETUP_CHECK_SCHEDULER_TASKS_DESC="Creates the TUF_ED tasks: daily expiry reminder, extension check, setup check and instance check, and the hourly renewal of snapshot and timestamp. Emails go to all users in TUF_ED Owner."
COM_TUF_ED_SETUP_CHECK_STORAGE="Storage folders"
