COM_TUF_ED_MAIL_ROLES_BODY="The role separation of this TUF_ED instance is not complete:\n\n%s\n\nEach role needs at least one account of its own that is active, has MFA set up and is not a Super User. An account may hold only one role. Check the accounts under Users → Manage, and the overview on the TUF_ED dashboard."
COM_TUF_ED_MAIL_ROLES_SUBJECT="[%s] TUF_ED: role accounts need attention"
COM_TUF_ED_MAIL_ROOT_EXPIRED_BODY="Your root metadata (root.json version %d) expired on %s.\n\nSites no longer install updates for your extensions until you sign a new root version: Components → TUF Extension Developer → Root metadata → Sign."
