COM_TUF_ED_SETUP_CHECK_STORAGE_DESC="Sprawdzane tutaj, ustawiane w Opcje → Przechowywanie: folder prywatny poza katalogiem głównym serwera WWW (sekret kluczy online, przesłane pakiety) i folder publikacji dla publicznego, statycznego repozytorium TUF. Potrzebne dopiero, gdy podpisujesz pakiety."
