COM_TUF_ED_INTEGRITY_INTRO="Dla każdego pliku tej instancji Joomla obliczany jest skrót i porównywany ze stanem bazowym potwierdzonym przez Ownera. Dla folderów, do których Joomla zapisuje w trakcie działania, skróty nie są obliczane, ale pliki wykonywalne w nich są zgłaszane (z wyjątkiem plików PHP, które nie mogą wykonywać kodu, jak wpisy pamięci podręcznej i pliki dziennika Joomla). Po zdarzeniu instalatora lub zmianie konfiguracji globalnej zmiany pozostają otwarte, dopóki Owner ich nie przejrzy i nie potwierdzi. Do tego czasu TUF_ED odmawia wszelkich operacji na kluczach; cogodzinne odnawianie snapshot i timestamp trwa dalej. To jest zabezpieczenie typu potykacz: ktoś, kto może wykonywać kod jako użytkownik serwera WWW, może zmienić pliki, stan bazowy i to sprawdzenie. Kod poza plikami (w bazie danych, poza folderem Joomla, w pamięci podręcznej opcode) nie jest objęty."
