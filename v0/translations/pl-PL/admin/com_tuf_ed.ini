COM_TUF_ED_MAIL_CORE_UPDATES_UNREGISTERED="Automated core updates are on, but this site is not registered with the update service yet. Save the Joomla Update options again; if registering fails, check that /api/index.php/v1/joomlaupdate/healthcheck is reachable from the internet."
COM_TUF_ED_MAIL_DRIFT_BODY="These checks of the TUF_ED setup step are no longer done:\n\n%s\n\nIf you did not change this yourself, find out who did. To restore the settings, open Components → TUF Extension Developer → Setup."
COM_TUF_ED_MAIL_DRIFT_SUBJECT="[%s] TUF_ED: setup settings have changed"
COM_TUF_ED_MAIL_EXTENSIONS_BODY="These extensions are installed on the TUF_ED instance but are not allowed, or have changed since they were allowed:\n\n%s\n\nIf you did not expect this, treat the instance as compromised and do not sign anything on it. Otherwise review the extensions under Components → TUF Extension Developer → Setup → Extensions."
COM_TUF_ED_MAIL_EXTENSIONS_SUBJECT="[%s] TUF_ED: %d extension(s) not allowed or changed"
