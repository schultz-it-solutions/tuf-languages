COM_TUF_ED_CONFIGURATION="TUF Extension Developer: opcje"
COM_TUF_ED_CONFIG_MAIN_WEBSITE_DESC="Twoja publiczna strona internetowa (https://…). Używana w proponowanym tekście strony offline tej witryny."
COM_TUF_ED_CONFIG_MAIN_WEBSITE_LABEL="Główna strona internetowa"
COM_TUF_ED_CONFIG_PRIVATE_PATH_DESC="Poza katalogiem głównym serwera WWW, np. /home/user/tuf_ed_private. Zawiera sekret, który pieczętuje klucze online snapshot i timestamp, oraz przesłane pakiety. Uwzględnij go w kopiach zapasowych, ale przechowuj te kopie oddzielnie od kopii bazy danych: sekret i baza danych razem otwierają klucze online."
COM_TUF_ED_CONFIG_PRIVATE_PATH_LABEL="Folder prywatny"
COM_TUF_ED_CONFIG_PUBLISH_METHOD_DESC="Gdzie zapisywane jest publiczne repozytorium TUF: w folderze na tym serwerze lub przez SFTP w folderze na innym serwerze (np. serwerze Twojej głównej strony)."
COM_TUF_ED_CONFIG_PUBLISH_METHOD_LABEL="Metoda publikacji"
COM_TUF_ED_CONFIG_PUBLISH_METHOD_LOCAL="Folder na tym serwerze"
COM_TUF_ED_CONFIG_PUBLISH_METHOD_SFTP="SFTP na inny serwer"
COM_TUF_ED_CONFIG_PUBLISH_PACKAGES_DESC="Kopiuj też podpisane pakiety do folderu publikacji jako targets/&lt;sha256&gt;.&lt;name&gt;. Pozostaw wyłączone, jeśli dostarczasz pakiety z istniejącego serwera aktualizacji."
COM_TUF_ED_CONFIG_PUBLISH_PACKAGES_LABEL="Publikuj pakiety"
COM_TUF_ED_CONFIG_PUBLISH_PATH_DESC="Gdzie publiczne repozytorium TUF jest zapisywane jako pliki statyczne: w folderze Twojej głównej strony lub w nowym folderze poniżej katalogu głównego tej witryny (nie w folderze Joomla). Serwer WWW dostarcza te pliki bezpośrednio, także gdy ta witryna jest offline."
COM_TUF_ED_CONFIG_PUBLISH_PATH_LABEL="Folder publikacji"
COM_TUF_ED_CONFIG_PUBLISH_URL_DESC="Adres https://…, pod którym dostępny jest folder publikacji. Klienci aktualizacji pobierają stamtąd timestamp.json, wersjonowane metadane oraz, jeśli są publikowane, pakiety."
COM_TUF_ED_CONFIG_PUBLISH_URL_LABEL="Publiczny URL folderu publikacji"
COM_TUF_ED_CONFIG_REQUEST_LIFETIME_DESC="Jak długo można podpisać przygotowane żądanie podpisu (1–30). Staje się ono też bezużyteczne, gdy tylko zmieni się to, na czym się opiera."
COM_TUF_ED_CONFIG_REQUEST_LIFETIME_LABEL="Ważność żądania podpisu (dni)"
COM_TUF_ED_CONFIG_ROOT_EXPIRY_DESC="Domyślna ważność nowej wersji root.json. Klienci odrzucają wygasły root, więc podpisz nową wersję na długo przed tą datą."
COM_TUF_ED_CONFIG_ROOT_EXPIRY_LABEL="Wygaśnięcie root (dni)"
COM_TUF_ED_CONFIG_ROOT_LABEL="Metadane root"
COM_TUF_ED_CONFIG_SFTP_AUTH_DESC="Zalecany jest klucz. Użyj konta SFTP, które ma dostęp tylko do folderu repozytorium (chroot): każdy opublikowany plik jest podpisany, więc to konto może w najgorszym razie zablokować aktualizacje, ale nie powinno mieć dostępu do niczego innego."
COM_TUF_ED_CONFIG_SFTP_AUTH_KEY="Plik klucza prywatnego"
COM_TUF_ED_CONFIG_SFTP_AUTH_LABEL="Logowanie za pomocą"
COM_TUF_ED_CONFIG_SFTP_AUTH_PASSWORD="Hasło"
COM_TUF_ED_CONFIG_SFTP_HOST_DESC="Nazwa hosta lub adres IP serwera, który dostarcza repozytorium, np. ssh.example.com."
COM_TUF_ED_CONFIG_SFTP_HOST_KEY_DESC="Odcisk SHA256 klucza hosta serwera, w postaci wypisywanej przez ssh-keygen -lf (SHA256:…). Nic nie jest wysyłane do serwera z innym kluczem. Na początku pozostaw puste: Publikowanie → Pokaż klucz hosta pokazuje, co przedstawia serwer; porównaj to z odciskiem podanym przez dostawcę hostingu, zanim go wpiszesz."
COM_TUF_ED_CONFIG_SFTP_HOST_KEY_LABEL="Odcisk klucza hosta"
COM_TUF_ED_CONFIG_SFTP_HOST_LABEL="Host SFTP"
COM_TUF_ED_CONFIG_SFTP_KEY_FILE_DESC="Klucz prywatny OpenSSH bez hasła (potrzebny do cogodzinnego odnawiania), utworzony np. poleceniem ssh-keygen -t ed25519 -N '' -f sftp_ed25519. Sama nazwa pliku jest szukana w folderze prywatnym; ścieżka bezwzględna musi znajdować się poza katalogiem głównym serwera WWW. Uprawnienia 0600."
COM_TUF_ED_CONFIG_SFTP_KEY_FILE_LABEL="Plik klucza prywatnego"
COM_TUF_ED_CONFIG_SFTP_PASSWORD_DESC="Hasło nie jest zapisywane w opcjach (bazie danych). Ustaw je na stronie Publikowanie: TUF_ED przechowuje je w folderze prywatnym. Plik klucza nadal jest lepszym wyborem."
COM_TUF_ED_CONFIG_SFTP_PASSWORD_LABEL="Hasło SFTP"
COM_TUF_ED_CONFIG_SFTP_PATH_DESC="Folder na serwerze SFTP, który serwer WWW udostępnia pod poniższym publicznym adresem URL, np. /var/www/example.com/tuf lub tuf (względem folderu logowania). Musi istnieć."
COM_TUF_ED_CONFIG_SFTP_PATH_LABEL="Folder zdalny"
COM_TUF_ED_CONFIG_SFTP_PORT_LABEL="Port SFTP"
COM_TUF_ED_CONFIG_SFTP_USERNAME_LABEL="Nazwa użytkownika SFTP"
COM_TUF_ED_CONFIG_SIGNING_LABEL="Podpisywanie pakietów"
COM_TUF_ED_CONFIG_SITE_LABEL="Witryna"
COM_TUF_ED_CONFIG_SNAPSHOT_EXPIRY_DESC="Ważność snapshot.json (1–30). Odnawiany automatycznie kluczem online snapshot, gdy zostaje mniej niż połowa."
COM_TUF_ED_CONFIG_SNAPSHOT_EXPIRY_LABEL="Wygaśnięcie snapshot (dni)"
COM_TUF_ED_CONFIG_STORAGE_DESC="Ścieżki bezwzględne na tym serwerze. Oba foldery muszą istnieć i być zapisywalne dla PHP."
COM_TUF_ED_CONFIG_STORAGE_LABEL="Przechowywanie"
COM_TUF_ED_CONFIG_TARGETS_EXPIRY_DESC="Domyślna ważność nowej wersji targets.json (7–365). Jest ona podpisywana Twoim kluczem offline targets, więc odnawia się ją ręcznie; otrzymujesz przypomnienia 30 i 7 dni wcześniej."
COM_TUF_ED_CONFIG_TARGETS_EXPIRY_LABEL="Wygaśnięcie targets (dni)"
COM_TUF_ED_CONFIG_TIMESTAMP_EXPIRY_DESC="Ważność timestamp.json (4–168). Odnawiany automatycznie przez cogodzinne zadanie, gdy zostaje mniej niż połowa. Krótsza ważność oznacza, że klienci wcześniej zauważą zamrożone repozytorium; cogodzinne zadanie musi wtedy działać niezawodnie."
COM_TUF_ED_CONFIG_TIMESTAMP_EXPIRY_LABEL="Wygaśnięcie timestamp (godziny)"
COM_TUF_ED_CONFIG_UNINSTALL_DESTROY_DESC="Tak (domyślnie): odinstalowanie TUF_ED niszczy zapieczętowane klucze online (snapshot, timestamp), plik sekretu, który je pieczętuje, oraz zapisane hasło SFTP. Nie można ich potem odzyskać: po nowej instalacji generujesz nowe klucze online i podpisujesz nową wersję root. Wybierz Nie tylko wtedy, gdy odinstalowujesz, aby od razu zainstalować ponownie; klucze pozostają wtedy na tym serwerze, dopóki ich nie usuniesz."
COM_TUF_ED_CONFIG_UNINSTALL_DESTROY_LABEL="Przy odinstalowaniu: zniszcz klucze online"
COM_TUF_ED_CORE_UPDATES_AUTOMATED="Automatyczne aktualizacje rdzenia"
COM_TUF_ED_CORE_UPDATES_AUTOMATED_AT_SIGNING="Automatyczne aktualizacje rdzenia przy podpisywaniu"
COM_TUF_ED_CORE_UPDATES_HEADING="Automatyczne aktualizacje Joomla"
COM_TUF_ED_CORE_UPDATES_HELP="Pozostaw automatyczne aktualizacje rdzenia włączone: serwer podpisujący ze znaną luką w Joomla podważa to, co podpisuje. Usługa aktualizacji sprawdza tę witrynę przez /api/index.php/v1/joomlaupdate/healthcheck, więc ta ścieżka musi pozostać dostępna, także gdy frontend jest offline. Jeśli aktualizujesz ręcznie, zapisz powód i swój termin dla wydań bezpieczeństwa w deklaracji zarządzania kluczami."
COM_TUF_ED_CORE_UPDATES_JUSTIFIED="Powód ręcznego aktualizowania"
COM_TUF_ED_CORE_UPDATES_JUSTIFIED_IN="W wersji %d deklaracji zarządzania kluczami"
COM_TUF_ED_CORE_UPDATES_NOT_AVAILABLE="Joomla oferuje automatyczne aktualizacje tylko z kanałem aktualizacji &quot;Domyślny&quot; i minimalną stabilnością &quot;Stabilna&quot;."
COM_TUF_ED_CORE_UPDATES_OPEN_OPTIONS="Otwórz opcje Aktualizacji Joomla"
COM_TUF_ED_CORE_UPDATES_PLUGIN="Wtyczka &quot;Web Services - Joomla Update&quot;"
COM_TUF_ED_CORE_UPDATES_REGISTERED="Zarejestrowano w usłudze aktualizacji"
COM_TUF_ED_CORE_UPDATES_WARN_OFF="Automatyczne aktualizacje rdzenia Joomla są wyłączone, a podpisana deklaracja zarządzania kluczami nie podaje powodu ręcznego aktualizowania. <a href=\"%1$s\">Włącz je</a> (Aktualizacja Joomla → Opcje → Automatyczne aktualizacje) albo zapisz powód i swój termin dla wydań bezpieczeństwa w <a href=\"%2$s\">deklaracji zarządzania kluczami</a> i podpisz ją."
COM_TUF_ED_CORE_UPDATES_WARN_PLUGIN="Wtyczka &quot;Web Services - Joomla Update&quot; jest wyłączona. Bez niej usługa aktualizacji nie może dotrzeć do tej witryny (404 na /api/index.php/v1/joomlaupdate/healthcheck), a rejestracja automatycznych aktualizacji się nie powiedzie. <a href=\"%s\">Włącz wtyczkę</a>, a następnie ponownie włącz automatyczne aktualizacje."
COM_TUF_ED_CORE_UPDATES_WARN_UNAVAILABLE="Automatyczne aktualizacje rdzenia Joomla nie są możliwe przy obecnych <a href=\"%1$s\">opcjach Aktualizacji Joomla</a>: wymagają kanału aktualizacji &quot;Domyślny&quot; i minimalnej stabilności &quot;Stabilna&quot;. Zmień te opcje albo zapisz powód ręcznego aktualizowania w <a href=\"%2$s\">deklaracji zarządzania kluczami</a> i podpisz ją."
COM_TUF_ED_CORE_UPDATES_WARN_UNREGISTERED="Automatyczne aktualizacje rdzenia Joomla są włączone, ale ta witryna nie jest jeszcze zarejestrowana w usłudze aktualizacji. Zapisz ponownie <a href=\"%s\">opcje Aktualizacji Joomla</a>; jeśli rejestracja się nie powiedzie, sprawdź, czy /api/index.php/v1/joomlaupdate/healthcheck jest dostępny z internetu."
