COM_TUF_ED_ANCHOR_ERR_GAP="W bazie danych brakuje wersji root %d."
COM_TUF_ED_ANCHOR_ERR_LATEST="Kotwica zaufania zapisuje wersję root %1$d, a baza danych kończy się inną wersją %2$d (lub innym plikiem)."
COM_TUF_ED_ANCHOR_ERR_MISSING="W folderze prywatnym nie ma kotwicy zaufania."
COM_TUF_ED_ANCHOR_ERR_NOT_UPDATED="Wersja root %1$d jest zapisana, ale nie udało się zaktualizować kotwicy zaufania (%2$s). Zapisz ją na stronie Metadane root."
COM_TUF_ED_ANCHOR_ERR_WRITE="Nie można zapisać kotwicy zaufania %s."
COM_TUF_ED_ANCHOR_EXPLAIN="Kotwica zaufania w folderze prywatnym zapisuje pierwszy i najnowszy root, który podpisałeś. Jeśli baza danych już jej nie odpowiada, ktoś mógł podmienić tam wersje root. Porównaj poniższe pliki z opublikowanymi (root.json i wersjonowane pliki root) oraz z wersjami root przechowywanymi gdzie indziej, na przykład w stanie zaufania tuf-ed-signer. Zapisz nową kotwicę tylko wtedy, gdy to są Twoje wersje."
