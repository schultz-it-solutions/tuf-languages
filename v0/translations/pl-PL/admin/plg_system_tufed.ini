PLG_SYSTEM_TUFED="System - TUF Extension Developer"
PLG_SYSTEM_TUFED_MAIL_EXT_INSTALLED="Zainstalowano rozszerzenie, które nie należy do Joomla ani do TUF.\n\nRozszerzenie: %1$s\nWersja: %2$s\nZainstalował: %3$s\n\nDziała ono w tym samym procesie PHP co kod podpisujący. Klucze online nie są używane, dopóki nie zostanie usunięte lub wyraźnie dozwolone (Konfiguracja → Rozszerzenia)."
PLG_SYSTEM_TUFED_MAIL_EXT_SUBJECT="[%s] TUF_ED: zainstalowano lub zaktualizowano rozszerzenie"
PLG_SYSTEM_TUFED_MAIL_EXT_UPDATED="Zaktualizowano rozszerzenie, które nie należy do Joomla ani do TUF.\n\nRozszerzenie: %1$s\nWersja: %2$s\nZaktualizował: %3$s\n\nZezwolenie wygasa przy każdej zmianie rozszerzenia: klucze online nie są używane, dopóki ponownie nie zezwolisz na nową wersję (Konfiguracja → Rozszerzenia)."
PLG_SYSTEM_TUFED_MAIL_FOOTER="Ta wiadomość została wysłana natychmiast przez wtyczkę systemową TUF_ED (plg_system_tufed) do wszystkich użytkowników w grupie TUF_ED Owner."
PLG_SYSTEM_TUFED_MAIL_ROLES_CHANGED="Role TUF_ED konta zostały zmienione.\n\nKonto: %1$s\nPrzedtem: %2$s\nTeraz: %3$s\nZmienił: %4$s\n\nJeśli nie spodziewałeś się tej zmiany, natychmiast sprawdź konto w Użytkownicy → Zarządzaj: TUF_ED Owners i TUF_EDC Signers mogą podpisywać pakiety."
PLG_SYSTEM_TUFED_MAIL_ROLES_DELETED="Usunięto konto z rolą TUF_ED.\n\nKonto: %1$s\nRole: %2$s\nUsunął: %4$s\n\nSprawdź w kokpicie TUF_ED, czy każda rola nadal ma użyteczne konto."
PLG_SYSTEM_TUFED_MAIL_ROLES_SUBJECT="[%s] TUF_ED: zmieniono przynależność do ról"
PLG_SYSTEM_TUFED_ROLE_CONFLICT="Rozdzielenie ról TUF_ED: konto &quot;%1$s&quot; miałoby %2$s. Konto może mieć tylko jedną rolę TUF_ED, a superużytkownik żadnej. Użyj osobnego konta (z własnym adresem e-mail lub aliasem) dla każdej roli."
PLG_SYSTEM_TUFED_WARN_INTEGRITY="<strong>TUF_ED: instancja nie odpowiada swojemu potwierdzonemu stanowi bazowemu</strong> (%1$s). TUF_ED odmawia wszelkich operacji na kluczach, dopóki Owner nie przejrzy i nie potwierdzi zmian. <a href=\"%2$s\">Przejrzyj zmiany</a>."
PLG_SYSTEM_TUFED_WARN_NOT_CLEAN="<strong>TUF_ED: ta instancja Joomla nie jest czysta.</strong> Rozszerzenia (%1$d) nie są dozwolone lub zmieniły się od czasu zezwolenia: %2$s. Każde rozszerzenie działa w tym samym procesie PHP co kod podpisujący. <a href=\"%3$s\">Sprawdź rozszerzenia</a>."
PLG_SYSTEM_TUFED_WARN_OWN_FILES="<strong>TUF_ED: jego własne pliki nie przechodzą sprawdzenia</strong> (%1$s). TUF_ED odmawia operacji na kluczach i publikowania, dopóki to nie zostanie naprawione. <a href=\"%2$s\">Pokaż szczegóły</a>."
PLG_SYSTEM_TUFED_WARN_ROLES="<strong>TUF_ED:</strong> rozdzielenie ról nie jest kompletne (rola nie ma użytecznego konta lub konto ma więcej niż jedną rolę). <a href=\"%s\">Zobacz kokpit</a>."
PLG_SYSTEM_TUFED_XML_DESCRIPTION="Chroni instancję TUF_ED: odmawia zapisania konta z więcej niż jedną rolą TUF_ED lub z rolą i statusem superużytkownika, natychmiast powiadamia e-mailem TUF_ED Owners, gdy konto zyskuje lub traci rolę albo gdy rozszerzenie zostaje zainstalowane lub zaktualizowane, i wyświetla ostrzeżenia TUF_ED na każdej stronie panelu administracyjnego. Pozostaw ją włączoną."
