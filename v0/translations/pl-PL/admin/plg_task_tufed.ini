PLG_TASK_TUFED="Zadanie - TUF Extension Developer"
PLG_TASK_TUFED_ALLOWLIST_DESC="Sprawdza własne pliki TUF_ED względem utrwalonej listy plików, ponownie oblicza sumy kontrolne dozwolonych rozszerzeń i powiadamia e-mailem TUF_ED Owners, jeśli pliki TUF_ED nie przejdą sprawdzenia lub rozszerzenie jest nowe, niedozwolone albo zmienione."
PLG_TASK_TUFED_ALLOWLIST_TITLE="TUF_ED: sprawdzenie rozszerzeń"
PLG_TASK_TUFED_DRIFT_DESC="Powiadamia e-mailem TUF_ED Owners, jeśli ustawienie kroku konfiguracji zostało cofnięte, jeśli rola nie ma użytecznego konta lub jeśli konto ma więcej niż jedną rolę."
PLG_TASK_TUFED_DRIFT_TITLE="TUF_ED: sprawdzenie konfiguracji"
PLG_TASK_TUFED_EXPIRY_DESC="Powiadamia e-mailem TUF_ED Owners 30 i 7 dni przed wygaśnięciem root.json lub targets.json oraz gdy któryś z nich wygasł. Przypomina też o terminie przeglądu deklaracji zarządzania kluczami i o aktywnych kluczach, których ona nie opisuje."
PLG_TASK_TUFED_EXPIRY_TITLE="TUF_ED: przypomnienie o wygasaniu"
PLG_TASK_TUFED_INTEGRITY_DESC="Oblicza skrót każdego pliku instancji Joomla, porównuje go ze stanem bazowym potwierdzonym przez Ownera i powiadamia e-mailem TUF_ED Owners o każdej różnicy. Wiadomość wymienia też wykluczone foldery. Uruchamiać codziennie."
PLG_TASK_TUFED_INTEGRITY_TITLE="TUF_ED: sprawdzenie instancji"
PLG_TASK_TUFED_RENEW_DESC="Uruchamiać co godzinę. Podpisuje kluczami online nowe snapshot i timestamp, gdy zostaje mniej niż połowa ich ważności lub po zmianie, i publikuje repozytorium. Zatrzymuje się (i powiadamia e-mailem TUF_ED Owners), dopóki instancja nie jest czysta."
PLG_TASK_TUFED_RENEW_TITLE="TUF_ED: odnawianie snapshot i timestamp"
PLG_TASK_TUFED_XML_DESCRIPTION="Zaplanowane zadania dla TUF_ED: przypomnienia o wygasaniu, dozwolone rozszerzenia, odstępstwa od konfiguracji, sprawdzenie instancji i cogodzinne odnawianie snapshot i timestamp. E-maile trafiają do wszystkich użytkowników w TUF_ED Owner."
