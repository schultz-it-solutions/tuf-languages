PLG_CONSOLE_TUFED="Console - TUF Extension Developer"
PLG_CONSOLE_TUFED_XML_DESCRIPTION="Γραμμή εντολών για το TUF_ED (php cli/joomla.php list tufed): κατάσταση, λίστα πακέτων, υπογραφή του targets.json με το offline κλειδί, δημοσίευση, δοκιμή του προορισμού δημοσίευσης, ανανέωση των snapshot και timestamp. Οι αλλαγές απαιτούν --as=&lt;username&gt; ενός λογαριασμού TUF_ED Owner ή TUF_EDC Signer."
