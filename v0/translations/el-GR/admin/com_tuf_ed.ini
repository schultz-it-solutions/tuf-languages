COM_TUF_ED_MAIL_CORE_UPDATES_BODY="Οι αυτόματες ενημερώσεις πυρήνα του Joomla σε αυτή την εγκατάσταση TUF_ED χρειάζονται προσοχή:\n\n%s\n\nΈνας διακομιστής υπογραφής με γνωστή ευπάθεια του Joomla υπονομεύει ό,τι υπογράφει. Ανοίξτε τον πίνακα ελέγχου του TUF_ED (κάρτα «Αυτόματες ενημερώσεις Joomla») για λεπτομέρειες και συνδέσμους."
COM_TUF_ED_MAIL_CORE_UPDATES_OFF="Οι αυτόματες ενημερώσεις πυρήνα είναι απενεργοποιημένες και η υπογεγραμμένη δήλωση διαχείρισης κλειδιών δεν αναφέρει αιτία για χειροκίνητη ενημέρωση. Ενεργοποιήστε τις (Ενημέρωση Joomla → Επιλογές → Αυτόματες ενημερώσεις) ή καταγράψτε την αιτία και την προθεσμία σας για τις εκδόσεις ασφαλείας στη δήλωση διαχείρισης κλειδιών και υπογράψτε τη."
COM_TUF_ED_MAIL_CORE_UPDATES_PLUGIN="Το πρόσθετο «Web Services - Joomla Update» είναι απενεργοποιημένο. Χωρίς αυτό η υπηρεσία ενημερώσεων δεν μπορεί να φτάσει σε αυτόν τον ιστότοπο (404 στο /api/index.php/v1/joomlaupdate/healthcheck) και η καταχώριση για αυτόματες ενημερώσεις αποτυγχάνει. Ενεργοποιήστε το στο Σύστημα → Πρόσθετα και στη συνέχεια ενεργοποιήστε ξανά τις αυτόματες ενημερώσεις."
