COM_TUF_ED_INTEGRITY_INTRO="Για κάθε αρχείο αυτής της εγκατάστασης Joomla υπολογίζεται hash και συγκρίνεται με την κατάσταση αναφοράς που επιβεβαίωσε ένας Owner. Για τους φακέλους στους οποίους γράφει το Joomla κατά την εκτέλεση δεν υπολογίζεται hash, αλλά τα εκτελέσιμα αρχεία σε αυτούς αναφέρονται (εκτός από αρχεία PHP που δεν μπορούν να εκτελέσουν κώδικα, όπως οι καταχωρίσεις cache και τα αρχεία καταγραφής του Joomla). Μετά από ένα συμβάν εγκατάστασης ή μια αλλαγή των Γενικών ρυθμίσεων, οι αλλαγές παραμένουν ανοιχτές μέχρι να τις εξετάσει και να τις επιβεβαιώσει ένας Owner. Μέχρι τότε το TUF_ED αρνείται κάθε χειρισμό κλειδιών· η ωριαία ανανέωση των snapshot και timestamp συνεχίζεται. Πρόκειται για συναγερμό παγίδας: όποιος μπορεί να εκτελέσει κώδικα ως χρήστης του διακομιστή web μπορεί να αλλάξει τα αρχεία, την κατάσταση αναφοράς και αυτόν τον έλεγχο. Κώδικας εκτός αρχείων (στη βάση δεδομένων, εκτός του φακέλου του Joomla, στην cache opcode) δεν καλύπτεται."
