COM_TUF_ED_ANCHOR_BUTTON="Εγγραφή της άγκυρας εμπιστοσύνης για αυτή την αλυσίδα"
COM_TUF_ED_ANCHOR_CONFIRM="Σύγκρινα αυτές τις εκδόσεις root· είναι αυτές που υπέγραψα."
COM_TUF_ED_ANCHOR_CONFIRM_MISSING="Επιβεβαιώστε ότι συγκρίνατε τις εκδόσεις root."
