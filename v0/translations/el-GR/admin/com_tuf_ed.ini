COM_TUF_ED_ANCHOR_ERR_CHANGED="Το πιο πρόσφατο root άλλαξε από τότε που το συγκρίνατε. Συγκρίνετε ξανά."
COM_TUF_ED_ANCHOR_ERR_DAMAGED="Η άγκυρα εμπιστοσύνης στον ιδιωτικό φάκελο είναι κατεστραμμένη."
COM_TUF_ED_ANCHOR_ERR_EXISTS="Υπάρχει άγκυρα εμπιστοσύνης, αλλά η βάση δεδομένων δεν περιέχει κανένα root: τα προηγούμενα root έχουν χαθεί από τη βάση δεδομένων. Επαναφέρετέ τα· ένα νέο πρώτο root απορρίπτεται."
COM_TUF_ED_ANCHOR_ERR_FIRST="Η έκδοση root 1 στη βάση δεδομένων δεν είναι αυτή που καταγράφει η άγκυρα εμπιστοσύνης."
COM_TUF_ED_ANCHOR_ERR_GAP="Η έκδοση root %d λείπει από τη βάση δεδομένων."
COM_TUF_ED_ANCHOR_ERR_LATEST="Η άγκυρα εμπιστοσύνης καταγράφει την έκδοση root %1$d, η βάση δεδομένων τελειώνει με διαφορετική έκδοση %2$d (ή διαφορετικό αρχείο)."
COM_TUF_ED_ANCHOR_ERR_MISSING="Δεν υπάρχει άγκυρα εμπιστοσύνης στον ιδιωτικό φάκελο."
COM_TUF_ED_ANCHOR_ERR_NOT_UPDATED="Η έκδοση root %1$d αποθηκεύτηκε, αλλά η άγκυρα εμπιστοσύνης δεν μπόρεσε να ενημερωθεί (%2$s). Εγγράψτε τη στη σελίδα Μεταδεδομένα root."
COM_TUF_ED_ANCHOR_ERR_WRITE="Δεν είναι δυνατή η εγγραφή της άγκυρας εμπιστοσύνης %s."
COM_TUF_ED_ANCHOR_EXPLAIN="Η άγκυρα εμπιστοσύνης στον ιδιωτικό φάκελο καταγράφει το πρώτο και το πιο πρόσφατο root που υπογράψατε. Αν η βάση δεδομένων δεν ταιριάζει πλέον με αυτήν, κάποιος μπορεί να αντικατέστησε τα root εκεί. Συγκρίνετε τα παρακάτω αρχεία με τα δημοσιευμένα (root.json και τα root με έκδοση) και με τις εκδόσεις root που φυλάτε αλλού, για παράδειγμα στην κατάσταση εμπιστοσύνης του tuf-ed-signer. Εγγράψτε νέα άγκυρα μόνο αν είναι δικά σας."
COM_TUF_ED_ANCHOR_FILE="Αρχείο"
COM_TUF_ED_ANCHOR_HEADING="Η αλυσίδα root δεν ταιριάζει με την άγκυρα εμπιστοσύνης"
COM_TUF_ED_ANCHOR_NOTICE="<strong>Το TUF_ED δεν εμπιστεύεται την αποθηκευμένη αλυσίδα root</strong>: %1$s Τίποτα δεν υπογράφεται ούτε δημοσιεύεται μέχρι να το εξετάσει ένας Owner. <a href=\"%2$s\">Λεπτομέρειες</a>"
COM_TUF_ED_ANCHOR_WRITTEN="Η άγκυρα εμπιστοσύνης καταγράφει πλέον την έκδοση root %d."
