COM_TUF_ED_MAIL_CORE_UPDATES_UNAVAILABLE="Οι αυτόματες ενημερώσεις πυρήνα δεν είναι δυνατές με τις τρέχουσες επιλογές της Ενημέρωσης Joomla: απαιτούν κανάλι ενημερώσεων «Προεπιλογή» και ελάχιστη σταθερότητα «Σταθερή». Αλλάξτε αυτές τις επιλογές ή καταγράψτε την αιτία της χειροκίνητης ενημέρωσης στη δήλωση διαχείρισης κλειδιών και υπογράψτε τη."
COM_TUF_ED_MAIL_CORE_UPDATES_UNREGISTERED="Οι αυτόματες ενημερώσεις πυρήνα είναι ενεργοποιημένες, αλλά αυτός ο ιστότοπος δεν έχει ακόμη καταχωριστεί στην υπηρεσία ενημερώσεων. Αποθηκεύστε ξανά τις επιλογές της Ενημέρωσης Joomla· αν η καταχώριση αποτύχει, ελέγξτε ότι το /api/index.php/v1/joomlaupdate/healthcheck είναι προσβάσιμο από το διαδίκτυο."
COM_TUF_ED_MAIL_DRIFT_BODY="Αυτοί οι έλεγχοι του βήματος ρύθμισης του TUF_ED δεν πληρούνται πλέον:\n\n%s\n\nΑν δεν το αλλάξατε εσείς, βρείτε ποιος το έκανε. Για να επαναφέρετε τις ρυθμίσεις, ανοίξτε Εφαρμογές → TUF Extension Developer → Ρύθμιση."
