COM_TUF_ED_KEYS_GENERATE_DOWNLOAD="Το αρχείο κλειδιού κατεβαίνει μόλις κάνετε κλικ στο κουμπί, και μόνο τότε: δεν αποθηκεύεται στον διακομιστή, οπότε δεν μπορεί να κατέβει ξανά. Φυλάξτε το με ασφάλεια, στη συνέχεια μεταβείτε στη λίστα κλειδιών και επιβεβαιώστε το νέο κλειδί μεταφορτώνοντας το αρχείο μία φορά. Μέχρι τότε το κλειδί δεν χρησιμοποιείται. Ένα κλειδί που δεν επιβεβαιώνεται εντός 24 ωρών διαγράφεται."
COM_TUF_ED_KEYS_GENERATE_INTRO="Δημιουργείται νέο ζεύγος κλειδιών Ed25519 σε αυτόν τον διακομιστή (υπογραφή στο component). Το πρόγραμμα περιήγησής σας κατεβάζει αμέσως το ιδιωτικό κλειδί, ως αρχείο κρυπτογραφημένο με τη φράση πρόσβασης που εισάγετε εδώ· κανένα αντίγραφο δεν μένει στον διακομιστή. Ο ιστότοπος κρατά μόνο το δημόσιο κλειδί. Για να υπογράψετε, μεταφορτώνετε ξανά αυτό το αρχείο. Για την ισχυρότερη προστασία, φυλάξτε αντί γι' αυτό το κλειδί root σας offline: δημιουργήστε το στον δικό σας υπολογιστή και χρησιμοποιήστε την Καταχώριση offline κλειδιού."
