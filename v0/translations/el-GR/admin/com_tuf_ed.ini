COM_TUF_ED_ACTION_INTEGRITY="Επιβεβαίωση κατάστασης αναφοράς της εγκατάστασης"
COM_TUF_ED_ACTION_INTEGRITY_DESC="Επιβεβαίωση της τρέχουσας κατάστασης της εγκατάστασης Joomla ως νέας κατάστασης αναφοράς μετά τον έλεγχο των αλλαγών. Δεν παραχωρείται ποτέ στους Υπερχρήστες."
