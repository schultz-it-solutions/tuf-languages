COM_TUF_ED_OWN_INTRO="Το TUF_ED αναγνωρίζει τα δικά του αρχεία από το SHA-256 τους, όχι από ονόματα επεκτάσεων. Κάθε έκδοση συνοδεύεται από λίστα των αρχείων της· κατά την εγκατάσταση, το hash αυτής της λίστας κλειδώνεται στον ιδιωτικό φάκελο. Κάθε αρχείο της λίστας πρέπει να ταιριάζει, οι φάκελοι του TUF_ED δεν πρέπει να περιέχουν τίποτε άλλο και κανένα πρότυπο δεν επιτρέπεται να παρακάμπτει τις σελίδες του TUF_ED. Πρόκειται για συναγερμό παγίδας κατά ξένου ή τροποποιημένου κώδικα: όποιος μπορεί να γράψει και στα αρχεία του TUF_ED και στον ιδιωτικό φάκελο μπορεί να τον παρακάμψει. Απέναντι σε πλήρη παραβίαση του διακομιστή βοηθά μόνο η offline υπογραφή."
