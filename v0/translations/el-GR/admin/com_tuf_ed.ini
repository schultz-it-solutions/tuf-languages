COM_TUF_ED_MAIL_EXTENSIONS_SUBJECT="[%s] TUF_ED: %d επεκτάσεις δεν επιτρέπονται ή άλλαξαν"
COM_TUF_ED_MAIL_FOOTER="Αυτό το μήνυμα στάλθηκε από τις προγραμματισμένες εργασίες του TUF Extension Developer (com_tuf_ed) σε όλους τους χρήστες της ομάδας TUF_ED Owner. Το ίδιο εύρημα δεν αποστέλλεται ξανά· μια αλλαγή αποστέλλεται."
COM_TUF_ED_MAIL_INTEGRITY_BODY="Ο ημερήσιος έλεγχος της εγκατάστασης βρήκε διαφορές από την κατάσταση αναφοράς που επιβεβαίωσε ένας Owner:\n\n%1$s\n\nΕξαιρούμενοι φάκελοι (χωρίς hash· τα εκτελέσιμα αρχεία σε αυτούς αναφέρονται):\n\n%2$s\n\nΟ έλεγχος υπολόγισε hash για %3$s\n\nΤο TUF_ED αρνείται κάθε χειρισμό κλειδιών μέχρι ένας Owner να εξετάσει και να επιβεβαιώσει τις αλλαγές· η ωριαία ανανέωση συνεχίζεται. Αν μια αλλαγή δεν προέρχεται από ενημέρωση ή αλλαγή ρυθμίσεων που γνωρίζετε, θεωρήστε ότι η εγκατάσταση έχει παραβιαστεί και μην υπογράφετε τίποτα σε αυτήν. Εξετάστε τις αλλαγές στο Εφαρμογές → TUF Extension Developer → Ακεραιότητα."
COM_TUF_ED_MAIL_INTEGRITY_SUBJECT="[%s] TUF_ED: η εγκατάσταση διαφέρει από την επιβεβαιωμένη κατάσταση αναφοράς της"
COM_TUF_ED_MAIL_KMS_DUE="Η δήλωση διαχείρισης κλειδιών σας (έκδοση %1$d) πρέπει να αναθεωρηθεί έως τις %2$s."
COM_TUF_ED_MAIL_KMS_HOWTO="Για αναθεώρηση: ανοίξτε Εφαρμογές → TUF Extension Developer → Διαχείριση κλειδιών, ελέγξτε κάθε κλειδί (και ότι κάθε αντίγραφο ανοίγει ακόμη), αποθηκεύστε το πρόχειρο και υπογράψτε το με το αρχείο κλειδιού root σας. Η εκ νέου υπογραφή χωρίς αλλαγές επιβεβαιώνει την αναθεώρηση."
COM_TUF_ED_MAIL_KMS_KEYS_CHANGED="Τα ενεργά κλειδιά σας άλλαξαν από την τελευταία υπογεγραμμένη έκδοση της δήλωσης."
COM_TUF_ED_MAIL_KMS_OVERDUE="Η αναθεώρηση της δήλωσης διαχείρισης κλειδιών σας (έκδοση %1$d) έπρεπε να γίνει έως τις %2$s."
COM_TUF_ED_MAIL_KMS_SUBJECT="[%s] TUF_ED: αναθεωρήστε τη δήλωση διαχείρισης κλειδιών σας"
COM_TUF_ED_MAIL_OWN_FILES_BODY="Τα δικά αρχεία του TUF_ED σε αυτή την εγκατάσταση δεν ταιριάζουν με τη λίστα αρχείων της εγκατεστημένης έκδοσης, ή η λίστα δεν ταιριάζει με το κλείδωμά της:\n\n%s\n\nΤο TUF_ED αρνείται κάθε χειρισμό κλειδιών και τη δημοσίευση μέχρι να διορθωθεί αυτό· σταματά επίσης η ωριαία ανανέωση. Αν δεν αλλάξατε εσείς τα αρχεία του TUF_ED, θεωρήστε ότι η εγκατάσταση έχει παραβιαστεί και μην υπογράφετε τίποτα σε αυτήν. Λεπτομέρειες στο Εφαρμογές → TUF Extension Developer → Ρύθμιση → Επεκτάσεις."
COM_TUF_ED_MAIL_OWN_FILES_SUBJECT="[%s] TUF_ED: τα δικά του αρχεία δεν περνούν τον έλεγχο"
COM_TUF_ED_MAIL_RENEWAL_BODY="Η ωριαία ανανέωση των snapshot και timestamp απέτυχε:\n\n%s\n\nΤο δημοσιευμένο timestamp.json λήγει στις %s. Μετά από αυτό, οι ιστότοποι σταματούν να εγκαθιστούν τις ενημερώσεις σας μέχρι να λειτουργήσει ξανά η ανανέωση. Ανοίξτε Εφαρμογές → TUF Extension Developer → Δημοσίευση για έλεγχο."
COM_TUF_ED_MAIL_RENEWAL_SUBJECT="[%s] TUF_ED: η ανανέωση snapshot/timestamp ΑΠΕΤΥΧΕ"
COM_TUF_ED_MAIL_ROLES_BODY="Ο διαχωρισμός ρόλων αυτής της εγκατάστασης TUF_ED δεν είναι πλήρης:\n\n%s\n\nΚάθε ρόλος χρειάζεται τουλάχιστον έναν δικό του λογαριασμό που είναι ενεργός, έχει ρυθμισμένο MFA και δεν είναι Υπερχρήστης. Ένας λογαριασμός μπορεί να έχει μόνο έναν ρόλο. Ελέγξτε τους λογαριασμούς στο Χρήστες → Διαχείριση και την επισκόπηση στον πίνακα ελέγχου του TUF_ED."
COM_TUF_ED_MAIL_ROLES_SUBJECT="[%s] TUF_ED: οι λογαριασμοί ρόλων χρειάζονται προσοχή"
COM_TUF_ED_MAIL_ROOT_EXPIRED_BODY="Τα μεταδεδομένα root σας (root.json έκδοση %d) έληξαν στις %s.\n\nΟι ιστότοποι δεν εγκαθιστούν πλέον ενημερώσεις των επεκτάσεών σας μέχρι να υπογράψετε νέα έκδοση root: Εφαρμογές → TUF Extension Developer → Μεταδεδομένα root → Υπογραφή."
COM_TUF_ED_MAIL_ROOT_EXPIRED_SUBJECT="[%s] TUF_ED: τα μεταδεδομένα root έχουν ΛΗΞΕΙ"
COM_TUF_ED_MAIL_ROOT_EXPIRY_BODY="Τα μεταδεδομένα root σας (root.json έκδοση %d) λήγουν στις %s, σε %d ημέρες.\n\nΜετά από αυτή την ημερομηνία, οι ιστότοποι σταματούν να εγκαθιστούν ενημερώσεις των επεκτάσεών σας.\n\nΓια ανανέωση: στη διαχείριση, ανοίξτε Εφαρμογές → TUF Extension Developer → Μεταδεδομένα root → Υπογραφή, μεταφορτώστε το αρχείο κλειδιού root σας και εισαγάγετε τη φράση πρόσβασής του. Δεν απαιτείται εναλλαγή κλειδιού."
COM_TUF_ED_MAIL_ROOT_EXPIRY_SUBJECT="[%s] TUF_ED: τα μεταδεδομένα root λήγουν σε %d ημέρες"
COM_TUF_ED_MAIL_TARGETS_EXPIRED_BODY="Τα μεταδεδομένα πακέτων σας (targets.json έκδοση %d) έληξαν στις %s.\n\nΟι ιστότοποι δεν εγκαθιστούν πλέον ενημερώσεις των επεκτάσεών σας μέχρι να υπογράψετε νέα έκδοση targets: Εφαρμογές → TUF Extension Developer → Πακέτα → Υπογραφή targets.json."
COM_TUF_ED_MAIL_TARGETS_EXPIRED_SUBJECT="[%s] TUF_ED: τα μεταδεδομένα πακέτων έχουν ΛΗΞΕΙ"
COM_TUF_ED_MAIL_TARGETS_EXPIRY_BODY="Τα μεταδεδομένα πακέτων σας (targets.json έκδοση %d) λήγουν στις %s, σε %d ημέρες.\n\nΜετά από αυτή την ημερομηνία, οι ιστότοποι σταματούν να εγκαθιστούν ενημερώσεις των επεκτάσεών σας.\n\nΓια ανανέωση: στη διαχείριση, ανοίξτε Εφαρμογές → TUF Extension Developer → Πακέτα → Υπογραφή targets.json, μεταφορτώστε το αρχείο κλειδιού targets σας και εισαγάγετε τη φράση πρόσβασής του."
COM_TUF_ED_MAIL_TARGETS_EXPIRY_SUBJECT="[%s] TUF_ED: τα μεταδεδομένα πακέτων λήγουν σε %d ημέρες"
COM_TUF_ED_NOT_CLEAN="<strong>Αυτή η εγκατάσταση Joomla δεν είναι καθαρή.</strong> Είναι εγκατεστημένες %d επεκτάσεις που δεν ανήκουν ούτε στον πυρήνα του Joomla ούτε στο TUF ούτε επιτρέπονται ρητά: %s. Καθεμία εκτελείται στην ίδια διεργασία PHP με τον κώδικα υπογραφής και θα μπορούσε να διαβάσει αρχεία κλειδιών και φράσεις πρόσβασης. Αφαιρέστε τις, χρησιμοποιήστε ξεχωριστή εγκατάσταση Joomla για το TUF_ED ή <a href=\"%s\">επιτρέψτε τις ρητά</a> αν έχουν βάσιμο λόγο να βρίσκονται εδώ."
