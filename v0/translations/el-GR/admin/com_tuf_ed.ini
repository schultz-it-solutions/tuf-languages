COM_TUF_ED_KEYS_ONLINE_INTRO="Τα κλειδιά snapshot και timestamp φυλάσσονται σε αυτόν τον διακομιστή, ώστε η ωριαία εργασία να μπορεί να ανανεώνει τα βραχύβια μεταδεδομένα τους. Ένα κλεμμένο online κλειδί μπορεί να καθυστερήσει τις ενημερώσεις σας, αλλά δεν μπορεί να δημοσιεύσει πακέτο: τα πακέτα υπογράφονται με το offline κλειδί targets σας. Το ιδιωτικό κλειδί είναι σφραγισμένο με το αρχείο μυστικού στον ιδιωτικό φάκελο· δεν υπάρχει τίποτα για λήψη. Μετά τη δημιουργία, υπογράψτε νέα έκδοση root ώστε το κλειδί να αναφέρεται στο root.json."
