COM_TUF_ED_CONFIGURATION="TUF Extension Developer: Επιλογές"
COM_TUF_ED_CONFIG_MAIN_WEBSITE_DESC="Ο δημόσιος ιστότοπός σας (https://…). Χρησιμοποιείται στο προτεινόμενο κείμενο της σελίδας εκτός λειτουργίας αυτού του ιστότοπου."
COM_TUF_ED_CONFIG_MAIN_WEBSITE_LABEL="Κύριος ιστότοπος"
COM_TUF_ED_CONFIG_PRIVATE_PATH_DESC="Εκτός του ριζικού καταλόγου web, π.χ. /home/user/tuf_ed_private. Περιέχει το μυστικό που σφραγίζει τα online κλειδιά snapshot και timestamp, καθώς και τα μεταφορτωμένα πακέτα. Συμπεριλάβετέ τον στα αντίγραφα ασφαλείας σας, αλλά φυλάξτε αυτά τα αντίγραφα χωριστά από τα αντίγραφα της βάσης δεδομένων: το μυστικό και η βάση δεδομένων μαζί ανοίγουν τα online κλειδιά."
COM_TUF_ED_CONFIG_PRIVATE_PATH_LABEL="Ιδιωτικός φάκελος"
COM_TUF_ED_CONFIG_PUBLISH_METHOD_DESC="Πού εγγράφεται το δημόσιο αποθετήριο TUF: σε φάκελο αυτού του διακομιστή ή σε φάκελο άλλου διακομιστή μέσω SFTP (π.χ. του διακομιστή του κύριου ιστότοπού σας)."
COM_TUF_ED_CONFIG_PUBLISH_METHOD_LABEL="Μέθοδος δημοσίευσης"
COM_TUF_ED_CONFIG_PUBLISH_METHOD_LOCAL="Φάκελος σε αυτόν τον διακομιστή"
COM_TUF_ED_CONFIG_PUBLISH_METHOD_SFTP="SFTP σε άλλον διακομιστή"
COM_TUF_ED_CONFIG_PUBLISH_PACKAGES_DESC="Αντιγραφή και των υπογεγραμμένων πακέτων στον φάκελο δημοσίευσης, ως targets/&lt;sha256&gt;.&lt;name&gt;. Αφήστε το απενεργοποιημένο αν διανέμετε τα πακέτα από τον υπάρχοντα διακομιστή ενημερώσεών σας."
COM_TUF_ED_CONFIG_PUBLISH_PACKAGES_LABEL="Δημοσίευση πακέτων"
COM_TUF_ED_CONFIG_PUBLISH_PATH_DESC="Πού εγγράφεται το δημόσιο αποθετήριο TUF ως στατικά αρχεία: σε φάκελο του κύριου ιστότοπού σας ή σε νέο φάκελο κάτω από τον ριζικό κατάλογο web αυτού του ιστότοπου (όχι φάκελο του Joomla). Ο διακομιστής web διανέμει αυτά τα αρχεία απευθείας, ακόμη και όταν αυτός ο ιστότοπος είναι εκτός λειτουργίας."
COM_TUF_ED_CONFIG_PUBLISH_PATH_LABEL="Φάκελος δημοσίευσης"
COM_TUF_ED_CONFIG_PUBLISH_URL_DESC="Διεύθυνση https://… στην οποία είναι προσβάσιμος ο φάκελος δημοσίευσης. Οι πελάτες ενημερώσεων λαμβάνουν από εκεί το timestamp.json, τα μεταδεδομένα με έκδοση και, αν δημοσιεύονται, τα πακέτα."
COM_TUF_ED_CONFIG_PUBLISH_URL_LABEL="Δημόσιο URL του φακέλου δημοσίευσης"
COM_TUF_ED_CONFIG_REQUEST_LIFETIME_DESC="Για πόσο διάστημα μπορεί να υπογραφεί ένα προετοιμασμένο αίτημα υπογραφής (1–30). Γίνεται επίσης άχρηστο μόλις αλλάξει αυτό στο οποίο βασίζεται."
COM_TUF_ED_CONFIG_REQUEST_LIFETIME_LABEL="Διάρκεια ισχύος αιτήματος υπογραφής (ημέρες)"
COM_TUF_ED_CONFIG_ROOT_EXPIRY_DESC="Προεπιλεγμένη διάρκεια ισχύος μιας νέας έκδοσης του root.json. Οι πελάτες απορρίπτουν ένα ληγμένο root, επομένως υπογράψτε νέα έκδοση αρκετά πριν από αυτή την ημερομηνία."
COM_TUF_ED_CONFIG_ROOT_EXPIRY_LABEL="Λήξη root (ημέρες)"
COM_TUF_ED_CONFIG_ROOT_LABEL="Μεταδεδομένα root"
COM_TUF_ED_CONFIG_SFTP_AUTH_DESC="Συνιστάται κλειδί. Χρησιμοποιήστε λογαριασμό SFTP που έχει πρόσβαση μόνο στον φάκελο του αποθετηρίου (chroot): κάθε δημοσιευμένο αρχείο είναι υπογεγραμμένο, οπότε αυτός ο λογαριασμός μπορεί στη χειρότερη περίπτωση να μπλοκάρει ενημερώσεις, αλλά δεν πρέπει να έχει πρόσβαση σε τίποτε άλλο."
COM_TUF_ED_CONFIG_SFTP_AUTH_KEY="Αρχείο ιδιωτικού κλειδιού"
COM_TUF_ED_CONFIG_SFTP_AUTH_LABEL="Σύνδεση με"
COM_TUF_ED_CONFIG_SFTP_AUTH_PASSWORD="Κωδικός πρόσβασης"
COM_TUF_ED_CONFIG_SFTP_HOST_DESC="Όνομα κεντρικού υπολογιστή ή διεύθυνση IP του διακομιστή που διανέμει το αποθετήριο, π.χ. ssh.example.com."
COM_TUF_ED_CONFIG_SFTP_HOST_KEY_DESC="Αποτύπωμα SHA256 του κλειδιού κεντρικού υπολογιστή του διακομιστή, όπως το εμφανίζει το ssh-keygen -lf (SHA256:…). Τίποτα δεν αποστέλλεται σε διακομιστή με διαφορετικό κλειδί. Αφήστε το αρχικά κενό: Δημοσίευση → Εμφάνιση κλειδιού κεντρικού υπολογιστή δείχνει τι παρουσιάζει ο διακομιστής· συγκρίνετέ το με το αποτύπωμα που δηλώνει ο πάροχος φιλοξενίας σας πριν το καταχωρίσετε."
COM_TUF_ED_CONFIG_SFTP_HOST_KEY_LABEL="Αποτύπωμα κλειδιού κεντρικού υπολογιστή"
COM_TUF_ED_CONFIG_SFTP_HOST_LABEL="Κεντρικός υπολογιστής SFTP"
COM_TUF_ED_CONFIG_SFTP_KEY_FILE_DESC="Ιδιωτικό κλειδί OpenSSH χωρίς φράση πρόσβασης (απαιτείται για την ωριαία ανανέωση), π.χ. δημιουργημένο με ssh-keygen -t ed25519 -N '' -f sftp_ed25519. Ένα σκέτο όνομα αρχείου αναζητείται στον ιδιωτικό φάκελο· μια απόλυτη διαδρομή πρέπει να βρίσκεται εκτός του ριζικού καταλόγου web. Δικαιώματα 0600."
COM_TUF_ED_CONFIG_SFTP_KEY_FILE_LABEL="Αρχείο ιδιωτικού κλειδιού"
COM_TUF_ED_CONFIG_SFTP_PASSWORD_DESC="Ο κωδικός πρόσβασης δεν αποθηκεύεται στις επιλογές (βάση δεδομένων). Ορίστε τον στη σελίδα Δημοσίευση: το TUF_ED τον φυλάσσει στον ιδιωτικό φάκελο. Ένα αρχείο κλειδιού παραμένει η καλύτερη επιλογή."
COM_TUF_ED_CONFIG_SFTP_PASSWORD_LABEL="Κωδικός πρόσβασης SFTP"
COM_TUF_ED_CONFIG_SFTP_PATH_DESC="Φάκελος στον διακομιστή SFTP που ο διακομιστής web διανέμει στο παρακάτω δημόσιο URL, π.χ. /var/www/example.com/tuf ή tuf (σχετικά με τον φάκελο σύνδεσης). Πρέπει να υπάρχει."
COM_TUF_ED_CONFIG_SFTP_PATH_LABEL="Απομακρυσμένος φάκελος"
COM_TUF_ED_CONFIG_SFTP_PORT_LABEL="Θύρα SFTP"
COM_TUF_ED_CONFIG_SFTP_USERNAME_LABEL="Όνομα χρήστη SFTP"
COM_TUF_ED_CONFIG_SIGNING_LABEL="Υπογραφή πακέτων"
COM_TUF_ED_CONFIG_SITE_LABEL="Ιστότοπος"
COM_TUF_ED_CONFIG_SNAPSHOT_EXPIRY_DESC="Διάρκεια ισχύος του snapshot.json (1–30). Ανανεώνεται αυτόματα με το online κλειδί snapshot όταν απομένει λιγότερο από το μισό."
COM_TUF_ED_CONFIG_SNAPSHOT_EXPIRY_LABEL="Λήξη snapshot (ημέρες)"
COM_TUF_ED_CONFIG_STORAGE_DESC="Απόλυτες διαδρομές σε αυτόν τον διακομιστή. Και οι δύο φάκελοι πρέπει να υπάρχουν και να είναι εγγράψιμοι από την PHP."
COM_TUF_ED_CONFIG_STORAGE_LABEL="Αποθήκευση"
COM_TUF_ED_CONFIG_TARGETS_EXPIRY_DESC="Προεπιλεγμένη διάρκεια ισχύος μιας νέας έκδοσης του targets.json (7–365). Υπογράφεται με το offline κλειδί targets σας, επομένως ανανεώνεται χειροκίνητα· λαμβάνετε υπενθυμίσεις 30 και 7 ημέρες πριν."
COM_TUF_ED_CONFIG_TARGETS_EXPIRY_LABEL="Λήξη targets (ημέρες)"
COM_TUF_ED_CONFIG_TIMESTAMP_EXPIRY_DESC="Διάρκεια ισχύος του timestamp.json (4–168). Ανανεώνεται αυτόματα από την ωριαία εργασία όταν απομένει λιγότερο από το μισό. Μικρότερη διάρκεια σημαίνει ότι οι πελάτες αντιλαμβάνονται νωρίτερα ένα παγωμένο αποθετήριο· η ωριαία εργασία πρέπει τότε να εκτελείται αξιόπιστα."
COM_TUF_ED_CONFIG_TIMESTAMP_EXPIRY_LABEL="Λήξη timestamp (ώρες)"
COM_TUF_ED_CONFIG_UNINSTALL_DESTROY_DESC="Ναι (προεπιλογή): η απεγκατάσταση του TUF_ED καταστρέφει τα σφραγισμένα online κλειδιά (snapshot, timestamp), το αρχείο μυστικού που τα σφραγίζει και τον αποθηκευμένο κωδικό πρόσβασης SFTP. Δεν μπορούν να ανακτηθούν μετά: μετά από νέα εγκατάσταση δημιουργείτε νέα online κλειδιά και υπογράφετε νέα έκδοση root. Επιλέξτε Όχι μόνο αν απεγκαθιστάτε για να εγκαταστήσετε ξανά αμέσως· τα κλειδιά παραμένουν τότε σε αυτόν τον διακομιστή μέχρι να τα διαγράψετε."
COM_TUF_ED_CONFIG_UNINSTALL_DESTROY_LABEL="Κατά την απεγκατάσταση: καταστροφή των online κλειδιών"
COM_TUF_ED_CORE_UPDATES_AUTOMATED="Αυτόματες ενημερώσεις πυρήνα"
COM_TUF_ED_CORE_UPDATES_AUTOMATED_AT_SIGNING="Αυτόματες ενημερώσεις πυρήνα κατά την υπογραφή"
COM_TUF_ED_CORE_UPDATES_HEADING="Αυτόματες ενημερώσεις Joomla"
COM_TUF_ED_CORE_UPDATES_HELP="Αφήστε ενεργοποιημένες τις αυτόματες ενημερώσεις πυρήνα: ένας διακομιστής υπογραφής με γνωστή ευπάθεια του Joomla υπονομεύει ό,τι υπογράφει. Η υπηρεσία ενημερώσεων ελέγχει αυτόν τον ιστότοπο μέσω /api/index.php/v1/joomlaupdate/healthcheck, οπότε αυτή η διαδρομή πρέπει να παραμένει προσβάσιμη ακόμη και όταν το frontend είναι εκτός λειτουργίας. Αν ενημερώνετε χειροκίνητα, καταγράψτε την αιτία και την προθεσμία σας για τις εκδόσεις ασφαλείας στη δήλωση διαχείρισης κλειδιών."
COM_TUF_ED_CORE_UPDATES_JUSTIFIED="Αιτία χειροκίνητης ενημέρωσης"
COM_TUF_ED_CORE_UPDATES_JUSTIFIED_IN="Στην έκδοση %d της δήλωσης διαχείρισης κλειδιών"
COM_TUF_ED_CORE_UPDATES_NOT_AVAILABLE="Το Joomla προσφέρει αυτόματες ενημερώσεις μόνο με κανάλι ενημερώσεων &quot;Προεπιλογή&quot; και ελάχιστη σταθερότητα &quot;Σταθερή&quot;."
COM_TUF_ED_CORE_UPDATES_OPEN_OPTIONS="Άνοιγμα των επιλογών της Ενημέρωσης Joomla"
COM_TUF_ED_CORE_UPDATES_PLUGIN="Πρόσθετο &quot;Web Services - Joomla Update&quot;"
COM_TUF_ED_CORE_UPDATES_REGISTERED="Καταχωρισμένο στην υπηρεσία ενημερώσεων"
COM_TUF_ED_CORE_UPDATES_WARN_OFF="Οι αυτόματες ενημερώσεις πυρήνα του Joomla είναι απενεργοποιημένες και η υπογεγραμμένη δήλωση διαχείρισης κλειδιών δεν αναφέρει αιτία για χειροκίνητη ενημέρωση. <a href=\"%1$s\">Ενεργοποιήστε τις</a> (Ενημέρωση Joomla → Επιλογές → Αυτόματες ενημερώσεις) ή καταγράψτε την αιτία και την προθεσμία σας για τις εκδόσεις ασφαλείας στη <a href=\"%2$s\">δήλωση διαχείρισης κλειδιών</a> και υπογράψτε τη."
COM_TUF_ED_CORE_UPDATES_WARN_PLUGIN="Το πρόσθετο &quot;Web Services - Joomla Update&quot; είναι απενεργοποιημένο. Χωρίς αυτό η υπηρεσία ενημερώσεων δεν μπορεί να φτάσει σε αυτόν τον ιστότοπο (404 στο /api/index.php/v1/joomlaupdate/healthcheck) και η καταχώριση για αυτόματες ενημερώσεις αποτυγχάνει. <a href=\"%s\">Ενεργοποιήστε το πρόσθετο</a> και στη συνέχεια ενεργοποιήστε ξανά τις αυτόματες ενημερώσεις."
COM_TUF_ED_CORE_UPDATES_WARN_UNAVAILABLE="Οι αυτόματες ενημερώσεις πυρήνα του Joomla δεν είναι δυνατές με τις τρέχουσες <a href=\"%1$s\">επιλογές της Ενημέρωσης Joomla</a>: απαιτούν κανάλι ενημερώσεων &quot;Προεπιλογή&quot; και ελάχιστη σταθερότητα &quot;Σταθερή&quot;. Αλλάξτε αυτές τις επιλογές ή καταγράψτε την αιτία της χειροκίνητης ενημέρωσης στη <a href=\"%2$s\">δήλωση διαχείρισης κλειδιών</a> και υπογράψτε τη."
COM_TUF_ED_CORE_UPDATES_WARN_UNREGISTERED="Οι αυτόματες ενημερώσεις πυρήνα του Joomla είναι ενεργοποιημένες, αλλά αυτός ο ιστότοπος δεν έχει ακόμη καταχωριστεί στην υπηρεσία ενημερώσεων. Αποθηκεύστε ξανά τις <a href=\"%s\">επιλογές της Ενημέρωσης Joomla</a>· αν η καταχώριση αποτύχει, ελέγξτε ότι το /api/index.php/v1/joomlaupdate/healthcheck είναι προσβάσιμο από το διαδίκτυο."
COM_TUF_ED_DASHBOARD_TITLE="TUF Extension Developer: Πίνακας ελέγχου"
COM_TUF_ED_EXT_ACTION="Ενέργεια"
