PKG_TUF_ED="TUF_ED - TUF για επεκτάσεις τρίτων του Joomla! (Extension Developer)"
PKG_TUF_ED_XML_DESCRIPTION="Εγκαθιστά τα lib_com_tuf, com_tuf_ed και τα πρόσθετα του TUF_ED (προγραμματισμένες εργασίες, προστασία συστήματος, γραμμή εντολών): το δικό του κλειδί root του developer επεκτάσεων και αυτο-υπογεγραμμένα μεταδεδομένα TUF. Στη συνέχεια ανοίξτε Εφαρμογές → TUF Extension Developer → Ρύθμιση."
