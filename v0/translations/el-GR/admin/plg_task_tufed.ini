PLG_TASK_TUFED="Task - TUF Extension Developer"
PLG_TASK_TUFED_ALLOWLIST_DESC="Ελέγχει τα δικά αρχεία του TUF_ED έναντι της κλειδωμένης λίστας αρχείων, υπολογίζει ξανά τα αθροίσματα ελέγχου των επιτρεπόμενων επεκτάσεων και ειδοποιεί με email τους TUF_ED Owners αν τα αρχεία του TUF_ED δεν περνούν τον έλεγχο ή αν μια επέκταση είναι νέα, μη επιτρεπόμενη ή άλλαξε."
PLG_TASK_TUFED_ALLOWLIST_TITLE="TUF_ED: έλεγχος επεκτάσεων"
PLG_TASK_TUFED_DRIFT_DESC="Ειδοποιεί με email τους TUF_ED Owners αν μια ρύθμιση του βήματος ρύθμισης επανήλθε, αν ένας ρόλος δεν έχει χρησιμοποιήσιμο λογαριασμό ή αν ένας λογαριασμός έχει περισσότερους από έναν ρόλους."
PLG_TASK_TUFED_DRIFT_TITLE="TUF_ED: έλεγχος ρύθμισης"
PLG_TASK_TUFED_EXPIRY_DESC="Ειδοποιεί με email τους TUF_ED Owners 30 και 7 ημέρες πριν λήξει το root.json ή το targets.json, και όταν κάποιο από αυτά έχει λήξει. Υπενθυμίζει επίσης την ημερομηνία αναθεώρησης της δήλωσης διαχείρισης κλειδιών και τα ενεργά κλειδιά που δεν περιγράφει."
PLG_TASK_TUFED_EXPIRY_TITLE="TUF_ED: υπενθύμιση λήξης"
PLG_TASK_TUFED_INTEGRITY_DESC="Υπολογίζει hash για κάθε αρχείο της εγκατάστασης Joomla, το συγκρίνει με την κατάσταση αναφοράς που επιβεβαίωσε ένας Owner και ειδοποιεί με email τους TUF_ED Owners για κάθε διαφορά. Το email αναφέρει επίσης τους εξαιρούμενους φακέλους. Εκτέλεση καθημερινά."
PLG_TASK_TUFED_INTEGRITY_TITLE="TUF_ED: έλεγχος εγκατάστασης"
PLG_TASK_TUFED_RENEW_DESC="Εκτέλεση κάθε ώρα. Υπογράφει νέα snapshot και timestamp με τα online κλειδιά όταν απομένει λιγότερο από το μισό της διάρκειας ισχύος τους ή μετά από αλλαγή, και δημοσιεύει το αποθετήριο. Σταματά (και ειδοποιεί με email τους TUF_ED Owners) όσο η εγκατάσταση δεν είναι καθαρή."
PLG_TASK_TUFED_RENEW_TITLE="TUF_ED: ανανέωση των snapshot και timestamp"
PLG_TASK_TUFED_XML_DESCRIPTION="Προγραμματισμένες εργασίες για το TUF_ED: υπενθυμίσεις λήξης, επιτρεπόμενες επεκτάσεις, αποκλίσεις από τη ρύθμιση, ο έλεγχος εγκατάστασης και η ωριαία ανανέωση των snapshot και timestamp. Τα email πηγαίνουν σε όλους τους χρήστες της TUF_ED Owner."
