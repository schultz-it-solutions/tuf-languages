PLG_SYSTEM_TUFED="System - TUF Extension Developer"
PLG_SYSTEM_TUFED_MAIL_EXT_INSTALLED="Εγκαταστάθηκε μια επέκταση που δεν ανήκει στο Joomla ή στο TUF.\n\nΕπέκταση: %1$s\nΈκδοση: %2$s\nΕγκαταστάθηκε από: %3$s\n\nΕκτελείται στην ίδια διεργασία PHP με τον κώδικα υπογραφής. Τα online κλειδιά δεν χρησιμοποιούνται μέχρι να αφαιρεθεί ή να επιτραπεί ρητά (Ρύθμιση → Επεκτάσεις)."
PLG_SYSTEM_TUFED_MAIL_EXT_SUBJECT="[%s] TUF_ED: εγκαταστάθηκε ή ενημερώθηκε επέκταση"
PLG_SYSTEM_TUFED_MAIL_EXT_UPDATED="Ενημερώθηκε μια επέκταση που δεν ανήκει στο Joomla ή στο TUF.\n\nΕπέκταση: %1$s\nΈκδοση: %2$s\nΕνημερώθηκε από: %3$s\n\nΜια άδεια λήγει με κάθε αλλαγή της επέκτασης: τα online κλειδιά δεν χρησιμοποιούνται μέχρι να επιτρέψετε ξανά τη νέα έκδοση (Ρύθμιση → Επεκτάσεις)."
PLG_SYSTEM_TUFED_MAIL_FOOTER="Αυτό το μήνυμα στάλθηκε αμέσως από το πρόσθετο συστήματος του TUF_ED (plg_system_tufed) σε όλους τους χρήστες της ομάδας TUF_ED Owner."
PLG_SYSTEM_TUFED_MAIL_ROLES_CHANGED="Οι ρόλοι TUF_ED ενός λογαριασμού άλλαξαν.\n\nΛογαριασμός: %1$s\nΠριν: %2$s\nΤώρα: %3$s\nΆλλαξε από: %4$s\n\nΑν δεν περιμένατε αυτή την αλλαγή, ελέγξτε αμέσως τον λογαριασμό στο Χρήστες → Διαχείριση: οι TUF_ED Owners και οι TUF_EDC Signers μπορούν να υπογράφουν πακέτα."
PLG_SYSTEM_TUFED_MAIL_ROLES_DELETED="Διαγράφηκε ένας λογαριασμός με ρόλο TUF_ED.\n\nΛογαριασμός: %1$s\nΡόλοι: %2$s\nΔιαγράφηκε από: %4$s\n\nΕλέγξτε στον πίνακα ελέγχου του TUF_ED ότι κάθε ρόλος έχει ακόμη χρησιμοποιήσιμο λογαριασμό."
PLG_SYSTEM_TUFED_MAIL_ROLES_SUBJECT="[%s] TUF_ED: η συμμετοχή σε ρόλους άλλαξε"
PLG_SYSTEM_TUFED_ROLE_CONFLICT="Διαχωρισμός ρόλων TUF_ED: ο λογαριασμός &quot;%1$s&quot; θα είχε %2$s. Ένας λογαριασμός μπορεί να έχει μόνο έναν ρόλο TUF_ED, και ένας Υπερχρήστης κανέναν. Χρησιμοποιήστε ξεχωριστό λογαριασμό (με δική του διεύθυνση email ή alias) για κάθε ρόλο."
PLG_SYSTEM_TUFED_WARN_INTEGRITY="<strong>TUF_ED: η εγκατάσταση δεν ταιριάζει με την επιβεβαιωμένη κατάσταση αναφοράς της</strong> (%1$s). Το TUF_ED αρνείται κάθε χειρισμό κλειδιών μέχρι ένας Owner να εξετάσει και να επιβεβαιώσει τις αλλαγές. <a href=\"%2$s\">Εξέταση των αλλαγών</a>."
PLG_SYSTEM_TUFED_WARN_NOT_CLEAN="<strong>TUF_ED: αυτή η εγκατάσταση Joomla δεν είναι καθαρή.</strong> %1$d επεκτάσεις δεν επιτρέπονται ή άλλαξαν μετά την άδειά τους: %2$s. Κάθε επέκταση εκτελείται στην ίδια διεργασία PHP με τον κώδικα υπογραφής. <a href=\"%3$s\">Έλεγχος των επεκτάσεων</a>."
PLG_SYSTEM_TUFED_WARN_OWN_FILES="<strong>TUF_ED: τα δικά του αρχεία δεν περνούν τον έλεγχο</strong> (%1$s). Το TUF_ED αρνείται κάθε χειρισμό κλειδιών και τη δημοσίευση μέχρι να διορθωθεί αυτό. <a href=\"%2$s\">Εμφάνιση λεπτομερειών</a>."
PLG_SYSTEM_TUFED_WARN_ROLES="<strong>TUF_ED:</strong> ο διαχωρισμός ρόλων δεν είναι πλήρης (ένας ρόλος δεν έχει χρησιμοποιήσιμο λογαριασμό ή ένας λογαριασμός έχει περισσότερους από έναν ρόλους). <a href=\"%s\">Δείτε τον πίνακα ελέγχου</a>."
PLG_SYSTEM_TUFED_XML_DESCRIPTION="Προστατεύει την εγκατάσταση TUF_ED: αρνείται να αποθηκεύσει λογαριασμό με περισσότερους από έναν ρόλους TUF_ED ή με ρόλο και ιδιότητα Υπερχρήστη, ειδοποιεί αμέσως με email τους TUF_ED Owners όταν ένας λογαριασμός αποκτά ή χάνει ρόλο ή όταν εγκαθίσταται ή ενημερώνεται μια επέκταση, και εμφανίζει τις προειδοποιήσεις του TUF_ED σε κάθε σελίδα της διαχείρισης. Αφήστε το ενεργοποιημένο."
