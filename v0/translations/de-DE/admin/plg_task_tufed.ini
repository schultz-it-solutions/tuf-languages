PLG_TASK_TUFED="Aufgabe - TUF Extension Developer"
PLG_TASK_TUFED_ALLOWLIST_DESC="Prüft die eigenen Dateien von TUF_ED anhand der festgeschriebenen Dateiliste, berechnet die Prüfsummen der zugelassenen Erweiterungen neu und benachrichtigt die TUF_ED Owners per E-Mail, wenn die Dateien von TUF_ED die Prüfung nicht bestehen oder eine Erweiterung neu, nicht zugelassen oder geändert ist."
PLG_TASK_TUFED_ALLOWLIST_TITLE="TUF_ED: Erweiterungsprüfung"
PLG_TASK_TUFED_DRIFT_DESC="Benachrichtigt die TUF_ED Owners per E-Mail, wenn eine Einstellung des Einrichtungsschritts zurückgeändert wurde, wenn eine Rolle kein nutzbares Konto hat oder wenn ein Konto mehr als eine Rolle hat."
PLG_TASK_TUFED_DRIFT_TITLE="TUF_ED: Einrichtungsprüfung"
PLG_TASK_TUFED_EXPIRY_DESC="Benachrichtigt die TUF_ED Owners per E-Mail 30 und 7 Tage bevor root.json oder targets.json abläuft und wenn eine davon abgelaufen ist. Erinnert außerdem an das Prüfdatum der Schlüsselverwaltungserklärung und an aktive Schlüssel, die sie nicht beschreibt."
PLG_TASK_TUFED_EXPIRY_TITLE="TUF_ED: Ablauf-Erinnerung"
PLG_TASK_TUFED_INTEGRITY_DESC="Hasht jede Datei der Joomla-Instanz, vergleicht sie mit dem Referenzstand, den ein Owner bestätigt hat, und benachrichtigt die TUF_ED Owners bei jeder Abweichung per E-Mail. Die E-Mail listet auch die ausgeschlossenen Ordner auf. Täglich ausführen."
PLG_TASK_TUFED_INTEGRITY_TITLE="TUF_ED: Instanzprüfung"
PLG_TASK_TUFED_RENEW_DESC="Stündlich ausführen. Signiert mit den Online-Schlüsseln einen neuen snapshot und timestamp, wenn weniger als die Hälfte ihrer Gültigkeit übrig ist oder nach einer Änderung, und veröffentlicht das Repository. Hält an (und benachrichtigt die TUF_ED Owners per E-Mail), solange die Instanz nicht sauber ist."
PLG_TASK_TUFED_RENEW_TITLE="TUF_ED: Erneuerung von snapshot und timestamp"
PLG_TASK_TUFED_XML_DESCRIPTION="Geplante Aufgaben für TUF_ED: Ablauf-Erinnerungen, zugelassene Erweiterungen, Abweichungen von der Einrichtung, die Instanzprüfung und die stündliche Erneuerung von snapshot und timestamp. E-Mails gehen an alle Benutzer in TUF_ED Owner."
