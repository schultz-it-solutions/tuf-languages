COM_TUF_ED_KEYS_CONFIRM_INTRO="Laden Sie die eben heruntergeladene Schlüsseldatei mit ihrer Passphrase hoch. Das zeigt, dass Sie die Datei besitzen und dass die Passphrase sie öffnet. Erst dann wird der Schlüssel verwendet. Die Datei wird geprüft und nicht aufbewahrt."
COM_TUF_ED_KEYS_CONFIRM_NONE="Dieser Schlüssel wartet nicht auf Bestätigung: Er ist bereits bestätigt, wurde verworfen oder nach 24 Stunden gelöscht. Wenn Sie seine Schlüsseldatei nicht haben, erzeugen Sie einen neuen Schlüssel."
