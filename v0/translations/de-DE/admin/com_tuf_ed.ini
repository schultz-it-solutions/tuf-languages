COM_TUF_ED_KEYS_EMERGENCY_NEXT_HOST="Wurde der Schlüssel von diesem Webhost gestohlen, finden Sie heraus wie, bevor Sie hier neue Schlüssel erzeugen. Vernichten Sie alle Online-Schlüssel: Dann wird auch die Geheimnisdatei gelöscht, und die neuen Schlüssel werden mit einem neuen Geheimnis versiegelt."
COM_TUF_ED_KEYS_EMERGENCY_NEXT_ROOT="Signieren Sie eine neue root-Version. Sie führt die neuen Schlüssel auf und die vernichteten nicht mehr."
