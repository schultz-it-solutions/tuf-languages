COM_TUF_ED_KMS_INTRO="Beschreiben Sie, wie Sie jeden Ihrer Schlüssel aufbewahren und handhaben. Speichern Sie den Entwurf so oft Sie möchten; er darf unvollständig bleiben. Wenn er vollständig ist, signieren Sie ihn mit Ihrem root-Schlüssel: Die signierte Version ist Ihr dokumentierter Prozess und später das, was ein TUF Intermediary prüft, bevor er Ihren root-Schlüssel bestätigt. <strong>Die Erklärung sagt, wo sich Ihre Schlüssel befinden, daher ist sie vertraulich:</strong> Nur Benutzer, die root-Metadaten signieren dürfen, können sie sehen. Beschreiben Sie Orte und Abläufe, niemals Passwörter, Passphrasen, PINs oder Safe-Kombinationen."
