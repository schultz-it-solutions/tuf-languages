COM_TUF_ED_ANCHOR_ERR_MISSING="Im privaten Ordner gibt es keinen Vertrauensanker."
COM_TUF_ED_ANCHOR_ERR_NOT_UPDATED="Root-Version %1$d ist gespeichert, aber der Vertrauensanker konnte nicht aktualisiert werden (%2$s). Schreiben Sie ihn auf der Seite Root-Metadaten."
COM_TUF_ED_ANCHOR_ERR_WRITE="Der Vertrauensanker %s kann nicht geschrieben werden."
COM_TUF_ED_ANCHOR_EXPLAIN="Der Vertrauensanker im privaten Ordner verzeichnet die erste und die neueste root, die Sie signiert haben. Stimmt die Datenbank nicht mehr damit überein, hat dort möglicherweise jemand die roots ersetzt. Vergleichen Sie die Dateien unten mit den veröffentlichten (root.json und die versionierten roots) und mit den root-Versionen, die Sie anderswo aufbewahren, zum Beispiel im Vertrauensstatus von tuf-ed-signer. Schreiben Sie einen neuen Anker nur, wenn es Ihre sind."
