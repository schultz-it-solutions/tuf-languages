COM_TUF_ED_SETUP_GC_FORCE_SSL="HTTPS erzwingen sollte auf „Gesamte Website“ stehen. Setzen Sie es erst, wenn HTTPS funktioniert, sonst sperren Sie sich aus."
COM_TUF_ED_SETUP_GC_LIFETIME="Die Sitzungsdauer sollte 15 Minuten oder weniger betragen."
