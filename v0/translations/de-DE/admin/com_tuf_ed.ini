COM_TUF_ED_INTEGRITY_NOTICE="<strong>Die Instanz stimmt nicht mit ihrem bestätigten Referenzstand überein</strong> (%1$s). TUF_ED verweigert den Umgang mit Schlüsseln, bis ein Owner die Änderungen geprüft und bestätigt hat. <a href=\"%2$s\">Änderungen prüfen</a>."
