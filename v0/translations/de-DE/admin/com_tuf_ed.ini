COM_TUF_ED_INTEGRITY_ERR_NOT_CLEAN="Die Instanz stimmt nicht mit ihrem bestätigten Referenzstand überein (%s). Prüfen und bestätigen Sie die Änderungen auf der Seite Integrität (dabei werden 10.000 oder mehr Dateien geprüft, was einige Minuten dauern kann – bitte haben Sie Geduld)."
COM_TUF_ED_INTEGRITY_ERR_NOT_PINNED="Die Referenzstand-Datei im privaten Ordner wurde nicht hier bestätigt."
