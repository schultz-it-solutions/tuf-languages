COM_TUF_ED_SETUP_GC_OFFLINE_IMAGE="Das Offline-Bild sollte leer sein."
COM_TUF_ED_SETUP_GC_OFFLINE_MESSAGE="Die Offline-Nachricht sollte auf „Eigenen Text verwenden“ stehen, mit einem neutralen Text, der nicht verrät, wozu diese Website dient. Vorschlag: „%s“"
COM_TUF_ED_SETUP_GC_OPEN="Konfiguration öffnen"
COM_TUF_ED_SETUP_GC_ROBOTS="Robots (Metadaten) sollte auf „noindex, nofollow“ stehen, damit Suchmaschinen diese Website nicht aufführen."
COM_TUF_ED_SETUP_GROUPS_FIRST="Braucht die TUF_ED-Gruppen: wird im selben Durchlauf nach „TUF_ED-Benutzergruppen“ angewendet."
COM_TUF_ED_SETUP_INCOMPLETE="Der Einrichtungsschritt ist nicht abgeschlossen: Diese Joomla-Instanz ist noch nicht an TUF_ED angepasst. <a href=\"%s\">Einrichtung öffnen</a>."
COM_TUF_ED_SETUP_INTEGRITY_OPEN="Seite Integrität öffnen"
COM_TUF_ED_SETUP_INTRO="Diese Prüfungen passen diese Joomla-Instanz an ihren einzigen Zweck als TUF_ED an. Sie ändern die gesamte Website, nicht nur diese Komponente. Es wird nichts geändert, bis Sie Prüfungen auswählen, bestätigen und anwenden. Jede angewendete Prüfung wird im Benutzeraktionen-Log festgehalten."
