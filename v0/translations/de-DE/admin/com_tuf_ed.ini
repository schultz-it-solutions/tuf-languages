COM_TUF_ED_ROOT_ERR_MISSING_KEYS="Jede Rolle braucht einen eigenen Schlüssel, bevor die nächste root-Version vorbereitet werden kann. Es fehlt: %s. Legen Sie die Schlüssel in dieser Reihenfolge an: root, targets, snapshot, timestamp."
