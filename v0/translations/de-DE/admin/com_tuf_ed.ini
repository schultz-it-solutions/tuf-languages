COM_TUF_ED_KEYS_EMERGENCY_CONFIRM="Mir ist bewusst, dass die ausgewählten Schlüssel jetzt vernichtet werden und nicht wiederhergestellt werden können."
COM_TUF_ED_KEYS_EMERGENCY_ERR_CONFIRM="Bitte bestätigen Sie, dass die Schlüssel jetzt vernichtet werden."
COM_TUF_ED_KEYS_EMERGENCY_ERR_NONE="Wählen Sie mindestens einen Online-Schlüssel aus, von dem noch eine versiegelte Kopie auf diesem Server liegt."
COM_TUF_ED_KEYS_EMERGENCY_INTRO="Verwenden Sie dies, wenn ein Online-Schlüssel gestohlen worden sein könnte. Die ausgewählten Schlüssel werden außer Dienst gestellt, und ihre versiegelten Kopien auf diesem Server werden sofort vernichtet. Es gibt keine 30-tägige Übergangszeit: Ab sofort signieren sie nichts mehr. Clients vertrauen einem Schlüssel weiterhin, bis Sie eine neue root-Version ohne ihn veröffentlichen, signieren Sie also bald eine. Der Update-Client von Joomla (ab 5.1) benötigt die Übergangszeit nicht."
