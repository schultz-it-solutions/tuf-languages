COM_TUF_ED_KEYSETUP_TRADEOFF="Empfohlen: Bewahren Sie den root-Schlüssel offline auf Ihrem eigenen Computer auf und signieren Sie mit tuf-ed-signer, und signieren Sie Releases mit dem targets-Schlüssel in der Komponente. Kontrolliert jemand Ihren Webhost, während Sie signieren, erhält er höchstens den targets-Schlüssel, den Ihr Offline-root-Schlüssel ersetzen kann; ein in der Komponente verwendeter root-Schlüssel könnte Sie das ganze Repository kosten."
