COM_TUF_ED_KEYS_EMERGENCY_SECRET_DELETED="Es ist kein versiegelter Schlüssel mehr übrig, daher wurde auch %s gelöscht. Der nächste Online-Schlüssel erhält ein neues Geheimnis."
