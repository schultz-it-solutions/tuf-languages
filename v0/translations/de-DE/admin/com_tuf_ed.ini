COM_TUF_ED_EXT_EXTENSION="Erweiterung"
COM_TUF_ED_EXT_INTRO="Erweiterungen, die weder zum Joomla-Core noch zu TUF gehören. Sehr wenige haben möglicherweise einen triftigen Grund, hier zu sein, z. B. ein Backup-Werkzeug. Eine Freigabe bindet die Erweiterung an ihre aktuelle Version und an eine Prüfsumme über ihre Dateien: Nach jedem Update oder jeder Dateiänderung gilt sie wieder als nicht zugelassen, bis Sie sie erneut bestätigen."
COM_TUF_ED_EXT_NONE="Außer Joomla-Core und TUF sind keine Erweiterungen installiert."
COM_TUF_ED_EXT_NOTE_REMOTE="Fernverwaltungs-Connector für %s: Dieser Dienst kann von außen Erweiterungen auf dieser Website installieren und aktualisieren und umgeht damit die Regel der sauberen Instanz. Lassen Sie ihn nur zu, wenn Sie dem Dienst vertrauen und sein Konto mit MFA schützen."
COM_TUF_ED_EXT_OTHERS_HEADING="Andere Erweiterungen"
COM_TUF_ED_EXT_REASON="Begründung (erforderlich)"
COM_TUF_ED_EXT_REASON_MISSING="Bitte geben Sie an, warum diese Erweiterung auf dieser Website sein muss."
COM_TUF_ED_EXT_RECONFIRM="Erneut bestätigen"
COM_TUF_ED_EXT_REMOTE_NOTE="Fernverwaltungs-Connectoren (Website-Überwachung oder Update-Dienste) können Erweiterungen von außen installieren und aktualisieren. Wer einen zulässt, vertraut diesem Dienst diese Instanz an, einschließlich dessen, was neben dem Signiercode läuft. Backup-Archive enthalten die Datenbank und die Konfiguration: Schützen Sie den Backup-Speicher entsprechend."
COM_TUF_ED_EXT_REVOKE="Widerrufen"
COM_TUF_ED_EXT_REVOKED="Die Freigabe für %s wurde widerrufen."
COM_TUF_ED_EXT_RISK="Risiko"
COM_TUF_ED_EXT_RISK_HIGH="hoch"
COM_TUF_ED_EXT_RISK_HIGH_DESC="Läuft bei jeder Anfrage, auch bei Signieranfragen, oder wird von anderem Code geladen."
