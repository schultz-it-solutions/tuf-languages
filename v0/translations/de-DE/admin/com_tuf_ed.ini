COM_TUF_ED_KEYSETUP_THREAT="Im Modus „in der Komponente“ kann jeder, der Ihren Webhost kontrolliert, während Sie signieren, oder der dort vorher Code eingeschleust hat, den Schlüssel abgreifen, den Sie in dieser Sitzung verwenden. Wenn root offline bleibt, ist das höchstens Ihr targets-Schlüssel: Ein Angreifer könnte gefälschte Releases signieren, bis Sie den targets-Schlüssel mit Ihrem Offline-root-Schlüssel rotieren, aber Ihr Repository nicht übernehmen."
