COM_TUF_ED_KEYS_ONLINE_INTRO="Schlüssel für snapshot und timestamp werden auf diesem Server aufbewahrt, damit die stündliche Aufgabe ihre kurzlebigen Metadaten erneuern kann. Ein gestohlener Online-Schlüssel kann Ihre Updates verzögern, aber kein Paket veröffentlichen: Pakete werden mit Ihrem Offline-targets-Schlüssel signiert. Der private Schlüssel ist mit der Geheimnisdatei im privaten Ordner versiegelt; es gibt nichts herunterzuladen. Signieren Sie nach dem Erzeugen eine neue root-Version, damit der Schlüssel in root.json aufgeführt wird."
