COM_TUF_ED_INTEGRITY_CONFIRM_BUTTON="Als neuen Referenzstand bestätigen"
COM_TUF_ED_INTEGRITY_CONFIRM_FIRST="Es gibt noch keinen Referenzstand. Bestätigen Sie den aktuellen Zustand nur, wenn diese Instanz sauber ist: ein frisches Joomla mit TUF_ED und nichts, wofür Sie sich nicht verbürgen können."
COM_TUF_ED_INTEGRITY_CONFIRM_INTRO="Bestätigen Sie nur Änderungen, die Sie erklären können: Updates, die Sie oder Ihr Team vorgenommen haben, Konfiguration, die Sie geändert haben. Alles, was mit „kein Installer-Ereignis“ markiert ist, verdient einen genaueren Blick."
COM_TUF_ED_INTEGRITY_CONFIRM_LABEL="Ich habe die obigen Änderungen geprüft und verbürge mich für den aktuellen Zustand dieser Instanz."
