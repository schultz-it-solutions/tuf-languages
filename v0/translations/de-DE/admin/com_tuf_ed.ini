COM_TUF_ED_ROLES_HELP="Jede Rolle braucht mindestens ein eigenes Konto, das aktiv ist, MFA eingerichtet hat und kein Super Benutzer ist. Ein Konto darf nur eine Rolle haben; Super Benutzer sind nur für die Administration da. Ein Ein-Personen-Betrieb verwendet ein Konto pro Rolle, jedes mit eigener E-Mail-Adresse oder eigenem Alias."
COM_TUF_ED_ROLES_MISSING="%s: kein nutzbares Konto (aktiv, MFA eingerichtet, kein Super Benutzer, keine andere Rolle)"
