COM_TUF_ED_CONFIGURATION="TUF Extension Developer: Optionen"
COM_TUF_ED_CONFIG_MAIN_WEBSITE_DESC="Ihre öffentliche Website (https://…). Wird im vorgeschlagenen Text für die Offline-Seite dieser Website verwendet."
COM_TUF_ED_CONFIG_MAIN_WEBSITE_LABEL="Hauptwebsite"
COM_TUF_ED_CONFIG_PRIVATE_PATH_DESC="Außerhalb des Web-Roots, z. B. /home/user/tuf_ed_private. Enthält das Geheimnis, das die Online-Schlüssel für snapshot und timestamp versiegelt, sowie die hochgeladenen Pakete. Beziehen Sie den Ordner in Ihre Backups ein, bewahren Sie diese Backups aber getrennt von den Datenbank-Backups auf: Das Geheimnis und die Datenbank zusammen öffnen die Online-Schlüssel."
COM_TUF_ED_CONFIG_PRIVATE_PATH_LABEL="Privater Ordner"
COM_TUF_ED_CONFIG_PUBLISH_METHOD_DESC="Wohin das öffentliche TUF-Repository geschrieben wird: in einen Ordner auf diesem Server oder per SFTP in einen Ordner auf einem anderen Server (z. B. dem Server Ihrer Hauptwebsite)."
COM_TUF_ED_CONFIG_PUBLISH_METHOD_LABEL="Veröffentlichungsmethode"
COM_TUF_ED_CONFIG_PUBLISH_METHOD_LOCAL="Ordner auf diesem Server"
COM_TUF_ED_CONFIG_PUBLISH_METHOD_SFTP="SFTP auf einen anderen Server"
COM_TUF_ED_CONFIG_PUBLISH_PACKAGES_DESC="Die signierten Pakete zusätzlich in den Veröffentlichungsordner kopieren, als targets/&lt;sha256&gt;.&lt;name&gt;. Ausgeschaltet lassen, wenn Sie die Pakete über Ihren bestehenden Update-Server ausliefern."
COM_TUF_ED_CONFIG_PUBLISH_PACKAGES_LABEL="Pakete veröffentlichen"
COM_TUF_ED_CONFIG_PUBLISH_PATH_DESC="Wohin das öffentliche TUF-Repository als statische Dateien geschrieben wird: ein Ordner Ihrer Hauptwebsite oder ein neuer Ordner unterhalb des Web-Roots dieser Website (kein Joomla-Ordner). Der Webserver liefert diese Dateien direkt aus, auch während diese Website offline ist."
COM_TUF_ED_CONFIG_PUBLISH_PATH_LABEL="Veröffentlichungsordner"
COM_TUF_ED_CONFIG_PUBLISH_URL_DESC="https://…-Adresse, unter der der Veröffentlichungsordner erreichbar ist. Update-Clients laden von dort timestamp.json, die versionierten Metadaten und, falls veröffentlicht, die Pakete."
COM_TUF_ED_CONFIG_PUBLISH_URL_LABEL="Öffentliche URL des Veröffentlichungsordners"
COM_TUF_ED_CONFIG_REQUEST_LIFETIME_DESC="Wie lange eine vorbereitete Signieranfrage signiert werden kann (1–30). Sie wird außerdem unbrauchbar, sobald sich ändert, worauf sie beruht."
COM_TUF_ED_CONFIG_REQUEST_LIFETIME_LABEL="Gültigkeit der Signieranfrage (Tage)"
COM_TUF_ED_CONFIG_ROOT_EXPIRY_DESC="Standard-Gültigkeitsdauer einer neuen root.json-Version. Clients lehnen eine abgelaufene root ab, signieren Sie also rechtzeitig vor diesem Datum eine neue Version."
COM_TUF_ED_CONFIG_ROOT_EXPIRY_LABEL="Ablauf der root (Tage)"
COM_TUF_ED_CONFIG_ROOT_LABEL="Root-Metadaten"
COM_TUF_ED_CONFIG_SFTP_AUTH_DESC="Ein Schlüssel wird empfohlen. Verwenden Sie ein SFTP-Konto, das nur den Repository-Ordner erreicht (chroot): Jede veröffentlichte Datei ist signiert, daher kann dieses Konto im schlimmsten Fall Updates blockieren, es sollte aber nichts anderes erreichen."
COM_TUF_ED_CONFIG_SFTP_AUTH_KEY="Private Schlüsseldatei"
COM_TUF_ED_CONFIG_SFTP_AUTH_LABEL="Anmelden mit"
COM_TUF_ED_CONFIG_SFTP_AUTH_PASSWORD="Passwort"
COM_TUF_ED_CONFIG_SFTP_HOST_DESC="Hostname oder IP-Adresse des Servers, der das Repository ausliefert, z. B. ssh.example.com."
COM_TUF_ED_CONFIG_SFTP_HOST_KEY_DESC="SHA256-Fingerabdruck des Host-Schlüssels des Servers, wie ssh-keygen -lf ihn ausgibt (SHA256:…). An einen Server mit einem anderen Schlüssel wird nichts gesendet. Zunächst leer lassen: Veröffentlichen → Host-Schlüssel anzeigen zeigt, was der Server vorlegt; vergleichen Sie es mit dem Fingerabdruck, den Ihr Hosting-Anbieter angibt, bevor Sie ihn eintragen."
COM_TUF_ED_CONFIG_SFTP_HOST_KEY_LABEL="Fingerabdruck des Host-Schlüssels"
COM_TUF_ED_CONFIG_SFTP_HOST_LABEL="SFTP-Host"
COM_TUF_ED_CONFIG_SFTP_KEY_FILE_DESC="Privater OpenSSH-Schlüssel ohne Passphrase (nötig für die stündliche Erneuerung), z. B. erzeugt mit ssh-keygen -t ed25519 -N '' -f sftp_ed25519. Ein reiner Dateiname wird im privaten Ordner gesucht; ein absoluter Pfad muss außerhalb des Web-Roots liegen. Berechtigungen 0600."
COM_TUF_ED_CONFIG_SFTP_KEY_FILE_LABEL="Private Schlüsseldatei"
COM_TUF_ED_CONFIG_SFTP_PASSWORD_DESC="Das Passwort wird nicht in den Optionen (Datenbank) gespeichert. Legen Sie es auf der Seite Veröffentlichen fest: TUF_ED bewahrt es im privaten Ordner auf. Eine Schlüsseldatei ist trotzdem die bessere Wahl."
COM_TUF_ED_CONFIG_SFTP_PASSWORD_LABEL="SFTP-Passwort"
COM_TUF_ED_CONFIG_SFTP_PATH_DESC="Ordner auf dem SFTP-Server, den der Webserver unter der öffentlichen URL unten ausliefert, z. B. /var/www/example.com/tuf oder tuf (relativ zum Anmeldeordner). Er muss existieren."
COM_TUF_ED_CONFIG_SFTP_PATH_LABEL="Entfernter Ordner"
COM_TUF_ED_CONFIG_SFTP_PORT_LABEL="SFTP-Port"
COM_TUF_ED_CONFIG_SFTP_USERNAME_LABEL="SFTP-Benutzername"
COM_TUF_ED_CONFIG_SIGNING_LABEL="Paketsignierung"
COM_TUF_ED_CONFIG_SITE_LABEL="Website"
COM_TUF_ED_CONFIG_SNAPSHOT_EXPIRY_DESC="Gültigkeitsdauer von snapshot.json (1–30). Wird automatisch mit dem Online-snapshot-Schlüssel erneuert, wenn weniger als die Hälfte übrig ist."
COM_TUF_ED_CONFIG_SNAPSHOT_EXPIRY_LABEL="Ablauf von snapshot (Tage)"
COM_TUF_ED_CONFIG_STORAGE_DESC="Absolute Pfade auf diesem Server. Beide Ordner müssen existieren und für PHP beschreibbar sein."
COM_TUF_ED_CONFIG_STORAGE_LABEL="Speicherort"
COM_TUF_ED_CONFIG_TARGETS_EXPIRY_DESC="Standard-Gültigkeitsdauer einer neuen targets.json-Version (7–365). Sie wird mit Ihrem Offline-targets-Schlüssel signiert und daher manuell erneuert; Sie erhalten 30 und 7 Tage vorher Erinnerungen."
COM_TUF_ED_CONFIG_TARGETS_EXPIRY_LABEL="Ablauf von targets (Tage)"
COM_TUF_ED_CONFIG_TIMESTAMP_EXPIRY_DESC="Gültigkeitsdauer von timestamp.json (4–168). Wird von der stündlichen Aufgabe automatisch erneuert, wenn weniger als die Hälfte übrig ist. Kürzer bedeutet, dass Clients ein eingefrorenes Repository früher bemerken; die stündliche Aufgabe muss dann zuverlässig laufen."
COM_TUF_ED_CONFIG_TIMESTAMP_EXPIRY_LABEL="Ablauf von timestamp (Stunden)"
COM_TUF_ED_CONFIG_UNINSTALL_DESTROY_DESC="Ja (Standard): Beim Deinstallieren von TUF_ED werden die versiegelten Online-Schlüssel (snapshot, timestamp), die Geheimnisdatei, die sie versiegelt, und das gespeicherte SFTP-Passwort vernichtet. Sie lassen sich danach nicht wiederherstellen: Nach einer Neuinstallation erzeugen Sie neue Online-Schlüssel und signieren eine neue root-Version. Wählen Sie Nein nur, wenn Sie deinstallieren, um sofort wieder zu installieren; die Schlüssel bleiben dann auf diesem Server, bis Sie sie löschen."
COM_TUF_ED_CONFIG_UNINSTALL_DESTROY_LABEL="Beim Deinstallieren: Online-Schlüssel vernichten"
COM_TUF_ED_CORE_UPDATES_AUTOMATED="Automatische Core-Updates"
COM_TUF_ED_CORE_UPDATES_AUTOMATED_AT_SIGNING="Automatische Core-Updates beim Signieren"
COM_TUF_ED_CORE_UPDATES_HEADING="Automatische Joomla-Updates"
COM_TUF_ED_CORE_UPDATES_HELP="Lassen Sie die automatischen Core-Updates eingeschaltet: Ein Signierserver mit einer bekannten Joomla-Sicherheitslücke untergräbt, was er signiert. Der Update-Dienst prüft diese Website über /api/index.php/v1/joomlaupdate/healthcheck, daher muss dieser Pfad erreichbar bleiben, auch während das Frontend offline ist. Wenn Sie manuell aktualisieren, halten Sie die Begründung und Ihre Frist für Sicherheitsupdates in der Schlüsselverwaltungserklärung fest."
COM_TUF_ED_CORE_UPDATES_JUSTIFIED="Begründung für manuelle Updates"
COM_TUF_ED_CORE_UPDATES_JUSTIFIED_IN="In Version %d der Schlüsselverwaltungserklärung"
COM_TUF_ED_CORE_UPDATES_NOT_AVAILABLE="Joomla bietet automatische Updates nur mit dem Update-Kanal &quot;Standard&quot; und der Mindeststabilität &quot;Stabil&quot; an."
COM_TUF_ED_CORE_UPDATES_OPEN_OPTIONS="Die Optionen von Joomla-Aktualisierung öffnen"
COM_TUF_ED_CORE_UPDATES_PLUGIN="Plugin &quot;Web Services - Joomla Update&quot;"
COM_TUF_ED_CORE_UPDATES_REGISTERED="Beim Update-Dienst registriert"
COM_TUF_ED_CORE_UPDATES_WARN_OFF="Die automatischen Joomla-Core-Updates sind ausgeschaltet, und die signierte Schlüsselverwaltungserklärung nennt keine Begründung für manuelle Updates. <a href=\"%1$s\">Schalten Sie sie ein</a> (Joomla-Aktualisierung → Optionen → Automatische Updates), oder halten Sie die Begründung und Ihre Frist für Sicherheitsupdates in der <a href=\"%2$s\">Schlüsselverwaltungserklärung</a> fest und signieren Sie sie."
COM_TUF_ED_CORE_UPDATES_WARN_PLUGIN="Das Plugin &quot;Web Services - Joomla Update&quot; ist deaktiviert. Ohne es kann der Update-Dienst diese Website nicht erreichen (404 auf /api/index.php/v1/joomlaupdate/healthcheck), und die Registrierung für automatische Updates schlägt fehl. <a href=\"%s\">Aktivieren Sie das Plugin</a> und schalten Sie danach die automatischen Updates wieder ein."
COM_TUF_ED_CORE_UPDATES_WARN_UNAVAILABLE="Automatische Joomla-Core-Updates sind mit den aktuellen <a href=\"%1$s\">Optionen von Joomla-Aktualisierung</a> nicht möglich: Sie erfordern den Update-Kanal &quot;Standard&quot; und die Mindeststabilität &quot;Stabil&quot;. Ändern Sie diese Optionen, oder halten Sie die Begründung für manuelle Updates in der <a href=\"%2$s\">Schlüsselverwaltungserklärung</a> fest und signieren Sie sie."
COM_TUF_ED_CORE_UPDATES_WARN_UNREGISTERED="Die automatischen Joomla-Core-Updates sind eingeschaltet, aber diese Website ist noch nicht beim Update-Dienst registriert. Speichern Sie die <a href=\"%s\">Optionen von Joomla-Aktualisierung</a> erneut; schlägt die Registrierung fehl, prüfen Sie, ob /api/index.php/v1/joomlaupdate/healthcheck aus dem Internet erreichbar ist."
