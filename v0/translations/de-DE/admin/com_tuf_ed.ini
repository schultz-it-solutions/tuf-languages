COM_TUF_ED_ROOT_THRESHOLDS_DESC="Wie viele Schlüssel jeder Rolle signieren müssen. Ein Schwellenwert über 1 bedeutet, dass ein einzelner gestohlener Schlüssel nicht genügt. Änderungen werden wirksam, wenn die nächste root-Version signiert wird; bis dahin gelten die Schwellenwerte der aktuellen root."
