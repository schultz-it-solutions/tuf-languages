COM_TUF_ED_KEYS_GENERATE="Schlüssel erzeugen"
COM_TUF_ED_KEYS_GENERATE_BUTTON="Erzeugen und herunterladen"
COM_TUF_ED_KEYS_GENERATE_DOWNLOAD="Die Schlüsseldatei wird heruntergeladen, sobald Sie auf die Schaltfläche klicken, und nur dann: Sie wird nicht auf dem Server gespeichert und kann daher nicht erneut heruntergeladen werden. Bewahren Sie sie sicher auf, gehen Sie dann zur Schlüsselliste und bestätigen Sie den neuen Schlüssel, indem Sie die Datei einmal hochladen. Bis dahin wird der Schlüssel nicht verwendet. Ein Schlüssel, der nicht innerhalb von 24 Stunden bestätigt wird, wird gelöscht."
COM_TUF_ED_KEYS_GENERATE_INTRO="Auf diesem Server wird ein neues Ed25519-Schlüsselpaar erzeugt (Signieren in der Komponente). Ihr Browser lädt den privaten Schlüssel sofort herunter, als Datei, die mit der hier eingegebenen Passphrase verschlüsselt ist; auf dem Server bleibt keine Kopie. Die Website behält nur den öffentlichen Schlüssel. Zum Signieren laden Sie diese Datei erneut hoch. Für den stärksten Schutz bewahren Sie Ihren root-Schlüssel stattdessen offline auf: Erzeugen Sie ihn auf Ihrem eigenen Computer und verwenden Sie Offline-Schlüssel registrieren."
COM_TUF_ED_KEYS_GENERATE_ONLINE="Online-Schlüssel erzeugen"
COM_TUF_ED_KEYS_GENERATE_THEN_CONFIRM="Heruntergeladen? Bestätigen Sie ihn in der Schlüsselliste"
COM_TUF_ED_KEYS_INTRO="Ihre eigenen Schlüssel. Sie erzeugen und besitzen sie selbst; ein TUF Intermediary bestätigt nur Ihren root-Schlüssel, er signiert ihn nie und besitzt ihn nie."
