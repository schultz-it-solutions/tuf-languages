COM_TUF_ED_KEYSETUP_INTRO="Ihr Repository braucht vier Schlüssel, angelegt in dieser Reihenfolge: root, targets, snapshot und timestamp. Danach bereiten Sie die erste root vor, die sie auflistet, und signieren sie. Jeder Schritt wird freigeschaltet, wenn der vorherige erledigt ist."
