COM_TUF_ED_LIBRARY_MISSING="lib_com_tuf 0.1.0 oder neuer ist erforderlich. Installieren oder aktualisieren Sie zuerst die Bibliothek."
COM_TUF_ED_MAIL_CORE_UPDATES_BODY="Die automatischen Joomla-Core-Updates auf dieser TUF_ED-Instanz erfordern Ihre Aufmerksamkeit:\n\n%s\n\nEin Signierserver mit einer bekannten Joomla-Sicherheitslücke untergräbt, was er signiert. Öffnen Sie das TUF_ED-Dashboard (Karte „Automatische Joomla-Updates“) für Details und Links."
COM_TUF_ED_MAIL_CORE_UPDATES_OFF="Die automatischen Core-Updates sind ausgeschaltet, und die signierte Schlüsselverwaltungserklärung nennt keine Begründung für manuelle Updates. Schalten Sie sie ein (Joomla-Aktualisierung → Optionen → Automatische Updates), oder halten Sie die Begründung und Ihre Frist für Sicherheitsupdates in der Schlüsselverwaltungserklärung fest und signieren Sie sie."
COM_TUF_ED_MAIL_CORE_UPDATES_PLUGIN="Das Plugin „Web Services - Joomla Update“ ist deaktiviert. Ohne es kann der Update-Dienst diese Website nicht erreichen (404 auf /api/index.php/v1/joomlaupdate/healthcheck), und die Registrierung für automatische Updates schlägt fehl. Aktivieren Sie es unter System → Plugins und schalten Sie danach die automatischen Updates wieder ein."
COM_TUF_ED_MAIL_CORE_UPDATES_SUBJECT="[%s] TUF_ED: Automatische Joomla-Updates erfordern Aufmerksamkeit"
COM_TUF_ED_MAIL_CORE_UPDATES_UNAVAILABLE="Automatische Core-Updates sind mit den aktuellen Optionen von Joomla-Aktualisierung nicht möglich: Sie erfordern den Update-Kanal „Standard“ und die Mindeststabilität „Stabil“. Ändern Sie diese Optionen, oder halten Sie die Begründung für manuelle Updates in der Schlüsselverwaltungserklärung fest und signieren Sie sie."
COM_TUF_ED_MAIL_CORE_UPDATES_UNREGISTERED="Die automatischen Core-Updates sind eingeschaltet, aber diese Website ist noch nicht beim Update-Dienst registriert. Speichern Sie die Optionen von Joomla-Aktualisierung erneut; schlägt die Registrierung fehl, prüfen Sie, ob /api/index.php/v1/joomlaupdate/healthcheck aus dem Internet erreichbar ist."
COM_TUF_ED_MAIL_DRIFT_BODY="Diese Prüfungen des TUF_ED-Einrichtungsschritts sind nicht mehr erfüllt:\n\n%s\n\nWenn Sie das nicht selbst geändert haben, finden Sie heraus, wer es war. Um die Einstellungen wiederherzustellen, öffnen Sie Komponenten → TUF Extension Developer → Einrichtung."
COM_TUF_ED_MAIL_DRIFT_SUBJECT="[%s] TUF_ED: Einrichtungseinstellungen wurden geändert"
COM_TUF_ED_MAIL_EXTENSIONS_BODY="Diese Erweiterungen sind auf der TUF_ED-Instanz installiert, aber nicht zugelassen oder seit ihrer Freigabe geändert:\n\n%s\n\nWenn Sie das nicht erwartet haben, betrachten Sie die Instanz als kompromittiert und signieren Sie darauf nichts. Andernfalls prüfen Sie die Erweiterungen unter Komponenten → TUF Extension Developer → Einrichtung → Erweiterungen."
COM_TUF_ED_MAIL_EXTENSIONS_SUBJECT="[%s] TUF_ED: %d Erweiterung(en) nicht zugelassen oder geändert"
COM_TUF_ED_MAIL_FOOTER="Diese Nachricht wurde von den geplanten Aufgaben von TUF Extension Developer (com_tuf_ed) an alle Benutzer der Gruppe TUF_ED Owner gesendet. Derselbe Befund wird nicht erneut gesendet, eine Änderung schon."
COM_TUF_ED_MAIL_INTEGRITY_BODY="Die tägliche Prüfung der Instanz hat Abweichungen von dem Referenzstand gefunden, den ein Owner bestätigt hat:\n\n%1$s\n\nAusgeschlossene Ordner (nicht gehasht; ausführbare Dateien darin werden gemeldet):\n\n%2$s\n\nDie Prüfung hat %3$s gehasht\n\nTUF_ED verweigert den Umgang mit Schlüsseln, bis ein Owner die Änderungen geprüft und bestätigt hat; die stündliche Erneuerung läuft weiter. Wenn eine Änderung nicht von einem Update oder einer Konfigurationsänderung stammt, die Sie kennen, betrachten Sie die Instanz als kompromittiert und signieren Sie darauf nichts. Prüfen Sie die Änderungen unter Komponenten → TUF Extension Developer → Integrität."
COM_TUF_ED_MAIL_INTEGRITY_SUBJECT="[%s] TUF_ED: Die Instanz weicht von ihrem bestätigten Referenzstand ab"
COM_TUF_ED_MAIL_KMS_DUE="Ihre Schlüsselverwaltungserklärung (Version %1$d) muss am %2$s geprüft werden."
COM_TUF_ED_MAIL_KMS_HOWTO="Zur Prüfung: Öffnen Sie Komponenten → TUF Extension Developer → Schlüsselverwaltung, prüfen Sie jeden Schlüssel (und dass sich jede Kopie noch öffnen lässt), speichern Sie den Entwurf und signieren Sie ihn mit Ihrer root-Schlüsseldatei. Ein unverändertes erneutes Signieren bestätigt die Prüfung."
COM_TUF_ED_MAIL_KMS_KEYS_CHANGED="Ihre aktiven Schlüssel haben sich seit der letzten signierten Version der Erklärung geändert."
COM_TUF_ED_MAIL_KMS_OVERDUE="Die Prüfung Ihrer Schlüsselverwaltungserklärung (Version %1$d) war am %2$s fällig."
COM_TUF_ED_MAIL_KMS_SUBJECT="[%s] TUF_ED: Prüfen Sie Ihre Schlüsselverwaltungserklärung"
COM_TUF_ED_MAIL_OWN_FILES_BODY="Die eigenen Dateien von TUF_ED auf dieser Instanz stimmen nicht mit der Dateiliste des installierten Releases überein, oder die Liste stimmt nicht mit ihrer Festschreibung überein:\n\n%s\n\nTUF_ED verweigert den Umgang mit Schlüsseln und das Veröffentlichen, bis das behoben ist; auch die stündliche Erneuerung stoppt. Wenn Sie die Dateien von TUF_ED nicht selbst geändert haben, betrachten Sie die Instanz als kompromittiert und signieren Sie darauf nichts. Details unter Komponenten → TUF Extension Developer → Einrichtung → Erweiterungen."
COM_TUF_ED_MAIL_OWN_FILES_SUBJECT="[%s] TUF_ED: Die eigenen Dateien bestehen die Prüfung nicht"
COM_TUF_ED_MAIL_RENEWAL_BODY="Die stündliche Erneuerung von snapshot und timestamp ist fehlgeschlagen:\n\n%s\n\nDie veröffentlichte timestamp.json läuft am %s ab. Danach installieren Websites Ihre Updates nicht mehr, bis die Erneuerung wieder funktioniert. Öffnen Sie zur Prüfung Komponenten → TUF Extension Developer → Veröffentlichen."
COM_TUF_ED_MAIL_RENEWAL_SUBJECT="[%s] TUF_ED: Erneuerung von snapshot/timestamp FEHLGESCHLAGEN"
COM_TUF_ED_MAIL_ROLES_BODY="Die Rollentrennung dieser TUF_ED-Instanz ist nicht vollständig:\n\n%s\n\nJede Rolle braucht mindestens ein eigenes Konto, das aktiv ist, MFA eingerichtet hat und kein Super Benutzer ist. Ein Konto darf nur eine Rolle haben. Prüfen Sie die Konten unter Benutzer → Verwalten und die Übersicht im TUF_ED-Dashboard."
COM_TUF_ED_MAIL_ROLES_SUBJECT="[%s] TUF_ED: Rollenkonten erfordern Aufmerksamkeit"
COM_TUF_ED_MAIL_ROOT_EXPIRED_BODY="Ihre root-Metadaten (root.json Version %d) sind am %s abgelaufen.\n\nWebsites installieren keine Updates Ihrer Erweiterungen mehr, bis Sie eine neue root-Version signieren: Komponenten → TUF Extension Developer → Root-Metadaten → Signieren."
