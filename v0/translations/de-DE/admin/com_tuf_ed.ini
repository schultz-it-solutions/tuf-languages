COM_TUF_ED_SETUP_CHECK_CLEAN_INSTANCE="Saubere Instanz"
COM_TUF_ED_SETUP_CHECK_CLEAN_INSTANCE_DESC="Prüft die eigenen Dateien von TUF_ED anhand der Dateiliste des installierten Releases und listet jede Erweiterung auf, die weder zum Joomla-Core noch zu TUF gehört noch ausdrücklich zugelassen ist. Entfernen Sie sie, verwenden Sie eine separate Joomla-Instanz für TUF_ED oder lassen Sie einige wenige mit triftigem Grund zu."
COM_TUF_ED_SETUP_CHECK_GLOBAL_CONFIG="Konfiguration"
COM_TUF_ED_SETUP_CHECK_GLOBAL_CONFIG_DESC="Hier geprüft, manuell geändert: Frontend offline mit neutraler Offline-Nachricht, keine Indexierung durch Suchmaschinen, HTTPS für die gesamte Website, kurze Sitzungen, keine Debug-Ausgabe."
COM_TUF_ED_SETUP_CHECK_GROUPS="TUF_ED-Benutzergruppen"
COM_TUF_ED_SETUP_CHECK_GROUPS_DESC="Legt TUF_ED Owner (Schlüssel, root-Signatur), TUF_EDC Signer (Paketsignatur) und TUF_ED Auditor (nur lesen) direkt unterhalb von Public an."
COM_TUF_ED_SETUP_CHECK_INTEGRITY="Referenzstand der Instanz"
COM_TUF_ED_SETUP_CHECK_INTEGRITY_DESC="Hier geprüft, von einem Owner auf der Seite Integrität bestätigt: der SHA-256 jeder Datei dieser Joomla-Instanz, verglichen mit dem Referenzstand, den ein Owner bestätigt hat. Der Umgang mit Schlüsseln wird verweigert, bis es einen Referenzstand gibt und die Instanz ihm entspricht."
COM_TUF_ED_SETUP_CHECK_LEGACY_GROUPS="Standardgruppen löschen"
COM_TUF_ED_SETUP_CHECK_LEGACY_GROUPS_DESC="Löscht Author, Editor, Publisher, Manager und Administrator. Public, Guest, Registered und Super Users bleiben, weil Joomla sie braucht."
COM_TUF_ED_SETUP_CHECK_LEGACY_USERS="Benutzer in Standardgruppen"
COM_TUF_ED_SETUP_CHECK_LEGACY_USERS_DESC="Entfernt Benutzer aus Author, Editor, Publisher, Manager und Administrator. Ein Benutzer ohne verbleibende Gruppe wird nach Registered verschoben und gesperrt (Sie können ihn unter Benutzer entsperren). Sie selbst werden nie gesperrt."
COM_TUF_ED_SETUP_CHECK_PERMISSIONS="Berechtigungen"
COM_TUF_ED_SETUP_CHECK_PERMISSIONS_DESC="Setzt die globalen und die TUF_ED-Berechtigungen für die neuen Gruppen. Super Benutzer behalten immer alle Rechte."
COM_TUF_ED_SETUP_CHECK_PLUGINS_OFF="Plugins für Fernzugriff"
COM_TUF_ED_SETUP_CHECK_PLUGINS_OFF_DESC="Deaktiviert die Plugins Web Services (API) und API-Authentifizierung, die Installation von Erweiterungen aus dem Web oder von einer URL sowie das Plugin System - Debug. Nicht Web Services - Joomla Update: Automatische Joomla-Updates brauchen es (siehe Dashboard)."
COM_TUF_ED_SETUP_CHECK_PLUGINS_ON="Sicherheits-Plugins"
COM_TUF_ED_SETUP_CHECK_PLUGINS_ON_DESC="Aktiviert HTTP-Header, Benutzeraktionen-Log und die TUF_ED-Plugins (geplante Aufgaben, Rollentrennung)."
COM_TUF_ED_SETUP_CHECK_SCHEDULER_CRON="Aufgabenausführung (Cron)"
COM_TUF_ED_SETUP_CHECK_SCHEDULER_CRON_DESC="Hier geprüft, manuell geändert: Das Frontend dieser Website ist offline, daher ist der Lazy Scheduler (der Aufgaben bei Seitenaufrufen ausführt) nicht zuverlässig. Schalten Sie ihn aus und führen Sie die Aufgaben über einen Cronjob auf dem Server aus."
COM_TUF_ED_SETUP_CHECK_SCHEDULER_TASKS="Geplante Aufgaben"
COM_TUF_ED_SETUP_CHECK_SCHEDULER_TASKS_DESC="Legt die TUF_ED-Aufgaben an: tägliche Ablauf-Erinnerung, Erweiterungsprüfung, Einrichtungsprüfung und Instanzprüfung sowie die stündliche Erneuerung von snapshot und timestamp. E-Mails gehen an alle Benutzer in TUF_ED Owner."
COM_TUF_ED_SETUP_CHECK_STORAGE="Speicherordner"
COM_TUF_ED_SETUP_CHECK_STORAGE_DESC="Hier geprüft, festgelegt unter Optionen → Speicherort: ein privater Ordner außerhalb des Web-Roots (Geheimnis der Online-Schlüssel, hochgeladene Pakete) und ein Veröffentlichungsordner für das öffentliche, statische TUF-Repository. Erst nötig, wenn Sie Pakete signieren."
COM_TUF_ED_SETUP_CHECK_USERS_CONFIG="Benutzeroptionen"
COM_TUF_ED_SETUP_CHECK_USERS_CONFIG_DESC="Schaltet die Selbstregistrierung aus, erzwingt die Multi-Faktor-Authentifizierung für die TUF_ED-Gruppen und Super Benutzer und setzt die Mindestlänge für Passwörter auf 16."
COM_TUF_ED_SETUP_CHECK_VIEWLEVELS="Zugriffsebenen"
COM_TUF_ED_SETUP_CHECK_VIEWLEVELS_DESC="Registered und Special enthalten die TUF_ED-Gruppen. Gelöschte Gruppen werden automatisch aus allen Ebenen entfernt."
COM_TUF_ED_SETUP_CONFIRM="Mir ist bewusst, dass diese Änderungen die gesamte Joomla-Website betreffen (Benutzer, Gruppen, Berechtigungen, Plugins)."
