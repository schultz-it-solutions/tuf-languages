COM_TUF_ED_ROLES_OWNER_JED_EMAIL="Der TUF_ED Owner sollte dieselbe E-Mail-Adresse verwenden wie das JED-Konto, unter dem die Erweiterungen veröffentlicht werden. Das kann noch nicht automatisch geprüft werden."
COM_TUF_ED_ROLES_SAVE_REFUSED="Das Konto kann nicht gespeichert werden: Es hätte %s. Auf einer TUF_ED-Instanz darf ein Konto nur eine der Rollen TUF_ED Owner, TUF_EDC Signer und TUF_ED Auditor haben, und Super Benutzer dürfen keine haben. Verwenden Sie für jede Rolle ein eigenes Konto."
