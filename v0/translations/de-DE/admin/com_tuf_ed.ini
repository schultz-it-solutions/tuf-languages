COM_TUF_ED_GUARD_ERR_DEBUG="Der Debug-Modus von Joomla ist eingeschaltet (Konfiguration → System). Er zeichnet Anfragen einschließlich Formulardaten auf. Schalten Sie ihn aus; bis dahin verweigert TUF_ED den Umgang mit Schlüsseln."
COM_TUF_ED_GUARD_ERR_DEBUG_PLUGIN="Das Plugin „System - Debug“ ist aktiviert. Es zeichnet Anfragen einschließlich Formulardaten auf. Deaktivieren Sie es (die Einrichtung erledigt das für Sie); bis dahin verweigert TUF_ED den Umgang mit Schlüsseln."
COM_TUF_ED_GUARD_ERR_SUPERUSER="Super Benutzer können in TUF_ED weder mit Schlüsseln noch mit Signaturen umgehen. Melden Sie sich mit Ihrem TUF_ED-Rollenkonto an (Owner oder Signer)."
