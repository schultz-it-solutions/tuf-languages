COM_TUF_ED_INTEGRITY_INTRO="Jede Datei dieser Joomla-Instanz wird gehasht und mit dem Referenzstand verglichen, den ein Owner bestätigt hat. Ordner, in die Joomla zur Laufzeit schreibt, werden nicht gehasht, ausführbare Dateien darin werden aber gemeldet (ausgenommen PHP-Dateien, die keinen Code ausführen können, wie die Cache-Einträge und Logdateien von Joomla). Nach einem Installer-Ereignis oder einer Änderung der Konfiguration bleiben die Änderungen offen, bis ein Owner sie prüft und bestätigt. Bis dahin verweigert TUF_ED den Umgang mit Schlüsseln; die stündliche Erneuerung von snapshot und timestamp läuft weiter. Dies ist ein Stolperdraht: Wer als Webserver-Benutzer Code ausführen kann, kann die Dateien, den Referenzstand und diese Prüfung ändern. Code außerhalb von Dateien (in der Datenbank, außerhalb des Joomla-Ordners, im Opcode-Cache) wird nicht erfasst."
