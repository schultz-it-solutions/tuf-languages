COM_TUF_ED_ANCHOR_ERR_EXISTS="Ein Vertrauensanker existiert, aber die Datenbank enthält keine root: Die früheren roots fehlen in der Datenbank. Stellen Sie sie wieder her; eine neue erste root wird abgelehnt."
