COM_TUF_ED_INTEGRITY_ERR_PRIVATE="Der private Ordner ist nicht festgelegt oder nicht nutzbar (Optionen → Speicherort), daher kann die Instanz nicht geprüft werden."
COM_TUF_ED_INTEGRITY_ERR_SUPERUSER="Super Benutzer können den Referenzstand der Instanz nicht bestätigen. Verwenden Sie Ihr TUF_ED-Owner-Konto."
COM_TUF_ED_INTEGRITY_EVENT="Ereignis"
