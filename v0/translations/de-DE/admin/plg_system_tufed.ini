PLG_SYSTEM_TUFED="System - TUF Extension Developer"
PLG_SYSTEM_TUFED_MAIL_EXT_INSTALLED="Eine Erweiterung, die nicht zu Joomla oder TUF gehört, wurde installiert.\n\nErweiterung: %1$s\nVersion: %2$s\nInstalliert von: %3$s\n\nSie läuft im selben PHP-Prozess wie der Signiercode. Online-Schlüssel werden nicht verwendet, bis sie entfernt oder ausdrücklich zugelassen wird (Einrichtung → Erweiterungen)."
PLG_SYSTEM_TUFED_MAIL_EXT_SUBJECT="[%s] TUF_ED: Erweiterung installiert oder aktualisiert"
PLG_SYSTEM_TUFED_MAIL_EXT_UPDATED="Eine Erweiterung, die nicht zu Joomla oder TUF gehört, wurde aktualisiert.\n\nErweiterung: %1$s\nVersion: %2$s\nAktualisiert von: %3$s\n\nEine Freigabe endet mit jeder Änderung der Erweiterung: Die Online-Schlüssel werden nicht verwendet, bis Sie die neue Version erneut zulassen (Einrichtung → Erweiterungen)."
PLG_SYSTEM_TUFED_MAIL_FOOTER="Diese Nachricht wurde sofort vom TUF_ED-Systemplugin (plg_system_tufed) an alle Benutzer der Gruppe TUF_ED Owner gesendet."
PLG_SYSTEM_TUFED_MAIL_ROLES_CHANGED="Die TUF_ED-Rollen eines Kontos haben sich geändert.\n\nKonto: %1$s\nVorher: %2$s\nJetzt: %3$s\nGeändert von: %4$s\n\nWenn Sie diese Änderung nicht erwartet haben, prüfen Sie das Konto sofort unter Benutzer → Verwalten: TUF_ED Owners und TUF_EDC Signers können Pakete signieren."
PLG_SYSTEM_TUFED_MAIL_ROLES_DELETED="Ein Konto mit einer TUF_ED-Rolle wurde gelöscht.\n\nKonto: %1$s\nRollen: %2$s\nGelöscht von: %4$s\n\nPrüfen Sie im TUF_ED-Dashboard, dass jede Rolle noch ein nutzbares Konto hat."
PLG_SYSTEM_TUFED_MAIL_ROLES_SUBJECT="[%s] TUF_ED: Rollenzugehörigkeit geändert"
PLG_SYSTEM_TUFED_ROLE_CONFLICT="TUF_ED-Rollentrennung: Das Konto &quot;%1$s&quot; hätte %2$s. Ein Konto darf nur eine TUF_ED-Rolle haben, ein Super Benutzer keine. Verwenden Sie für jede Rolle ein eigenes Konto (mit eigener E-Mail-Adresse oder eigenem Alias)."
PLG_SYSTEM_TUFED_WARN_INTEGRITY="<strong>TUF_ED: Die Instanz stimmt nicht mit ihrem bestätigten Referenzstand überein</strong> (%1$s). TUF_ED verweigert den Umgang mit Schlüsseln, bis ein Owner die Änderungen geprüft und bestätigt hat. <a href=\"%2$s\">Änderungen prüfen</a>."
PLG_SYSTEM_TUFED_WARN_NOT_CLEAN="<strong>TUF_ED: Diese Joomla-Instanz ist nicht sauber.</strong> %1$d Erweiterung(en) sind nicht zugelassen oder wurden seit ihrer Freigabe geändert: %2$s. Jede Erweiterung läuft im selben PHP-Prozess wie der Signiercode. <a href=\"%3$s\">Erweiterungen prüfen</a>."
PLG_SYSTEM_TUFED_WARN_OWN_FILES="<strong>TUF_ED: Die eigenen Dateien bestehen die Prüfung nicht</strong> (%1$s). TUF_ED verweigert den Umgang mit Schlüsseln und das Veröffentlichen, bis das behoben ist. <a href=\"%2$s\">Details anzeigen</a>."
PLG_SYSTEM_TUFED_WARN_ROLES="<strong>TUF_ED:</strong> Die Rollentrennung ist nicht vollständig (eine Rolle hat kein nutzbares Konto, oder ein Konto hat mehr als eine Rolle). <a href=\"%s\">Zum Dashboard</a>."
PLG_SYSTEM_TUFED_XML_DESCRIPTION="Schützt die TUF_ED-Instanz: verweigert das Speichern eines Kontos mit mehr als einer TUF_ED-Rolle oder mit einer Rolle und Super Benutzer, benachrichtigt die TUF_ED Owners sofort per E-Mail, wenn ein Konto eine Rolle erhält oder verliert oder eine Erweiterung installiert oder aktualisiert wird, und zeigt die TUF_ED-Warnungen auf jeder Backend-Seite. Lassen Sie es aktiviert."
