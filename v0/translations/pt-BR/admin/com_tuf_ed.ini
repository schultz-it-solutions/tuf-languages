COM_TUF_ED_SETUP_CHECK_CLEAN_INSTANCE_DESC="Checks TUF_ED's own files against the file list of the installed release, and lists every extension that is neither Joomla core, TUF nor explicitly allowed. Remove them, use a separate Joomla instance for TUF_ED, or allow a few with a valid reason."
