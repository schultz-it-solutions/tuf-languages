COM_TUF_ED_CONFIG_SFTP_KEY_FILE_DESC="Chave privada OpenSSH sem frase secreta (necessária para a renovação a cada hora), criada por exemplo com ssh-keygen -t ed25519 -N '' -f sftp_ed25519. Um nome de arquivo sozinho é procurado na pasta privada; um caminho absoluto deve estar fora da raiz web. Permissões 0600."
