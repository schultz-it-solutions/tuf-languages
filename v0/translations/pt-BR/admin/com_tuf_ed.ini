COM_TUF_ED_INTEGRITY_INTRO="O hash de cada arquivo desta instância do Joomla é calculado e comparado com o estado de referência confirmado por um Owner. Não é calculado o hash das pastas em que o Joomla grava durante a execução, mas os arquivos executáveis nelas são informados (exceto arquivos PHP que não podem executar código, como as entradas de cache e os arquivos de log do Joomla). Após um evento do instalador ou uma alteração da Configuração Global, as alterações ficam pendentes até que um Owner as revise e confirme. Até lá o TUF_ED recusa qualquer manuseio de chaves; a renovação a cada hora de snapshot e timestamp continua. Isto é um alarme de disparo: quem consegue executar código como o usuário do servidor web pode alterar os arquivos, o estado de referência e esta verificação. Código fora de arquivos (no banco de dados, fora da pasta do Joomla, no cache de opcode) não é coberto."
