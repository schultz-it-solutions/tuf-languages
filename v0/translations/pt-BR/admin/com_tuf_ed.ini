COM_TUF_ED_SETUP_CHECK_SCHEDULER_TASKS_DESC="Creates the TUF_ED tasks: daily expiry reminder, extension check, setup check and instance check, and the hourly renewal of snapshot and timestamp. Emails go to all users in TUF_ED Owner."
