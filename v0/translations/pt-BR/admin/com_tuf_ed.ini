COM_TUF_ED_SETUP_CHECK_INTEGRITY_DESC="Checked here, confirmed by an Owner on the Integrity page: the SHA-256 of every file of this Joomla instance, compared with the baseline an Owner confirmed. Key handling is refused until there is a baseline and the instance matches it."
COM_TUF_ED_SETUP_CHECK_LEGACY_GROUPS="Delete standard groups"
COM_TUF_ED_SETUP_CHECK_LEGACY_GROUPS_DESC="Deletes Author, Editor, Publisher, Manager and Administrator. Public, Guest, Registered and Super Users stay, because Joomla needs them."
COM_TUF_ED_SETUP_CHECK_LEGACY_USERS="Users in standard groups"
COM_TUF_ED_SETUP_CHECK_LEGACY_USERS_DESC="Removes users from Author, Editor, Publisher, Manager and Administrator. A user left without any group is moved to Registered and blocked (you can unblock them in Users). You are never blocked yourself."
COM_TUF_ED_SETUP_CHECK_PERMISSIONS="Permissions"
COM_TUF_ED_SETUP_CHECK_PERMISSIONS_DESC="Sets the global and the TUF_ED permissions for the new groups. Super Users always keep every right."
COM_TUF_ED_SETUP_CHECK_PLUGINS_OFF="Remote access plugins"
COM_TUF_ED_SETUP_CHECK_PLUGINS_OFF_DESC="Disables the Web Services (API) and API Authentication plugins, installing extensions from the web or from a URL, and the System - Debug plugin. Not Web Services - Joomla Update: automated Joomla updates need it (see the dashboard)."
