COM_TUF_ED_INTEGRITY_INTRO="Every file of this Joomla instance is hashed and compared with the baseline an Owner confirmed. Folders Joomla writes to at run time are not hashed, but executable files in them are reported (PHP files that cannot run code, such as Joomla's cache entries and log files, excepted). After an installer event or a change of the Global Configuration, the changes stay open until an Owner reviews and confirms them. Until then TUF_ED refuses key handling; the hourly renewal of snapshot and timestamp continues. This is a tripwire: someone who can run code as the web server user can change the files, the baseline and this check. Code outside files (in the database, outside the Joomla folder, in the opcode cache) is not covered."
