COM_TUF_ED_CONFIGURATION="TUF Extension Developer: opções"
COM_TUF_ED_CONFIG_MAIN_WEBSITE_DESC="Seu site público (https://…). Usado no texto sugerido para a página offline deste site."
COM_TUF_ED_CONFIG_MAIN_WEBSITE_LABEL="Site principal"
COM_TUF_ED_CONFIG_PRIVATE_PATH_DESC="Fora da raiz web, por exemplo /home/user/tuf_ed_private. Contém o segredo que sela as chaves online snapshot e timestamp e os pacotes enviados. Inclua-a nos seus backups, mas guarde esses backups separados dos backups do banco de dados: o segredo e o banco de dados juntos abrem as chaves online."
COM_TUF_ED_CONFIG_PRIVATE_PATH_LABEL="Pasta privada"
COM_TUF_ED_CONFIG_PUBLISH_METHOD_DESC="Onde o repositório TUF público é gravado: uma pasta neste servidor ou uma pasta em outro servidor via SFTP (por exemplo o servidor do seu site principal)."
COM_TUF_ED_CONFIG_PUBLISH_METHOD_LABEL="Método de publicação"
COM_TUF_ED_CONFIG_PUBLISH_METHOD_LOCAL="Pasta neste servidor"
COM_TUF_ED_CONFIG_PUBLISH_METHOD_SFTP="SFTP para outro servidor"
COM_TUF_ED_CONFIG_PUBLISH_PACKAGES_DESC="Copiar também os pacotes assinados para a pasta de publicação, como targets/&lt;sha256&gt;.&lt;name&gt;. Deixe desativado se você distribui os pacotes pelo seu servidor de atualização existente."
COM_TUF_ED_CONFIG_PUBLISH_PACKAGES_LABEL="Publicar pacotes"
COM_TUF_ED_CONFIG_PUBLISH_PATH_DESC="Onde o repositório TUF público é gravado como arquivos estáticos: uma pasta do seu site principal ou uma nova pasta abaixo da raiz web deste site (não uma pasta do Joomla). O servidor web entrega esses arquivos diretamente, mesmo enquanto este site está offline."
COM_TUF_ED_CONFIG_PUBLISH_PATH_LABEL="Pasta de publicação"
COM_TUF_ED_CONFIG_PUBLISH_URL_DESC="Endereço https://… pelo qual a pasta de publicação pode ser acessada. Os clientes de atualização buscam ali timestamp.json, os metadados versionados e, se publicados, os pacotes."
COM_TUF_ED_CONFIG_PUBLISH_URL_LABEL="URL pública da pasta de publicação"
COM_TUF_ED_CONFIG_REQUEST_LIFETIME_DESC="Por quanto tempo uma solicitação de assinatura preparada pode ser assinada (1–30). Ela também deixa de poder ser usada assim que muda aquilo em que se baseia."
COM_TUF_ED_CONFIG_REQUEST_LIFETIME_LABEL="Validade da solicitação de assinatura (dias)"
COM_TUF_ED_CONFIG_ROOT_EXPIRY_DESC="Validade padrão de uma nova versão de root.json. Os clientes recusam uma root expirada, então assine uma nova versão bem antes desta data."
COM_TUF_ED_CONFIG_ROOT_EXPIRY_LABEL="Expiração da root (dias)"
COM_TUF_ED_CONFIG_ROOT_LABEL="Metadados root"
COM_TUF_ED_CONFIG_SFTP_AUTH_DESC="Recomenda-se uma chave. Use uma conta SFTP que só alcance a pasta do repositório (chroot): todo arquivo publicado é assinado, então essa conta pode no máximo bloquear atualizações, mas não deve alcançar mais nada."
COM_TUF_ED_CONFIG_SFTP_AUTH_KEY="Arquivo de chave privada"
COM_TUF_ED_CONFIG_SFTP_AUTH_LABEL="Entrar com"
COM_TUF_ED_CONFIG_SFTP_AUTH_PASSWORD="Senha"
COM_TUF_ED_CONFIG_SFTP_HOST_DESC="Nome do host ou endereço IP do servidor que entrega o repositório, por exemplo ssh.example.com."
COM_TUF_ED_CONFIG_SFTP_HOST_KEY_DESC="Impressão digital SHA256 da chave de host do servidor, como o ssh-keygen -lf a exibe (SHA256:…). Nada é enviado a um servidor com uma chave diferente. Deixe vazio no início: Publicar → Mostrar chave de host exibe o que o servidor apresenta; compare com a impressão digital informada pelo seu provedor de hospedagem antes de inseri-la."
COM_TUF_ED_CONFIG_SFTP_HOST_KEY_LABEL="Impressão digital da chave de host"
COM_TUF_ED_CONFIG_SFTP_HOST_LABEL="Host SFTP"
COM_TUF_ED_CONFIG_SFTP_KEY_FILE_DESC="Chave privada OpenSSH sem frase secreta (necessária para a renovação a cada hora), criada por exemplo com ssh-keygen -t ed25519 -N '' -f sftp_ed25519. Um nome de arquivo sozinho é procurado na pasta privada; um caminho absoluto deve estar fora da raiz web. Permissões 0600."
COM_TUF_ED_CONFIG_SFTP_KEY_FILE_LABEL="Arquivo de chave privada"
COM_TUF_ED_CONFIG_SFTP_PASSWORD_DESC="A senha não é armazenada nas opções (banco de dados). Defina-a na página Publicar: o TUF_ED a guarda na pasta privada. Um arquivo de chave continua sendo a melhor escolha."
COM_TUF_ED_CONFIG_SFTP_PASSWORD_LABEL="Senha SFTP"
COM_TUF_ED_CONFIG_SFTP_PATH_DESC="Pasta no servidor SFTP que o servidor web entrega sob a URL pública abaixo, por exemplo /var/www/example.com/tuf ou tuf (relativa à pasta de login). Ela precisa existir."
COM_TUF_ED_CONFIG_SFTP_PATH_LABEL="Pasta remota"
COM_TUF_ED_CONFIG_SFTP_PORT_LABEL="Porta SFTP"
COM_TUF_ED_CONFIG_SFTP_USERNAME_LABEL="Nome de usuário SFTP"
COM_TUF_ED_CONFIG_SIGNING_LABEL="Assinatura de pacotes"
COM_TUF_ED_CONFIG_SITE_LABEL="Site"
COM_TUF_ED_CONFIG_SNAPSHOT_EXPIRY_DESC="Validade de snapshot.json (1–30). Renovado automaticamente com a chave snapshot online quando resta menos da metade."
COM_TUF_ED_CONFIG_SNAPSHOT_EXPIRY_LABEL="Expiração de snapshot (dias)"
COM_TUF_ED_CONFIG_STORAGE_DESC="Caminhos absolutos neste servidor. As duas pastas precisam existir e ter permissão de escrita para o PHP."
COM_TUF_ED_CONFIG_STORAGE_LABEL="Armazenamento"
COM_TUF_ED_CONFIG_TARGETS_EXPIRY_DESC="Validade padrão de uma nova versão de targets.json (7–365). Ela é assinada com a sua chave targets offline, por isso é renovada manualmente; você recebe lembretes 30 e 7 dias antes."
COM_TUF_ED_CONFIG_TARGETS_EXPIRY_LABEL="Expiração de targets (dias)"
COM_TUF_ED_CONFIG_TIMESTAMP_EXPIRY_DESC="Validade de timestamp.json (4–168). Renovado automaticamente pela tarefa horária quando resta menos da metade. Mais curto significa que os clientes percebem antes um repositório congelado; a tarefa horária precisa então rodar de forma confiável."
COM_TUF_ED_CONFIG_TIMESTAMP_EXPIRY_LABEL="Expiração de timestamp (horas)"
COM_TUF_ED_CONFIG_UNINSTALL_DESTROY_DESC="Sim (padrão): desinstalar o TUF_ED destrói as chaves online seladas (snapshot, timestamp), o arquivo secreto que as sela e a senha SFTP armazenada. Depois não é possível recuperá-los: após uma nova instalação você gera novas chaves online e assina uma nova versão de root. Escolha Não somente se for desinstalar para reinstalar em seguida; as chaves então permanecem neste servidor até que você as exclua."
COM_TUF_ED_CONFIG_UNINSTALL_DESTROY_LABEL="Ao desinstalar: destruir as chaves online"
COM_TUF_ED_CORE_UPDATES_AUTOMATED="Atualizações automáticas do núcleo"
COM_TUF_ED_CORE_UPDATES_AUTOMATED_AT_SIGNING="Atualizações automáticas do núcleo ao assinar"
COM_TUF_ED_CORE_UPDATES_HEADING="Atualizações automáticas do Joomla"
COM_TUF_ED_CORE_UPDATES_HELP="Mantenha as atualizações automáticas do núcleo ativadas: um servidor de assinatura com uma vulnerabilidade conhecida do Joomla compromete o que ele assina. O serviço de atualização verifica este site via /api/index.php/v1/joomlaupdate/healthcheck, então esse caminho precisa continuar acessível mesmo enquanto o frontend está offline. Se você atualiza manualmente, registre o motivo e o seu prazo para versões de segurança na declaração de gestão de chaves."
COM_TUF_ED_CORE_UPDATES_JUSTIFIED="Motivo para atualizar manualmente"
COM_TUF_ED_CORE_UPDATES_JUSTIFIED_IN="Na versão %d da declaração de gestão de chaves"
COM_TUF_ED_CORE_UPDATES_NOT_AVAILABLE="O Joomla oferece atualizações automáticas somente com o canal de atualização &quot;Padrão&quot; e a estabilidade mínima &quot;Estável&quot;."
COM_TUF_ED_CORE_UPDATES_OPEN_OPTIONS="Abrir as opções de Atualização do Joomla"
COM_TUF_ED_CORE_UPDATES_PLUGIN="Plugin &quot;Web Services - Joomla Update&quot;"
COM_TUF_ED_CORE_UPDATES_REGISTERED="Registrado no serviço de atualização"
COM_TUF_ED_CORE_UPDATES_WARN_OFF="As atualizações automáticas do núcleo do Joomla estão desativadas, e a declaração de gestão de chaves assinada não informa nenhum motivo para atualizar manualmente. <a href=\"%1$s\">Ative-as</a> (Atualização do Joomla → Opções → Atualizações automáticas) ou registre o motivo e o seu prazo para versões de segurança na <a href=\"%2$s\">declaração de gestão de chaves</a> e assine-a."
COM_TUF_ED_CORE_UPDATES_WARN_PLUGIN="O plugin &quot;Web Services - Joomla Update&quot; está desabilitado. Sem ele o serviço de atualização não consegue alcançar este site (404 em /api/index.php/v1/joomlaupdate/healthcheck), e o registro para atualizações automáticas falha. <a href=\"%s\">Habilite o plugin</a> e depois ative novamente as atualizações automáticas."
COM_TUF_ED_CORE_UPDATES_WARN_UNAVAILABLE="As atualizações automáticas do núcleo do Joomla não são possíveis com as <a href=\"%1$s\">opções de Atualização do Joomla</a> atuais: elas exigem o canal de atualização &quot;Padrão&quot; e a estabilidade mínima &quot;Estável&quot;. Altere essas opções ou registre o motivo para atualizar manualmente na <a href=\"%2$s\">declaração de gestão de chaves</a> e assine-a."
COM_TUF_ED_CORE_UPDATES_WARN_UNREGISTERED="As atualizações automáticas do núcleo do Joomla estão ativadas, mas este site ainda não está registrado no serviço de atualização. Salve novamente as <a href=\"%s\">opções de Atualização do Joomla</a>; se o registro falhar, verifique se /api/index.php/v1/joomlaupdate/healthcheck é acessível pela internet."
