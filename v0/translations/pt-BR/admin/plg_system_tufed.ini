PLG_SYSTEM_TUFED="Sistema - TUF Extension Developer"
PLG_SYSTEM_TUFED_MAIL_EXT_INSTALLED="Uma extensão que não faz parte do Joomla nem do TUF foi instalada.\n\nExtensão: %1$s\nVersão: %2$s\nInstalada por: %3$s\n\nEla roda no mesmo processo PHP que o código de assinatura. As chaves online não são usadas até que ela seja removida ou explicitamente permitida (Configuração → Extensões)."
PLG_SYSTEM_TUFED_MAIL_EXT_SUBJECT="[%s] TUF_ED: extensão instalada ou atualizada"
PLG_SYSTEM_TUFED_MAIL_EXT_UPDATED="Uma extensão que não faz parte do Joomla nem do TUF foi atualizada.\n\nExtensão: %1$s\nVersão: %2$s\nAtualizada por: %3$s\n\nUma permissão termina a cada alteração da extensão: as chaves online não são usadas até que você permita novamente a nova versão (Configuração → Extensões)."
PLG_SYSTEM_TUFED_MAIL_FOOTER="Esta mensagem foi enviada imediatamente pelo plugin de sistema do TUF_ED (plg_system_tufed) a todos os usuários do grupo TUF_ED Owner."
PLG_SYSTEM_TUFED_MAIL_ROLES_CHANGED="As funções do TUF_ED de uma conta mudaram.\n\nConta: %1$s\nAntes: %2$s\nAgora: %3$s\nAlterado por: %4$s\n\nSe você não esperava esta alteração, verifique a conta imediatamente em Usuários → Gerenciar: TUF_ED Owners e TUF_EDC Signers podem assinar pacotes."
PLG_SYSTEM_TUFED_MAIL_ROLES_DELETED="Uma conta com uma função do TUF_ED foi excluída.\n\nConta: %1$s\nFunções: %2$s\nExcluída por: %4$s\n\nVerifique no painel do TUF_ED se cada função ainda tem uma conta utilizável."
PLG_SYSTEM_TUFED_MAIL_ROLES_SUBJECT="[%s] TUF_ED: participação em funções alterada"
PLG_SYSTEM_TUFED_ROLE_CONFLICT="Separação de funções do TUF_ED: a conta &quot;%1$s&quot; teria %2$s. Uma conta pode ter somente uma função do TUF_ED, e um Super Usuário nenhuma. Use uma conta separada (com o seu próprio endereço de e-mail ou alias) para cada função."
PLG_SYSTEM_TUFED_WARN_INTEGRITY="<strong>TUF_ED: a instância não corresponde ao seu estado de referência confirmado</strong> (%1$s). O TUF_ED recusa qualquer manuseio de chaves até que um Owner tenha revisado e confirmado as alterações. <a href=\"%2$s\">Revisar as alterações</a>."
PLG_SYSTEM_TUFED_WARN_NOT_CLEAN="<strong>TUF_ED: esta instância do Joomla não está limpa.</strong> %1$d extensão(ões) não estão permitidas ou foram alteradas desde que foram permitidas: %2$s. Cada extensão roda no mesmo processo PHP que o código de assinatura. <a href=\"%3$s\">Verificar as extensões</a>."
PLG_SYSTEM_TUFED_WARN_OWN_FILES="<strong>TUF_ED: os seus próprios arquivos não passam na verificação</strong> (%1$s). O TUF_ED recusa qualquer manuseio de chaves e a publicação até que isso seja corrigido. <a href=\"%2$s\">Mostrar detalhes</a>."
PLG_SYSTEM_TUFED_WARN_ROLES="<strong>TUF_ED:</strong> a separação de funções não está completa (uma função não tem conta utilizável, ou uma conta tem mais de uma função). <a href=\"%s\">Ver o painel</a>."
PLG_SYSTEM_TUFED_XML_DESCRIPTION="Protege a instância do TUF_ED: recusa salvar uma conta com mais de uma função do TUF_ED ou com uma função e Super Usuário, avisa imediatamente por e-mail os TUF_ED Owners quando uma conta ganha ou perde uma função ou uma extensão é instalada ou atualizada, e mostra os avisos do TUF_ED em todas as páginas da administração. Mantenha-o habilitado."
