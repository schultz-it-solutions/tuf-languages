PLG_TASK_TUFED="Tarefa - TUF Extension Developer"
PLG_TASK_TUFED_ALLOWLIST_DESC="Verifica os arquivos do próprio TUF_ED com a lista de arquivos fixada, recalcula as somas de verificação das extensões permitidas e avisa por e-mail os TUF_ED Owners se os arquivos do TUF_ED não passarem na verificação ou se uma extensão for nova, não permitida ou alterada."
PLG_TASK_TUFED_ALLOWLIST_TITLE="TUF_ED: verificação de extensões"
PLG_TASK_TUFED_DRIFT_DESC="Avisa por e-mail os TUF_ED Owners se uma configuração da etapa de configuração foi revertida, se uma função não tem conta utilizável ou se uma conta tem mais de uma função."
PLG_TASK_TUFED_DRIFT_TITLE="TUF_ED: verificação da configuração"
PLG_TASK_TUFED_EXPIRY_DESC="Avisa por e-mail os TUF_ED Owners 30 e 7 dias antes de root.json ou targets.json expirar, e quando um deles expirou. Também lembra a data de revisão da declaração de gestão de chaves e as chaves ativas que ela não descreve."
PLG_TASK_TUFED_EXPIRY_TITLE="TUF_ED: lembrete de expiração"
PLG_TASK_TUFED_INTEGRITY_DESC="Calcula o hash de cada arquivo da instância Joomla, compara-o com o estado de referência confirmado por um Owner e avisa por e-mail os TUF_ED Owners a cada diferença. O e-mail também lista as pastas excluídas. Executar diariamente."
PLG_TASK_TUFED_INTEGRITY_TITLE="TUF_ED: verificação da instância"
PLG_TASK_TUFED_RENEW_DESC="Executar a cada hora. Assina novos snapshot e timestamp com as chaves online quando resta menos da metade da sua validade ou após uma alteração, e publica o repositório. Para (e avisa por e-mail os TUF_ED Owners) enquanto a instância não estiver limpa."
PLG_TASK_TUFED_RENEW_TITLE="TUF_ED: renovação de snapshot e timestamp"
PLG_TASK_TUFED_XML_DESCRIPTION="Tarefas agendadas do TUF_ED: lembretes de expiração, extensões permitidas, desvios da configuração, verificação da instância e renovação a cada hora de snapshot e timestamp. Os e-mails vão para todos os usuários do TUF_ED Owner."
