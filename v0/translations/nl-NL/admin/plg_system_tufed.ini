PLG_SYSTEM_TUFED="Systeem - TUF Extension Developer"
PLG_SYSTEM_TUFED_MAIL_EXT_INSTALLED="Er is een extensie geïnstalleerd die niet tot Joomla of TUF behoort.\n\nExtensie: %1$s\nVersie: %2$s\nGeïnstalleerd door: %3$s\n\nZe draait in hetzelfde PHP-proces als de ondertekeningscode. Online sleutels worden niet gebruikt totdat ze is verwijderd of uitdrukkelijk is toegestaan (Installatie → Extensies)."
PLG_SYSTEM_TUFED_MAIL_EXT_SUBJECT="[%s] TUF_ED: extensie geïnstalleerd of bijgewerkt"
PLG_SYSTEM_TUFED_MAIL_EXT_UPDATED="Er is een extensie bijgewerkt die niet tot Joomla of TUF behoort.\n\nExtensie: %1$s\nVersie: %2$s\nBijgewerkt door: %3$s\n\nEen toestemming eindigt bij elke wijziging van de extensie: de online sleutels worden niet gebruikt totdat u de nieuwe versie opnieuw toestaat (Installatie → Extensies)."
PLG_SYSTEM_TUFED_MAIL_FOOTER="Dit bericht is direct verzonden door de TUF_ED-systeemplug-in (plg_system_tufed) aan alle gebruikers in de groep TUF_ED Owner."
PLG_SYSTEM_TUFED_MAIL_ROLES_CHANGED="De TUF_ED-rollen van een account zijn gewijzigd.\n\nAccount: %1$s\nVoorheen: %2$s\nNu: %3$s\nGewijzigd door: %4$s\n\nAls u deze wijziging niet verwachtte, controleer het account dan direct onder Gebruikers → Beheren: TUF_ED Owners en TUF_EDC Signers kunnen pakketten ondertekenen."
PLG_SYSTEM_TUFED_MAIL_ROLES_DELETED="Er is een account met een TUF_ED-rol verwijderd.\n\nAccount: %1$s\nRollen: %2$s\nVerwijderd door: %4$s\n\nControleer op het TUF_ED-dashboard of elke rol nog een bruikbaar account heeft."
PLG_SYSTEM_TUFED_MAIL_ROLES_SUBJECT="[%s] TUF_ED: rollidmaatschap gewijzigd"
PLG_SYSTEM_TUFED_ROLE_CONFLICT="TUF_ED-rolscheiding: account &quot;%1$s&quot; zou %2$s hebben. Een account mag maar één TUF_ED-rol hebben, en een Super Gebruiker geen. Gebruik voor elke rol een apart account (met een eigen e-mailadres of alias)."
PLG_SYSTEM_TUFED_WARN_INTEGRITY="<strong>TUF_ED: de instantie komt niet overeen met haar bevestigde referentiestand</strong> (%1$s). TUF_ED weigert elke omgang met sleutels totdat een Owner de wijzigingen heeft gecontroleerd en bevestigd. <a href=\"%2$s\">Wijzigingen controleren</a>."
PLG_SYSTEM_TUFED_WARN_NOT_CLEAN="<strong>TUF_ED: deze Joomla-instantie is niet schoon.</strong> %1$d extensie(s) zijn niet toegestaan of zijn gewijzigd sinds ze werden toegestaan: %2$s. Elke extensie draait in hetzelfde PHP-proces als de ondertekeningscode. <a href=\"%3$s\">Extensies controleren</a>."
PLG_SYSTEM_TUFED_WARN_OWN_FILES="<strong>TUF_ED: de eigen bestanden doorstaan de controle niet</strong> (%1$s). TUF_ED weigert elke omgang met sleutels en het publiceren totdat dit is opgelost. <a href=\"%2$s\">Details tonen</a>."
PLG_SYSTEM_TUFED_WARN_ROLES="<strong>TUF_ED:</strong> de rolscheiding is niet volledig (een rol heeft geen bruikbaar account, of een account heeft meer dan één rol). <a href=\"%s\">Zie het dashboard</a>."
PLG_SYSTEM_TUFED_XML_DESCRIPTION="Beveiligt de TUF_ED-instantie: weigert een account op te slaan met meer dan één TUF_ED-rol of met een rol en Super Gebruiker, mailt de TUF_ED Owners direct wanneer een account een rol krijgt of verliest of wanneer een extensie wordt geïnstalleerd of bijgewerkt, en toont de TUF_ED-waarschuwingen op elke backendpagina. Laat deze ingeschakeld."
