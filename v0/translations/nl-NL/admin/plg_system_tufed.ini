PLG_SYSTEM_TUFED="System - TUF Extension Developer"
PLG_SYSTEM_TUFED_MAIL_EXT_INSTALLED="An extension that is not part of Joomla or TUF was installed.\n\nExtension: %1$s\nVersion: %2$s\nInstalled by: %3$s\n\nIt runs in the same PHP process as the signing code. Online keys are not used until it is removed or explicitly allowed (Setup → Extensions)."
PLG_SYSTEM_TUFED_MAIL_EXT_SUBJECT="[%s] TUF_ED: extension installed or updated"
PLG_SYSTEM_TUFED_MAIL_EXT_UPDATED="An extension that is not part of Joomla or TUF was updated.\n\nExtension: %1$s\nVersion: %2$s\nUpdated by: %3$s\n\nAn allowance ends with every change of the extension: the online keys are not used until you allow the new version again (Setup → Extensions)."
PLG_SYSTEM_TUFED_MAIL_FOOTER="This message was sent at once by the TUF_ED system plugin (plg_system_tufed) to all users in the group TUF_ED Owner."
PLG_SYSTEM_TUFED_MAIL_ROLES_CHANGED="The TUF_ED roles of an account have changed.\n\nAccount: %1$s\nBefore: %2$s\nNow: %3$s\nChanged by: %4$s\n\nIf you did not expect this change, check the account under Users → Manage at once: TUF_ED Owners and TUF_EDC Signers can sign packages."
PLG_SYSTEM_TUFED_MAIL_ROLES_DELETED="An account with a TUF_ED role was deleted.\n\nAccount: %1$s\nRoles: %2$s\nDeleted by: %4$s\n\nCheck on the TUF_ED dashboard that every role still has a usable account."
PLG_SYSTEM_TUFED_MAIL_ROLES_SUBJECT="[%s] TUF_ED: role membership changed"
PLG_SYSTEM_TUFED_ROLE_CONFLICT="TUF_ED role separation: account &quot;%1$s&quot; would hold %2$s. An account may hold only one TUF_ED role, and a Super User none. Use a separate account (with its own email address or alias) for each role."
PLG_SYSTEM_TUFED_WARN_INTEGRITY="<strong>TUF_ED: the instance does not match its confirmed baseline</strong> (%1$s). TUF_ED refuses key handling until an Owner has reviewed and confirmed the changes. <a href=\"%2$s\">Review the changes</a>."
PLG_SYSTEM_TUFED_WARN_NOT_CLEAN="<strong>TUF_ED: this Joomla instance is not clean.</strong> %1$d extension(s) are not allowed or were changed since they were allowed: %2$s. Every extension runs in the same PHP process as the signing code. <a href=\"%3$s\">Check the extensions</a>."
PLG_SYSTEM_TUFED_WARN_OWN_FILES="<strong>TUF_ED: its own files do not pass the check</strong> (%1$s). TUF_ED refuses key handling and publishing until this is fixed. <a href=\"%2$s\">Show details</a>."
PLG_SYSTEM_TUFED_WARN_ROLES="<strong>TUF_ED:</strong> the role separation is not complete (a role has no usable account, or an account holds more than one role). <a href=\"%s\">See the dashboard</a>."
PLG_SYSTEM_TUFED_XML_DESCRIPTION="Guards the TUF_ED instance: refuses to save an account with more than one TUF_ED role or with a role and Super User, mails the TUF_ED Owners at once when an account gains or loses a role or an extension is installed or updated, and shows the TUF_ED warnings on every backend page. Keep it enabled."
