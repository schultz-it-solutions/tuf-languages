COM_TUF_ED_CONFIG_ROOT_LABEL="Root-metadata"
COM_TUF_ED_CONFIG_SFTP_AUTH_DESC="Een sleutel wordt aanbevolen. Gebruik een SFTP-account dat alleen de repositorymap kan bereiken (chroot): elk gepubliceerd bestand is ondertekend, dus dit account kan hooguit updates blokkeren, maar het mag niets anders bereiken."
