COM_TUF_ED_CONFIG_SFTP_HOST_DESC="Hostnaam of IP-adres van de server die de repository levert, bijv. ssh.example.com."
COM_TUF_ED_CONFIG_SFTP_HOST_KEY_DESC="SHA256-vingerafdruk van de hostsleutel van de server, zoals ssh-keygen -lf die toont (SHA256:…). Er wordt niets verzonden naar een server met een andere sleutel. Laat dit eerst leeg: Publiceren → Hostsleutel tonen toont wat de server presenteert; vergelijk die met de vingerafdruk die uw hostingprovider opgeeft voordat u deze invult."
COM_TUF_ED_CONFIG_SFTP_HOST_KEY_LABEL="Vingerafdruk van de hostsleutel"
COM_TUF_ED_CONFIG_SFTP_HOST_LABEL="SFTP-host"
COM_TUF_ED_CONFIG_SFTP_KEY_FILE_DESC="Privé OpenSSH-sleutel zonder wachtwoordzin (nodig voor de vernieuwing elk uur), bijv. aangemaakt met ssh-keygen -t ed25519 -N '' -f sftp_ed25519. Een losse bestandsnaam wordt in de privémap gezocht; een absoluut pad moet buiten de webroot liggen. Rechten 0600."
COM_TUF_ED_CONFIG_SFTP_KEY_FILE_LABEL="Privésleutelbestand"
COM_TUF_ED_CONFIG_SFTP_PASSWORD_DESC="Het wachtwoord wordt niet in de opties (database) opgeslagen. Stel het in op de pagina Publiceren: TUF_ED bewaart het in de privémap. Een sleutelbestand blijft de betere keuze."
COM_TUF_ED_CONFIG_SFTP_PASSWORD_LABEL="SFTP-wachtwoord"
COM_TUF_ED_CONFIG_SFTP_PATH_DESC="Map op de SFTP-server die de webserver onder de openbare URL hieronder levert, bijv. /var/www/example.com/tuf of tuf (relatief ten opzichte van de inlogmap). Deze moet bestaan."
COM_TUF_ED_CONFIG_SFTP_PATH_LABEL="Externe map"
COM_TUF_ED_CONFIG_SFTP_PORT_LABEL="SFTP-poort"
COM_TUF_ED_CONFIG_SFTP_USERNAME_LABEL="SFTP-gebruikersnaam"
COM_TUF_ED_CONFIG_SIGNING_LABEL="Pakketondertekening"
COM_TUF_ED_CONFIG_SITE_LABEL="Site"
COM_TUF_ED_CONFIG_SNAPSHOT_EXPIRY_DESC="Geldigheid van snapshot.json (1–30). Wordt automatisch vernieuwd met de online snapshot-sleutel wanneer minder dan de helft over is."
COM_TUF_ED_CONFIG_SNAPSHOT_EXPIRY_LABEL="Verloop van snapshot (dagen)"
COM_TUF_ED_CONFIG_STORAGE_DESC="Absolute paden op deze server. Beide mappen moeten bestaan en voor PHP schrijfbaar zijn."
COM_TUF_ED_CONFIG_STORAGE_LABEL="Opslag"
COM_TUF_ED_CONFIG_TARGETS_EXPIRY_DESC="Standaardgeldigheid van een nieuwe targets.json-versie (7–365). Deze wordt ondertekend met uw offline targets-sleutel en dus handmatig vernieuwd; u krijgt 30 en 7 dagen vooraf herinneringen."
COM_TUF_ED_CONFIG_TARGETS_EXPIRY_LABEL="Verloop van targets (dagen)"
COM_TUF_ED_CONFIG_TIMESTAMP_EXPIRY_DESC="Geldigheid van timestamp.json (4–168). Wordt automatisch vernieuwd door de taak die elk uur draait wanneer minder dan de helft over is. Korter betekent dat clients een bevroren repository eerder opmerken; de uurlijkse taak moet dan betrouwbaar draaien."
COM_TUF_ED_CONFIG_TIMESTAMP_EXPIRY_LABEL="Verloop van timestamp (uren)"
COM_TUF_ED_CONFIG_UNINSTALL_DESTROY_DESC="Ja (standaard): bij het verwijderen van TUF_ED worden de verzegelde online sleutels (snapshot, timestamp), het geheime bestand dat ze verzegelt en het opgeslagen SFTP-wachtwoord vernietigd. Ze kunnen daarna niet worden hersteld: na een nieuwe installatie maakt u nieuwe online sleutels aan en ondertekent u een nieuwe root-versie. Kies Nee alleen als u verwijdert om meteen opnieuw te installeren; de sleutels blijven dan op deze server totdat u ze verwijdert."
COM_TUF_ED_CONFIG_UNINSTALL_DESTROY_LABEL="Bij verwijderen: online sleutels vernietigen"
COM_TUF_ED_CORE_UPDATES_AUTOMATED="Automatische core-updates"
COM_TUF_ED_CORE_UPDATES_AUTOMATED_AT_SIGNING="Automatische core-updates bij ondertekening"
COM_TUF_ED_CORE_UPDATES_HEADING="Automatische Joomla-updates"
COM_TUF_ED_CORE_UPDATES_HELP="Laat de automatische core-updates aan: een ondertekeningsserver met een bekende Joomla-kwetsbaarheid ondermijnt wat hij ondertekent. De updateservice controleert deze site via /api/index.php/v1/joomlaupdate/healthcheck, dus dat pad moet bereikbaar blijven, ook terwijl de frontend offline is. Als u handmatig bijwerkt, leg dan de reden en uw termijn voor beveiligingsreleases vast in de sleutelbeheerverklaring."
COM_TUF_ED_CORE_UPDATES_JUSTIFIED="Reden voor handmatig bijwerken"
COM_TUF_ED_CORE_UPDATES_JUSTIFIED_IN="In versie %d van de sleutelbeheerverklaring"
COM_TUF_ED_CORE_UPDATES_NOT_AVAILABLE="Joomla biedt automatische updates alleen aan met updatekanaal &quot;Standaard&quot; en minimale stabiliteit &quot;Stabiel&quot;."
COM_TUF_ED_CORE_UPDATES_OPEN_OPTIONS="De opties van Joomla bijwerken openen"
COM_TUF_ED_CORE_UPDATES_PLUGIN="Plug-in &quot;Web Services - Joomla Update&quot;"
COM_TUF_ED_CORE_UPDATES_REGISTERED="Geregistreerd bij de updateservice"
COM_TUF_ED_CORE_UPDATES_WARN_OFF="De automatische Joomla-core-updates staan uit, en de ondertekende sleutelbeheerverklaring geeft geen reden voor handmatig bijwerken. <a href=\"%1$s\">Zet ze aan</a> (Joomla bijwerken → Opties → Automatische updates), of leg de reden en uw termijn voor beveiligingsreleases vast in de <a href=\"%2$s\">sleutelbeheerverklaring</a> en onderteken die."
COM_TUF_ED_CORE_UPDATES_WARN_PLUGIN="De plug-in &quot;Web Services - Joomla Update&quot; is uitgeschakeld. Zonder deze plug-in kan de updateservice deze site niet bereiken (404 op /api/index.php/v1/joomlaupdate/healthcheck), en mislukt de registratie voor automatische updates. <a href=\"%s\">Schakel de plug-in in</a> en zet daarna de automatische updates weer aan."
COM_TUF_ED_CORE_UPDATES_WARN_UNAVAILABLE="Automatische Joomla-core-updates zijn niet mogelijk met de huidige <a href=\"%1$s\">opties van Joomla bijwerken</a>: ze vereisen updatekanaal &quot;Standaard&quot; en minimale stabiliteit &quot;Stabiel&quot;. Wijzig deze opties, of leg de reden voor handmatig bijwerken vast in de <a href=\"%2$s\">sleutelbeheerverklaring</a> en onderteken die."
COM_TUF_ED_CORE_UPDATES_WARN_UNREGISTERED="De automatische Joomla-core-updates staan aan, maar deze site is nog niet geregistreerd bij de updateservice. Sla de <a href=\"%s\">opties van Joomla bijwerken</a> opnieuw op; als de registratie mislukt, controleer dan of /api/index.php/v1/joomlaupdate/healthcheck vanaf internet bereikbaar is."
