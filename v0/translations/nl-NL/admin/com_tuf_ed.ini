COM_TUF_ED_MAIL_INTEGRITY_BODY="De dagelijkse controle van de instantie heeft afwijkingen gevonden ten opzichte van de referentiestand die een Owner heeft bevestigd:\n\n%1$s\n\nUitgesloten mappen (niet gehasht; uitvoerbare bestanden erin worden gemeld):\n\n%2$s\n\nDe controle heeft %3$s gehasht\n\nTUF_ED weigert elke omgang met sleutels totdat een Owner de wijzigingen heeft gecontroleerd en bevestigd; de uurlijkse vernieuwing gaat door. Als een wijziging niet afkomstig is van een update of een configuratiewijziging die u kent, beschouw de instantie dan als gecompromitteerd en onderteken er niets op. Controleer de wijzigingen onder Componenten → TUF Extension Developer → Integriteit."
