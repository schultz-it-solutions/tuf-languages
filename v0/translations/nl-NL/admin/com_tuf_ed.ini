COM_TUF_ED_INTEGRITY_INTRO="Elk bestand van deze Joomla-instantie wordt gehasht en vergeleken met de referentiestand die een Owner heeft bevestigd. Mappen waarin Joomla tijdens de uitvoering schrijft, worden niet gehasht, maar uitvoerbare bestanden erin worden wel gemeld (behalve PHP-bestanden die geen code kunnen uitvoeren, zoals de cache-items en logbestanden van Joomla). Na een installatiegebeurtenis of een wijziging van de Algemene instellingen blijven de wijzigingen openstaan totdat een Owner ze controleert en bevestigt. Tot die tijd weigert TUF_ED elke omgang met sleutels; de vernieuwing van snapshot en timestamp elk uur gaat door. Dit is een struikeldraad: wie als webservergebruiker code kan uitvoeren, kan de bestanden, de referentiestand en deze controle wijzigen. Code buiten bestanden (in de database, buiten de Joomla-map, in de opcodecache) valt hier niet onder."
