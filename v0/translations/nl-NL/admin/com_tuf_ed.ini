COM_TUF_ED_KEYS_GENERATE_DOWNLOAD="Het sleutelbestand wordt gedownload zodra u op de knop klikt, en alleen dan: het wordt niet op de server opgeslagen en kan dus niet opnieuw worden gedownload. Bewaar het veilig, ga daarna naar de sleutellijst en bevestig de nieuwe sleutel door het bestand één keer te uploaden. Tot die tijd wordt de sleutel niet gebruikt. Een sleutel die niet binnen 24 uur wordt bevestigd, wordt verwijderd."
COM_TUF_ED_KEYS_GENERATE_INTRO="Er wordt op deze server een nieuw Ed25519-sleutelpaar aangemaakt (ondertekenen in de component). Uw browser downloadt de privésleutel meteen, als bestand dat is versleuteld met de wachtwoordzin die u hier invoert; er blijft geen kopie op de server. De site bewaart alleen de publieke sleutel. Om te ondertekenen uploadt u dat bestand opnieuw. Voor de sterkste bescherming bewaart u uw root-sleutel in plaats daarvan offline: maak hem aan op uw eigen computer en gebruik Offline sleutel registreren."
