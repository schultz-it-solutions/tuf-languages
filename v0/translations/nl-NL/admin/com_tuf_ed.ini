COM_TUF_ED_MAIL_CORE_UPDATES_UNREGISTERED="De automatische core-updates staan aan, maar deze site is nog niet geregistreerd bij de updateservice. Sla de opties van Joomla bijwerken opnieuw op; als de registratie mislukt, controleer dan of /api/index.php/v1/joomlaupdate/healthcheck vanaf internet bereikbaar is."
COM_TUF_ED_MAIL_DRIFT_BODY="Aan deze controles van de TUF_ED-installatiestap wordt niet meer voldaan:\n\n%s\n\nAls u dit niet zelf hebt gewijzigd, zoek dan uit wie het was. Open Componenten → TUF Extension Developer → Installatie om de instellingen te herstellen."
