COM_TUF_ED_CONFIG_PRIVATE_PATH_LABEL="Privémap"
COM_TUF_ED_CONFIG_PUBLISH_METHOD_DESC="Waar de openbare TUF-repository wordt geschreven: een map op deze server, of via SFTP een map op een andere server (bijv. de server van uw hoofdwebsite)."
