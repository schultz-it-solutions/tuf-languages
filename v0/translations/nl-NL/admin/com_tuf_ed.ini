COM_TUF_ED_CONFIG_PUBLISH_PATH_DESC="Waar de openbare TUF-repository als statische bestanden wordt geschreven: een map van uw hoofdwebsite, of een nieuwe map onder de webroot van deze site (geen Joomla-map). De webserver levert deze bestanden rechtstreeks, ook terwijl deze site offline is."
COM_TUF_ED_CONFIG_PUBLISH_PATH_LABEL="Publicatiemap"
COM_TUF_ED_CONFIG_PUBLISH_URL_DESC="https://…-adres waarop de publicatiemap bereikbaar is. Updateclients halen daar timestamp.json, de geversioneerde metadata en, indien gepubliceerd, de pakketten op."
COM_TUF_ED_CONFIG_PUBLISH_URL_LABEL="Openbare URL van de publicatiemap"
COM_TUF_ED_CONFIG_REQUEST_LIFETIME_DESC="Hoe lang een voorbereid ondertekeningsverzoek kan worden ondertekend (1–30). Het wordt bovendien onbruikbaar zodra datgene waarop het is gebaseerd verandert."
COM_TUF_ED_CONFIG_REQUEST_LIFETIME_LABEL="Geldigheid van ondertekeningsverzoeken (dagen)"
COM_TUF_ED_CONFIG_ROOT_EXPIRY_DESC="Standaardgeldigheid van een nieuwe root.json-versie. Clients weigeren een verlopen root, onderteken dus ruim voor deze datum een nieuwe versie."
