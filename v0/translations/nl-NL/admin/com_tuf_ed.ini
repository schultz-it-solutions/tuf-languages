COM_TUF_ED_KMS_INTRO="Beschrijf hoe u elk van uw sleutels bewaart en hanteert. Sla het concept zo vaak op als u wilt; het mag onvolledig blijven. Als het volledig is, ondertekent u het met uw root-sleutel: de ondertekende versie is uw gedocumenteerde proces en later wat een TUF Intermediary beoordeelt voordat hij uw root-sleutel bevestigt. <strong>De verklaring vermeldt waar uw sleutels zijn, dus ze is vertrouwelijk:</strong> alleen gebruikers die root-metadata mogen ondertekenen, kunnen haar zien. Beschrijf plaatsen en procedures, nooit wachtwoorden, wachtwoordzinnen, pincodes of kluiscombinaties."
