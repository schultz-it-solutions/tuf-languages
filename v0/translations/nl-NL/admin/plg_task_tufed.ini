PLG_TASK_TUFED="Taak - TUF Extension Developer"
PLG_TASK_TUFED_ALLOWLIST_DESC="Controleert de eigen bestanden van TUF_ED aan de hand van de vastgezette bestandslijst, berekent de controlesommen van toegestane extensies opnieuw en mailt de TUF_ED Owners als de bestanden van TUF_ED de controle niet doorstaan of als een extensie nieuw, niet toegestaan of gewijzigd is."
PLG_TASK_TUFED_ALLOWLIST_TITLE="TUF_ED: extensiecontrole"
PLG_TASK_TUFED_DRIFT_DESC="Mailt de TUF_ED Owners als een instelling van de installatiestap is teruggedraaid, als een rol geen bruikbaar account heeft of als een account meer dan één rol heeft."
PLG_TASK_TUFED_DRIFT_TITLE="TUF_ED: installatiecontrole"
PLG_TASK_TUFED_EXPIRY_DESC="Mailt de TUF_ED Owners 30 en 7 dagen voordat root.json of targets.json verloopt, en wanneer een ervan is verlopen. Herinnert ook aan de herzieningsdatum van de sleutelbeheerverklaring en aan actieve sleutels die ze niet beschrijft."
PLG_TASK_TUFED_EXPIRY_TITLE="TUF_ED: verloopherinnering"
PLG_TASK_TUFED_INTEGRITY_DESC="Hasht elk bestand van de Joomla-instantie, vergelijkt het met de referentiestand die een Owner heeft bevestigd en mailt de TUF_ED Owners bij elke afwijking. De mail vermeldt ook de uitgesloten mappen. Dagelijks uitvoeren."
PLG_TASK_TUFED_INTEGRITY_TITLE="TUF_ED: instantiecontrole"
PLG_TASK_TUFED_RENEW_DESC="Elk uur uitvoeren. Ondertekent met de online sleutels een nieuwe snapshot en timestamp wanneer minder dan de helft van hun geldigheid over is of na een wijziging, en publiceert de repository. Stopt (en mailt de TUF_ED Owners) zolang de instantie niet schoon is."
PLG_TASK_TUFED_RENEW_TITLE="TUF_ED: vernieuwing van snapshot en timestamp"
PLG_TASK_TUFED_XML_DESCRIPTION="Geplande taken voor TUF_ED: verloopherinneringen, toegestane extensies, afwijkingen van de installatie, de instantiecontrole en de uurlijkse vernieuwing van snapshot en timestamp. E-mails gaan naar alle gebruikers in TUF_ED Owner."
