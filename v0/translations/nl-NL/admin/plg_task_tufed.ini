PLG_TASK_TUFED="Task - TUF Extension Developer"
PLG_TASK_TUFED_ALLOWLIST_DESC="Checks TUF_ED's own files against the pinned file list, recomputes the checksums of allowed extensions, and emails the TUF_ED Owners if TUF_ED's files fail the check or an extension is new, not allowed or changed."
PLG_TASK_TUFED_ALLOWLIST_TITLE="TUF_ED: extension check"
PLG_TASK_TUFED_DRIFT_DESC="Emails the TUF_ED Owners if a setting of the setup step was changed back, if a role has no usable account, or if an account holds more than one role."
PLG_TASK_TUFED_DRIFT_TITLE="TUF_ED: setup check"
PLG_TASK_TUFED_EXPIRY_DESC="Emails the TUF_ED Owners 30 and 7 days before root.json or targets.json expires, and when one has expired. Also reminds of the review date of the key management statement and of active keys it does not describe."
PLG_TASK_TUFED_EXPIRY_TITLE="TUF_ED: expiry reminder"
PLG_TASK_TUFED_INTEGRITY_DESC="Hashes every file of the Joomla instance, compares it with the baseline an Owner confirmed, and emails the TUF_ED Owners on any difference. The mail also lists the excluded folders. Run daily."
PLG_TASK_TUFED_INTEGRITY_TITLE="TUF_ED: instance check"
PLG_TASK_TUFED_RENEW_DESC="Run hourly. Signs a new snapshot and timestamp with the online keys when less than half of their lifetime is left or after a change, and publishes the repository. Stops (and emails the TUF_ED Owners) while the instance is not clean."
PLG_TASK_TUFED_RENEW_TITLE="TUF_ED: snapshot and timestamp renewal"
PLG_TASK_TUFED_XML_DESCRIPTION="Scheduled tasks for TUF_ED: expiry reminders, allowed extensions, setup drift, the instance check, and the hourly renewal of snapshot and timestamp. Emails go to all users in TUF_ED Owner."
