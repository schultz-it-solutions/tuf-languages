COM_TUF_ED_CORE_UPDATES_REGISTERED="Registrado en el servicio de actualización"
COM_TUF_ED_CORE_UPDATES_WARN_OFF="Las actualizaciones automáticas del núcleo de Joomla están desactivadas y la declaración de gestión de claves firmada no indica ningún motivo para actualizar manualmente. <a href=\"%1$s\">Actívelas</a> (Actualizar Joomla → Opciones → Actualizaciones automáticas), o registre el motivo y su plazo para las versiones de seguridad en la <a href=\"%2$s\">declaración de gestión de claves</a> y fírmela."
COM_TUF_ED_CORE_UPDATES_WARN_PLUGIN="El plugin &quot;Web Services - Joomla Update&quot; está deshabilitado. Sin él, el servicio de actualización no puede llegar a este sitio (404 en /api/index.php/v1/joomlaupdate/healthcheck) y el registro para actualizaciones automáticas falla. <a href=\"%s\">Habilite el plugin</a> y después vuelva a activar las actualizaciones automáticas."
COM_TUF_ED_CORE_UPDATES_WARN_UNAVAILABLE="Las actualizaciones automáticas del núcleo de Joomla no son posibles con las <a href=\"%1$s\">opciones de Actualizar Joomla</a> actuales: requieren el canal de actualización &quot;Predeterminado&quot; y la estabilidad mínima &quot;Estable&quot;. Cambie estas opciones, o registre el motivo para actualizar manualmente en la <a href=\"%2$s\">declaración de gestión de claves</a> y fírmela."
COM_TUF_ED_CORE_UPDATES_WARN_UNREGISTERED="Las actualizaciones automáticas del núcleo de Joomla están activadas, pero este sitio aún no está registrado en el servicio de actualización. Vuelva a guardar las <a href=\"%s\">opciones de Actualizar Joomla</a>; si el registro falla, compruebe que /api/index.php/v1/joomlaupdate/healthcheck es accesible desde Internet."
