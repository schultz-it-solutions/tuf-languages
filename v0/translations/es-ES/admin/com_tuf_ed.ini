COM_TUF_ED_SETUP_CHECK_CLEAN_INSTANCE="Instancia limpia"
COM_TUF_ED_SETUP_CHECK_CLEAN_INSTANCE_DESC="Comprueba los archivos propios de TUF_ED con la lista de archivos de la versión instalada y enumera todas las extensiones que no pertenecen al núcleo de Joomla ni a TUF ni están permitidas expresamente. Elimínelas, use una instancia de Joomla aparte para TUF_ED o permita unas pocas con un motivo válido."
COM_TUF_ED_SETUP_CHECK_GLOBAL_CONFIG="Configuración global"
COM_TUF_ED_SETUP_CHECK_GLOBAL_CONFIG_DESC="Se comprueba aquí y se cambia manualmente: frontend fuera de línea con un mensaje neutro, sin indexación por buscadores, HTTPS en todo el sitio, sesiones cortas, sin salida de depuración."
COM_TUF_ED_SETUP_CHECK_GROUPS="Grupos de usuarios de TUF_ED"
COM_TUF_ED_SETUP_CHECK_GROUPS_DESC="Crea TUF_ED Owner (claves, firma de root), TUF_EDC Signer (firma de paquetes) y TUF_ED Auditor (solo lectura) directamente bajo Public."
COM_TUF_ED_SETUP_CHECK_INTEGRITY="Estado de referencia de la instancia"
COM_TUF_ED_SETUP_CHECK_INTEGRITY_DESC="Se comprueba aquí y lo confirma un Owner en la página Integridad: el SHA-256 de cada archivo de esta instancia de Joomla, comparado con el estado de referencia que confirmó un Owner. Se rechaza cualquier manejo de claves hasta que exista un estado de referencia y la instancia coincida con él."
COM_TUF_ED_SETUP_CHECK_LEGACY_GROUPS="Eliminar los grupos estándar"
COM_TUF_ED_SETUP_CHECK_LEGACY_GROUPS_DESC="Elimina Author, Editor, Publisher, Manager y Administrator. Public, Guest, Registered y Super Users se mantienen, porque Joomla los necesita."
COM_TUF_ED_SETUP_CHECK_LEGACY_USERS="Usuarios en grupos estándar"
COM_TUF_ED_SETUP_CHECK_LEGACY_USERS_DESC="Quita a los usuarios de Author, Editor, Publisher, Manager y Administrator. Un usuario que se queda sin ningún grupo se mueve a Registered y se bloquea (puede desbloquearlo en Usuarios). Usted nunca queda bloqueado."
COM_TUF_ED_SETUP_CHECK_PERMISSIONS="Permisos"
COM_TUF_ED_SETUP_CHECK_PERMISSIONS_DESC="Establece los permisos globales y los de TUF_ED para los nuevos grupos. Los Superusuarios conservan siempre todos los derechos."
COM_TUF_ED_SETUP_CHECK_PLUGINS_OFF="Plugins de acceso remoto"
COM_TUF_ED_SETUP_CHECK_PLUGINS_OFF_DESC="Deshabilita los plugins Web Services (API) y Autenticación API, la instalación de extensiones desde la web o desde una URL y el plugin Sistema - Depuración. No Web Services - Joomla Update: las actualizaciones automáticas de Joomla lo necesitan (vea el panel de control)."
COM_TUF_ED_SETUP_CHECK_PLUGINS_ON="Plugins de seguridad"
COM_TUF_ED_SETUP_CHECK_PLUGINS_ON_DESC="Habilita Cabeceras HTTP, Registro de acciones de usuario y los plugins de TUF_ED (tareas programadas, separación de roles)."
COM_TUF_ED_SETUP_CHECK_SCHEDULER_CRON="Ejecución de tareas (cron)"
COM_TUF_ED_SETUP_CHECK_SCHEDULER_CRON_DESC="Se comprueba aquí y se cambia manualmente: el frontend de este sitio está fuera de línea, por lo que el planificador perezoso (que ejecuta tareas en las visitas a páginas) no es fiable. Desactívelo y ejecute las tareas desde un cron en el servidor."
COM_TUF_ED_SETUP_CHECK_SCHEDULER_TASKS="Tareas programadas"
COM_TUF_ED_SETUP_CHECK_SCHEDULER_TASKS_DESC="Crea las tareas de TUF_ED: recordatorio diario de caducidad, comprobación de extensiones, comprobación de configuración y de instancia, y la renovación horaria de snapshot y timestamp. Los correos van a todos los usuarios de TUF_ED Owner."
COM_TUF_ED_SETUP_CHECK_STORAGE="Carpetas de almacenamiento"
COM_TUF_ED_SETUP_CHECK_STORAGE_DESC="Se comprueba aquí y se establece en Opciones → Almacenamiento: una carpeta privada fuera de la raíz web (secreto de las claves en línea, paquetes subidos) y una carpeta de publicación para el repositorio TUF público y estático. Solo se necesita cuando firme paquetes."
COM_TUF_ED_SETUP_CHECK_USERS_CONFIG="Opciones de usuarios"
COM_TUF_ED_SETUP_CHECK_USERS_CONFIG_DESC="Desactiva el autorregistro, impone la autenticación multifactor a los grupos de TUF_ED y a los Superusuarios y fija la longitud mínima de la contraseña en 16."
