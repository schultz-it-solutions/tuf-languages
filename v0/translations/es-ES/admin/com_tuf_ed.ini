COM_TUF_ED_CORE_UPDATES_HELP="Mantenga activadas las actualizaciones automáticas del núcleo: un servidor de firma con una vulnerabilidad conocida de Joomla socava lo que firma. El servicio de actualización comprueba este sitio mediante /api/index.php/v1/joomlaupdate/healthcheck, por lo que esa ruta debe seguir accesible incluso mientras el frontend está fuera de línea. Si actualiza manualmente, registre el motivo y su plazo para las versiones de seguridad en la declaración de gestión de claves."
COM_TUF_ED_CORE_UPDATES_JUSTIFIED="Motivo para actualizar manualmente"
COM_TUF_ED_CORE_UPDATES_JUSTIFIED_IN="En la versión %d de la declaración de gestión de claves"
COM_TUF_ED_CORE_UPDATES_NOT_AVAILABLE="Joomla solo ofrece actualizaciones automáticas con el canal de actualización &quot;Predeterminado&quot; y la estabilidad mínima &quot;Estable&quot;."
COM_TUF_ED_CORE_UPDATES_OPEN_OPTIONS="Abrir las opciones de Actualizar Joomla"
