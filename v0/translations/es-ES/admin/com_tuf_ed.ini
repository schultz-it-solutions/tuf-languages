COM_TUF_ED_INTEGRITY_INTRO="Se calcula el hash de cada archivo de esta instancia de Joomla y se compara con el estado de referencia que confirmó un Owner. No se calcula el hash de las carpetas en las que Joomla escribe en tiempo de ejecución, pero se informa de los archivos ejecutables que contienen (excepto los archivos PHP que no pueden ejecutar código, como las entradas de caché y los archivos de registro de Joomla). Tras un evento del instalador o un cambio de la Configuración global, los cambios quedan pendientes hasta que un Owner los revise y confirme. Hasta entonces TUF_ED rechaza cualquier manejo de claves; la renovación horaria de snapshot y timestamp continúa. Esto es un cable trampa: quien pueda ejecutar código como el usuario del servidor web puede cambiar los archivos, el estado de referencia y esta comprobación. El código fuera de los archivos (en la base de datos, fuera de la carpeta de Joomla, en la caché de opcodes) no está cubierto."
