COM_TUF_ED_CONFIG_MAIN_WEBSITE_LABEL="Sitio web principal"
COM_TUF_ED_CONFIG_PRIVATE_PATH_DESC="Fuera de la raíz web, p. ej. /home/user/tuf_ed_private. Contiene el secreto que sella las claves en línea snapshot y timestamp, y los paquetes subidos. Inclúyala en sus copias de seguridad, pero guarde esas copias por separado de las copias de la base de datos: el secreto y la base de datos juntos abren las claves en línea."
COM_TUF_ED_CONFIG_PRIVATE_PATH_LABEL="Carpeta privada"
COM_TUF_ED_CONFIG_PUBLISH_METHOD_DESC="Dónde se escribe el repositorio TUF público: una carpeta en este servidor o una carpeta en otro servidor mediante SFTP (p. ej. el servidor de su sitio web principal)."
COM_TUF_ED_CONFIG_PUBLISH_METHOD_LABEL="Método de publicación"
COM_TUF_ED_CONFIG_PUBLISH_METHOD_LOCAL="Carpeta en este servidor"
COM_TUF_ED_CONFIG_PUBLISH_METHOD_SFTP="SFTP a otro servidor"
COM_TUF_ED_CONFIG_PUBLISH_PACKAGES_DESC="Copiar también los paquetes firmados en la carpeta de publicación, como targets/&lt;sha256&gt;.&lt;name&gt;. Déjelo desactivado si entrega los paquetes desde su servidor de actualizaciones existente."
COM_TUF_ED_CONFIG_PUBLISH_PACKAGES_LABEL="Publicar paquetes"
COM_TUF_ED_CONFIG_PUBLISH_PATH_DESC="Dónde se escribe el repositorio TUF público como archivos estáticos: una carpeta de su sitio web principal o una carpeta nueva bajo la raíz web de este sitio (no una carpeta de Joomla). El servidor web entrega estos archivos directamente, incluso mientras este sitio está fuera de línea."
COM_TUF_ED_CONFIG_PUBLISH_PATH_LABEL="Carpeta de publicación"
COM_TUF_ED_CONFIG_PUBLISH_URL_DESC="Dirección https://… en la que se puede acceder a la carpeta de publicación. Los clientes de actualización obtienen de ahí timestamp.json, los metadatos con versión y, si se publican, los paquetes."
COM_TUF_ED_CONFIG_PUBLISH_URL_LABEL="URL pública de la carpeta de publicación"
COM_TUF_ED_CONFIG_REQUEST_LIFETIME_DESC="Durante cuánto tiempo se puede firmar una solicitud de firma preparada (1–30). Además deja de ser utilizable en cuanto cambia aquello en lo que se basa."
COM_TUF_ED_CONFIG_REQUEST_LIFETIME_LABEL="Vigencia de la solicitud de firma (días)"
COM_TUF_ED_CONFIG_ROOT_EXPIRY_DESC="Vigencia predeterminada de una nueva versión de root.json. Los clientes rechazan una root caducada, así que firme una nueva versión con suficiente antelación a esta fecha."
COM_TUF_ED_CONFIG_ROOT_EXPIRY_LABEL="Caducidad de root (días)"
COM_TUF_ED_CONFIG_ROOT_LABEL="Metadatos root"
COM_TUF_ED_CONFIG_SFTP_AUTH_DESC="Se recomienda una clave. Use una cuenta SFTP que solo pueda acceder a la carpeta del repositorio (chroot): cada archivo publicado está firmado, por lo que esta cuenta como mucho puede bloquear las actualizaciones, pero no debe poder acceder a nada más."
COM_TUF_ED_CONFIG_SFTP_AUTH_KEY="Archivo de clave privada"
COM_TUF_ED_CONFIG_SFTP_AUTH_LABEL="Iniciar sesión con"
COM_TUF_ED_CONFIG_SFTP_AUTH_PASSWORD="Contraseña"
COM_TUF_ED_CONFIG_SFTP_HOST_DESC="Nombre de host o dirección IP del servidor que entrega el repositorio, p. ej. ssh.example.com."
COM_TUF_ED_CONFIG_SFTP_HOST_KEY_DESC="Huella SHA256 de la clave de host del servidor, tal como la muestra ssh-keygen -lf (SHA256:…). No se envía nada a un servidor con otra clave. Déjelo vacío al principio: Publicar → Mostrar clave de host muestra lo que presenta el servidor; compárela con la huella que indica su proveedor de alojamiento antes de introducirla."
COM_TUF_ED_CONFIG_SFTP_HOST_KEY_LABEL="Huella de la clave de host"
COM_TUF_ED_CONFIG_SFTP_HOST_LABEL="Host SFTP"
COM_TUF_ED_CONFIG_SFTP_KEY_FILE_DESC="Clave privada OpenSSH sin frase de contraseña (necesaria para la renovación horaria), creada p. ej. con ssh-keygen -t ed25519 -N '' -f sftp_ed25519. Un nombre de archivo solo se busca en la carpeta privada; una ruta absoluta debe estar fuera de la raíz web. Permisos 0600."
COM_TUF_ED_CONFIG_SFTP_KEY_FILE_LABEL="Archivo de clave privada"
COM_TUF_ED_CONFIG_SFTP_PASSWORD_DESC="La contraseña no se guarda en las opciones (base de datos). Establézcala en la página Publicar: TUF_ED la guarda en la carpeta privada. Un archivo de clave sigue siendo la mejor opción."
COM_TUF_ED_CONFIG_SFTP_PASSWORD_LABEL="Contraseña SFTP"
COM_TUF_ED_CONFIG_SFTP_PATH_DESC="Carpeta del servidor SFTP que el servidor web entrega en la URL pública de abajo, p. ej. /var/www/example.com/tuf o tuf (relativa a la carpeta de inicio de sesión). Debe existir."
COM_TUF_ED_CONFIG_SFTP_PATH_LABEL="Carpeta remota"
COM_TUF_ED_CONFIG_SFTP_PORT_LABEL="Puerto SFTP"
COM_TUF_ED_CONFIG_SFTP_USERNAME_LABEL="Nombre de usuario SFTP"
COM_TUF_ED_CONFIG_SIGNING_LABEL="Firma de paquetes"
COM_TUF_ED_CONFIG_SITE_LABEL="Sitio"
COM_TUF_ED_CONFIG_SNAPSHOT_EXPIRY_DESC="Vigencia de snapshot.json (1–30). Se renueva automáticamente con la clave snapshot en línea cuando queda menos de la mitad."
COM_TUF_ED_CONFIG_SNAPSHOT_EXPIRY_LABEL="Caducidad de snapshot (días)"
COM_TUF_ED_CONFIG_STORAGE_DESC="Rutas absolutas en este servidor. Ambas carpetas deben existir y PHP debe poder escribir en ellas."
COM_TUF_ED_CONFIG_STORAGE_LABEL="Almacenamiento"
COM_TUF_ED_CONFIG_TARGETS_EXPIRY_DESC="Vigencia predeterminada de una nueva versión de targets.json (7–365). Se firma con su clave targets fuera de línea, por lo que se renueva manualmente; recibe recordatorios 30 y 7 días antes."
COM_TUF_ED_CONFIG_TARGETS_EXPIRY_LABEL="Caducidad de targets (días)"
COM_TUF_ED_CONFIG_TIMESTAMP_EXPIRY_DESC="Vigencia de timestamp.json (4–168). La tarea horaria lo renueva automáticamente cuando queda menos de la mitad. Más corta significa que los clientes notan antes un repositorio congelado; la tarea horaria debe entonces ejecutarse de forma fiable."
COM_TUF_ED_CONFIG_TIMESTAMP_EXPIRY_LABEL="Caducidad de timestamp (horas)"
COM_TUF_ED_CONFIG_UNINSTALL_DESTROY_DESC="Sí (predeterminado): al desinstalar TUF_ED se destruyen las claves en línea selladas (snapshot, timestamp), el archivo secreto que las sella y la contraseña SFTP guardada. Después no se pueden recuperar: tras una nueva instalación generará nuevas claves en línea y firmará una nueva versión de root. Elija No solo si desinstala para volver a instalar de inmediato; las claves permanecen entonces en este servidor hasta que las elimine."
COM_TUF_ED_CONFIG_UNINSTALL_DESTROY_LABEL="Al desinstalar: destruir las claves en línea"
