PLG_TASK_TUFED="Tarea - TUF Extension Developer"
PLG_TASK_TUFED_ALLOWLIST_DESC="Comprueba los archivos propios de TUF_ED con la lista de archivos fijada, vuelve a calcular las sumas de comprobación de las extensiones permitidas y avisa por correo a los TUF_ED Owners si los archivos de TUF_ED no superan la comprobación o si una extensión es nueva, no está permitida o ha cambiado."
PLG_TASK_TUFED_ALLOWLIST_TITLE="TUF_ED: comprobación de extensiones"
PLG_TASK_TUFED_DRIFT_DESC="Avisa por correo a los TUF_ED Owners si se ha revertido un ajuste del paso de configuración, si un rol no tiene ninguna cuenta utilizable o si una cuenta tiene más de un rol."
PLG_TASK_TUFED_DRIFT_TITLE="TUF_ED: comprobación de la configuración"
PLG_TASK_TUFED_EXPIRY_DESC="Avisa por correo a los TUF_ED Owners 30 y 7 días antes de que caduque root.json o targets.json, y cuando uno de ellos ha caducado. También recuerda la fecha de revisión de la declaración de gestión de claves y las claves activas que no describe."
PLG_TASK_TUFED_EXPIRY_TITLE="TUF_ED: recordatorio de caducidad"
PLG_TASK_TUFED_INTEGRITY_DESC="Calcula el hash de cada archivo de la instancia de Joomla, lo compara con el estado de referencia que confirmó un Owner y avisa por correo a los TUF_ED Owners ante cualquier diferencia. El correo también enumera las carpetas excluidas. Ejecutar a diario."
PLG_TASK_TUFED_INTEGRITY_TITLE="TUF_ED: comprobación de la instancia"
PLG_TASK_TUFED_RENEW_DESC="Ejecutar cada hora. Firma nuevos snapshot y timestamp con las claves en línea cuando queda menos de la mitad de su vigencia o tras un cambio, y publica el repositorio. Se detiene (y avisa por correo a los TUF_ED Owners) mientras la instancia no esté limpia."
PLG_TASK_TUFED_RENEW_TITLE="TUF_ED: renovación de snapshot y timestamp"
PLG_TASK_TUFED_XML_DESCRIPTION="Tareas programadas de TUF_ED: recordatorios de caducidad, extensiones permitidas, desviaciones de la configuración, comprobación de la instancia y renovación horaria de snapshot y timestamp. Los correos van a todos los usuarios de TUF_ED Owner."
