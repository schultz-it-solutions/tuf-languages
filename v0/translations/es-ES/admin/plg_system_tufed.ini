PLG_SYSTEM_TUFED="Sistema - TUF Extension Developer"
PLG_SYSTEM_TUFED_MAIL_EXT_INSTALLED="Se ha instalado una extensión que no forma parte de Joomla ni de TUF.\n\nExtensión: %1$s\nVersión: %2$s\nInstalada por: %3$s\n\nSe ejecuta en el mismo proceso PHP que el código de firma. Las claves en línea no se usan hasta que se elimine o se permita expresamente (Configuración → Extensiones)."
PLG_SYSTEM_TUFED_MAIL_EXT_SUBJECT="[%s] TUF_ED: extensión instalada o actualizada"
PLG_SYSTEM_TUFED_MAIL_EXT_UPDATED="Se ha actualizado una extensión que no forma parte de Joomla ni de TUF.\n\nExtensión: %1$s\nVersión: %2$s\nActualizada por: %3$s\n\nUna autorización termina con cada cambio de la extensión: las claves en línea no se usan hasta que vuelva a permitir la nueva versión (Configuración → Extensiones)."
PLG_SYSTEM_TUFED_MAIL_FOOTER="Este mensaje lo ha enviado de inmediato el plugin de sistema de TUF_ED (plg_system_tufed) a todos los usuarios del grupo TUF_ED Owner."
PLG_SYSTEM_TUFED_MAIL_ROLES_CHANGED="Los roles de TUF_ED de una cuenta han cambiado.\n\nCuenta: %1$s\nAntes: %2$s\nAhora: %3$s\nCambiado por: %4$s\n\nSi no esperaba este cambio, compruebe la cuenta de inmediato en Usuarios → Gestionar: los TUF_ED Owners y los TUF_EDC Signers pueden firmar paquetes."
PLG_SYSTEM_TUFED_MAIL_ROLES_DELETED="Se ha eliminado una cuenta con un rol de TUF_ED.\n\nCuenta: %1$s\nRoles: %2$s\nEliminada por: %4$s\n\nCompruebe en el panel de control de TUF_ED que cada rol sigue teniendo una cuenta utilizable."
PLG_SYSTEM_TUFED_MAIL_ROLES_SUBJECT="[%s] TUF_ED: pertenencia a roles modificada"
PLG_SYSTEM_TUFED_ROLE_CONFLICT="Separación de roles de TUF_ED: la cuenta &quot;%1$s&quot; tendría %2$s. Una cuenta solo puede tener un rol de TUF_ED, y un Superusuario ninguno. Use una cuenta distinta (con su propia dirección de correo electrónico o alias) para cada rol."
PLG_SYSTEM_TUFED_WARN_INTEGRITY="<strong>TUF_ED: la instancia no coincide con su estado de referencia confirmado</strong> (%1$s). TUF_ED rechaza cualquier manejo de claves hasta que un Owner haya revisado y confirmado los cambios. <a href=\"%2$s\">Revisar los cambios</a>."
PLG_SYSTEM_TUFED_WARN_NOT_CLEAN="<strong>TUF_ED: esta instancia de Joomla no está limpia.</strong> %1$d extensión(es) no están permitidas o se han modificado desde que se permitieron: %2$s. Cada extensión se ejecuta en el mismo proceso PHP que el código de firma. <a href=\"%3$s\">Comprobar las extensiones</a>."
PLG_SYSTEM_TUFED_WARN_OWN_FILES="<strong>TUF_ED: sus propios archivos no superan la comprobación</strong> (%1$s). TUF_ED rechaza cualquier manejo de claves y la publicación hasta que se corrija. <a href=\"%2$s\">Mostrar detalles</a>."
PLG_SYSTEM_TUFED_WARN_ROLES="<strong>TUF_ED:</strong> la separación de roles no está completa (un rol no tiene ninguna cuenta utilizable o una cuenta tiene más de un rol). <a href=\"%s\">Ver el panel de control</a>."
PLG_SYSTEM_TUFED_XML_DESCRIPTION="Protege la instancia de TUF_ED: rechaza guardar una cuenta con más de un rol de TUF_ED o con un rol y Superusuario, avisa de inmediato por correo a los TUF_ED Owners cuando una cuenta gana o pierde un rol o se instala o actualiza una extensión, y muestra las advertencias de TUF_ED en cada página de la administración. Manténgalo habilitado."
